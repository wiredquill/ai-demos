[flake8]
max-line-length = 127
exclude = 
    .git,
    __pycache__,
    venv,
    .venv,
    htmlcov,
    .pytest_cache
ignore =
    E203,
    W503,
    E501,
    E402,
    F401,
    F811,
    F841,
    D100,
    D107,
    D200,
    D202,
    D401,
    D403
per-file-ignores =
    tests/*:D100,D101,D102,D103,D104

[isort]
profile = black
multi_line_output = 3
line_length = 127

[coverage:run]
source = .
omit = 
    tests/*
    venv/*
    .venv/*
    */site-packages/*
    setup.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
show_missing = True
precision = 2

[coverage:html]
directory = htmlcov