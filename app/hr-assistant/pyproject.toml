[tool.poetry]
name = "genai-demo"
version = "0.1.0"
description = ""
authors = ["Ravan Naidoo <rnaidoo@stackstate.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
openlit = "^1.44.0"
openai = "^1.53.0"
requests = "^2.32.0"  # direct dep: rag101 talks to Qdrant + OpenSearch over REST
pymilvus = {extras = ["model"], version = "^2.4.9"}
sentence-transformers = "^3.2.1"
langchain = "^0.3.6"
langchain-milvus = "^0.1.6"
langchain-huggingface = "^0.1.2"
ollama = "^0.6.2"
langchain-ollama = "^0.2.0"
pypdf = "^5.1.0"
langchainhub = "^0.1.21"
# transformers >= 4.42 calls torch.utils._pytree.register_pytree_node, which only
# exists from torch 2.2 on. Pinning torch at 2.1.2 against the current
# transformers made the image fail at import.
torch = "^2.6.0"
fastapi = {extras = ["standard"], version = "^0.115.4"}
langchain-community = "^0.3.5"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
