# Deploys the ai-compare chart to downstream clusters with Rancher Fleet.
#
# Apply to the Rancher management cluster:
#   kubectl apply -f fleet/fleet.yaml
# then label the target clusters:
#   needs-llm-suse=true   SUSE edition (SUSE Application Collection / BCI images)
#   needs-llm=true        upstream edition (community images)
#
# The GitRepo points at fleet/ai-compare, whose fleet.yaml installs the chart
# from the ai-demos Helm repository and sets the edition per cluster label.
apiVersion: fleet.cattle.io/v1alpha1
kind: GitRepo
metadata:
  name: ai-compare
  namespace: fleet-default
spec:
  repo: "https://github.com/wiredquill/ai-demos.git"
  branch: main
  paths:
    - fleet/ai-compare
  targets:
    - name: suse
      clusterSelector:
        matchLabels:
          needs-llm-suse: "true"
    - name: upstream
      clusterSelector:
        matchLabels:
          needs-llm: "true"
