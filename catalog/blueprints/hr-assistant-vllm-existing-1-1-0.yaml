apiVersion: ai-factory.suse.com/v1alpha1
kind: Blueprint
metadata:
  labels:
    ai-factory.suse.com/blueprint-name: hr-assistant-vllm-existing
    ai-factory.suse.com/blueprint-version: 1.1.0
  name: hr-assistant-vllm-existing-1-1-0
spec:
  source: Custom  # community, unsupported demo
  displayName: HR Assistant (existing vLLM)
  version: 1.1.0
  description: |
    1.1.0: the declared topology connects the components the SUSE AI view
    shows (needs the SUSE AI Declared Topology StackPack 1.2.0); components
    0.1.7.

    The HR Assistant (vLLM) blueprint without its own vLLM: the apps call a
    vLLM that already runs on the cluster, such as a vLLM Production Stack
    deployment. Use it where the GPU is already taken by that vLLM, for
    example a single-GPU DGX Spark.

    Seven components, six pods (the topology component is a CronJob):
      - qdrant        SUSE AI Qdrant vector database
      - opensearch    OpenSearch search engine (Application Collection 3.9.0)
      - hr-assistant-vllm-policy-db  HR Policy DB app + demo dashboard
      - hr-assistant-vllm-handbook   Employee Handbook RAG app
      - hr-assistant-vllm-app        HR Assistant app
      - hr-assistant-vllm-load-gen   load generator + health-check emitter
      - hr-assistant-vllm-topology   declares the SUSE AI topology up front

    Set vLLM Router URL and Model on every hr-assistant-vllm-* component.
    They default to the vllm-production-stack blueprint installed in namespace
    vllm-production-stack, serving qwen3.8-27b
    (http://vllm-router-service.vllm-production-stack.svc.cluster.local:80).
    Model is the served model name the router lists at /v1/models.

    Prerequisites on the target cluster: a running OpenAI-compatible vLLM
    router reachable from the target namespace, a default StorageClass
    (Qdrant), and the shared SUSE AI OpenTelemetry collector
    (`opentelemetry-collector` in namespace `observability`, installed from
    the ai-observability-collector chart). The topology component also needs
    SUSE Observability 2.12 or later with the SUSE AI Declared Topology
    StackPack 1.2.0 (stackpacks/suse-ai-declared-topology).
  components:
    # Install everything into one target namespace. The apps reach Qdrant and
    # OpenSearch by their Service names, so these release names are pinned:
    # qdrant -> qdrant:6333, opensearch -> opensearch-cluster-master:9200.
    # The vLLM is not part of this blueprint; the apps reach it by the full
    # Service DNS name in hr.vllmEndpoint.
    #
    # opensearch is SUSE's Application Collection chart, republished to
    # wiredquill-ai-demos with an added questions.yaml (scripts/package-aif-charts.sh).
    - chartName: qdrant
      chartRepo: suse-ai-registry
      chartVersion: "1.19.0"
      releaseName: qdrant
      vendor: suse
      values:
        persistence:
          size: 10Gi
    - chartName: opensearch
      chartRepo: wiredquill-ai-demos
      chartVersion: "3.9.0"
      releaseName: opensearch
      vendor: suse
      values:
        # The chart defaults to the build it shipped with; pin the newest SUSE build.
        image:
          tag: "3.9.0-16.6"
        # Single-node demo, security plugin off: the apps and the collector's
        # elasticsearch receiver talk plain HTTP without auth.
        singleNode: true
        replicas: 1
        protocol: http
        # The SUSE AI StackPack's OpenSearch metric bindings match
        # elasticsearch_cluster_name="opensearch-cluster".
        clusterName: opensearch-cluster
        # The shared collector creates an elasticsearch receiver for pods
        # labelled app.component=opensearch on port 9200.
        labels:
          app.component: opensearch
        opensearchJavaOpts: "-Xms512m -Xmx512m"
        extraEnvs:
          - name: DISABLE_SECURITY_PLUGIN
            value: "true"
          - name: DISABLE_INSTALL_DEMO_CONFIG
            value: "true"
        securityConfig:
          enabled: false
        persistence:
          enabled: false
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            cpu: "1"
            memory: 2Gi
    - chartName: hr-assistant-vllm-policy-db
      chartRepo: wiredquill-ai-demos
      chartVersion: "0.1.7"
      releaseName: hr-policy-db
      values:
        hr:
          vllmEndpoint: http://vllm-router-service.vllm-production-stack.svc.cluster.local:80
          model: qwen3.8-27b
    - chartName: hr-assistant-vllm-handbook
      chartRepo: wiredquill-ai-demos
      chartVersion: "0.1.7"
      releaseName: employee-handbook
      values:
        hr:
          vllmEndpoint: http://vllm-router-service.vllm-production-stack.svc.cluster.local:80
          model: qwen3.8-27b
    - chartName: hr-assistant-vllm-app
      chartRepo: wiredquill-ai-demos
      chartVersion: "0.1.7"
      releaseName: hr-assistant
      values:
        hr:
          vllmEndpoint: http://vllm-router-service.vllm-production-stack.svc.cluster.local:80
          model: qwen3.8-27b
    - chartName: hr-assistant-vllm-load-gen
      chartRepo: wiredquill-ai-demos
      chartVersion: "0.1.7"
      releaseName: load-gen
      values:
        hr:
          vllmEndpoint: http://vllm-router-service.vllm-production-stack.svc.cluster.local:80
          model: qwen3.8-27b
    # Declares the topology above (apps -> vllm -> model, hr-policy-db ->
    # qdrant / opensearch) so SUSE Observability shows it without waiting for
    # traffic. Its Model field must match the existing vLLM's served model.
    - chartName: hr-assistant-vllm-topology
      chartRepo: wiredquill-ai-demos
      chartVersion: "0.1.7"
      releaseName: topology
      values:
        hr:
          vllmEndpoint: http://vllm-router-service.vllm-production-stack.svc.cluster.local:80
          model: qwen3.8-27b
