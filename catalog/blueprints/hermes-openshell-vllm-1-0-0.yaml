apiVersion: ai-factory.suse.com/v1alpha1
kind: Blueprint
metadata:
  labels:
    ai-factory.suse.com/blueprint-name: hermes-openshell-vllm
    ai-factory.suse.com/blueprint-version: 1.0.0
  name: hermes-openshell-vllm-1-0-0
spec:
  source: Custom  # community, unsupported demo
  displayName: Hermes Agent in OpenShell (vLLM)
  version: 1.0.0
  description: |
    Nous Research's Hermes Agent running in an NVIDIA OpenShell 0.1.5 sandbox on
    SUSE BCI 16 or openSUSE Leap 16, under one of four security profiles:
    lockdown, research, developer or dangerous. Hermes runs in a browser
    terminal, and its model is served in the cluster by SUSE vLLM
    (Qwen2.5-7B-Instruct with tool calling), so nothing leaves the cluster
    unless the profile allows it.

    Four components, four pods plus the sandbox:
      - agent-sandbox       Agent Sandbox CRD + controller (agent-sandbox-system)
      - openshell-gateway   OpenShell gateway (control plane, svc/openshell)
      - vllm                SUSE vLLM (Application Collection 0.1.10): engine (GPU) + router
      - hermes-openshell    client pod: creates the Hermes sandbox under the
                            chosen profile and serves its terminal (NodePort)

    Prerequisites on the target cluster: a node with an NVIDIA GPU + GPU
    operator, with the GPU free (the engine reserves 90% of its memory), a CNI
    that enforces NetworkPolicy (RKE2's Canal/Calico/Cilium do), a default
    StorageClass (gateway database, model cache), and no earlier Agent Sandbox
    install that Helm would conflict with.
  components:
    # Install everything into one namespace: hermes-openshell reads the
    # gateway's openshell-client-tls Secret and calls https://openshell:8080.
    - chartName: agent-sandbox
      chartRepo: wiredquill-ai-demos
      chartVersion: "1.0.8"
      releaseName: agent-sandbox
    - chartName: openshell-gateway
      chartRepo: wiredquill-ai-demos
      chartVersion: "0.1.6"
      releaseName: openshell
      values:
        openshell:
          agentSandbox:
            preflight:
              # The components install in parallel, so the Agent Sandbox CRDs
              # may not be served yet when this renders; skip the render-time
              # check instead of failing the bundle.
              enabled: false
    # hermes-openshell reaches the router as vllm-router-service:80 (its form
    # default), so this release name is pinned. Same SUSE chart and form as
    # the hr-assistant-vllm blueprint.
    - chartName: vllm
      chartRepo: wiredquill-ai-demos
      chartVersion: "0.1.10"
      releaseName: vllm
      vendor: suse
      values:
        servingEngineSpec:
          enableEngine: true
          # One GPU: stop the old engine before starting the new one. The
          # chart's default rolling update (maxSurge 100%) starts a second
          # engine that cannot get GPU memory, and the rollout never finishes.
          strategy:
            type: Recreate
          runtimeClassName: nvidia
          labels:
            release: hermes
          # A map keyed "main" (not the documented list) so the install form
          # can edit it; the chart ranges over modelSpec either way.
          modelSpec:
            main:
              name: hermes-llm
              registry: dp.apps.rancher.io
              repository: containers/vllm-openai
              tag: "0.19.0-5.61"
              # Must match hermes-openshell's model.vllm.name.
              modelURL: Qwen/Qwen2.5-7B-Instruct
              # Set at deploy time for gated models; Qwen2.5 is not gated.
              hf_token: ""
              replicaCount: 1
              requestGPU: 1
              requestCPU: 2
              requestMemory: 4Gi
              limitCPU: 2
              limitMemory: 16Gi
              pvcStorage: 100Gi
              # "Default" = cluster default StorageClass (patched chart).
              storageClass: Default
              # Hermes calls chat.completions with tools=; vLLM needs both
              # flags or it rejects "auto" tool choice with a 400.
              vllmConfig:
                extraArgs:
                  - --enable-auto-tool-choice
                  - --tool-call-parser
                  - hermes
        sharedPvcStorage:
          enabled: false
        routerSpec:
          enableRouter: true
          routingLogic: roundrobin
          serviceType: ClusterIP
          repository: containers/lmcache-lmstack-router
          tag: "0.1.10-3.116"
          otel:
            # blank = no router tracing (no collector required)
            endpoint: ""
    - chartName: hermes-openshell
      chartRepo: wiredquill-ai-demos
      chartVersion: "0.1.0"
      releaseName: hermes
      values:
        profile: research
        model:
          backend: vllm
          vllm:
            url: http://vllm-router-service/v1
            name: Qwen/Qwen2.5-7B-Instruct
        sandbox:
          image: suse
        service:
          type: NodePort
