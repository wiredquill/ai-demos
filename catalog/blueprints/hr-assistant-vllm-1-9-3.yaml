apiVersion: ai-factory.suse.com/v1alpha1
kind: Blueprint
metadata:
  labels:
    ai-factory.suse.com/blueprint-name: hr-assistant-vllm
    ai-factory.suse.com/blueprint-version: 1.9.3
  name: hr-assistant-vllm-1-9-3
spec:
  source: Custom  # community, unsupported demo
  displayName: HR Assistant (vLLM)
  version: 1.9.3
  description: |
    1.9.3: the router and app Services raise SUSE Observability's HTTP
    response-time monitor to 60s deviating / 120s critical, since every
    request waits on an LLM answer; components 0.1.10. 1.9.2: the vLLM
    engine reserves a fixed 2GiB KV cache, so it starts on a 20GB GPU and
    on a DGX Spark. Needs the SUSE AI Declared Topology StackPack 1.2.0.

    Intelligent Employee Support and Policy Management served by SUSE vLLM
    (Qwen2.5-7B-Instruct), with native engine-level GenAI metrics and full
    OpenLIT observability into SUSE Observability.

    Eight components, eight pods (the topology component is a CronJob):
      - vllm          SUSE vLLM (Application Collection 0.1.10): engine (GPU) + router
      - qdrant        SUSE AI Qdrant vector database
      - opensearch    OpenSearch search engine (Application Collection 3.9.0)
      - hr-assistant-vllm-policy-db  HR Policy DB app + demo dashboard
      - hr-assistant-vllm-handbook   Employee Handbook RAG app
      - hr-assistant-vllm-app        HR Assistant app
      - hr-assistant-vllm-load-gen   load generator + health-check emitter
      - hr-assistant-vllm-topology   declares the SUSE AI topology up front

    Prerequisites on the target cluster: a node with an NVIDIA GPU + GPU
    operator (the engine reserves 40% of the GPU's memory), a
    default StorageClass (model cache, Qdrant), and the shared SUSE AI
    OpenTelemetry collector (`opentelemetry-collector` in namespace
    `observability`, installed from the ai-observability-collector chart).
    The topology component also needs SUSE Observability 2.12 or later with
    the SUSE AI Declared Topology StackPack 1.2.0
    (stackpacks/suse-ai-declared-topology).
  components:
    # Install everything into one target namespace. The apps reach the SUSE
    # charts by their Service names, so these release names are pinned:
    # vllm -> vllm-router-service:80, qdrant -> qdrant:6333, opensearch ->
    # opensearch-cluster-master:9200 (the apps' form defaults).
    #
    # vllm and opensearch are SUSE's Application Collection charts, republished
    # to wiredquill-ai-demos with an added questions.yaml (upstream ships no
    # install form) and, for vllm, catalog/charts/vllm/form-friendly-values.patch
    # so the storage class and shared NFS cache fields work
    # (scripts/package-aif-charts.sh).
    - chartName: vllm
      chartRepo: wiredquill-ai-demos
      chartVersion: "0.1.10"
      releaseName: vllm
      vendor: suse
      values:
        servingEngineSpec:
          enableEngine: true
          # One GPU: stop the old engine before starting the new one. The
          # chart's default rolling update (maxSurge 100%) starts a second
          # engine that cannot get GPU memory, and the rollout never finishes.
          strategy:
            type: Recreate
          runtimeClassName: nvidia
          # The engine image is ~4.5GB; do not pull it on every restart.
          imagePullPolicy: IfNotPresent
          # Triton needs a ptxas that knows the DGX Spark's GB10 (sm_121a). The
          # CUDA 12.8 ptxas in vllm-openai:0.19.0-5.61 (blueprint 1.9.0) does
          # not: the engine loads its weights, then exits with "PTXAS error:
          # Internal Triton PTX codegen error", with or without --enforce-eager.
          # lmcache-vllm-openai ships the CUDA 13.0 ptxas (sm_100 through
          # sm_121); point Triton at it, as the vllm-production-stack blueprint
          # does. Fine on other GPUs too.
          env:
            - name: TRITON_PTXAS_PATH
              value: /usr/lib64/python3.12/site-packages/nvidia/cu13/bin/ptxas
            - name: TRITON_PTXAS_BLACKWELL_PATH
              value: /usr/lib64/python3.12/site-packages/nvidia/cu13/bin/ptxas
          labels:
            environment: production
            release: hr-assistant
          # A map keyed "main" (not the documented list) so the install form
          # can edit it; the chart ranges over modelSpec either way.
          modelSpec:
            main:
              name: hr-assistant-llm
              registry: dp.apps.rancher.io
              # The vllm-production-stack engine image (linux/amd64 +
              # linux/arm64); it ships the CUDA 13 ptxas set above.
              repository: containers/lmcache-vllm-openai
              tag: "0.5.6-nvidia-1.7"
              modelURL: Qwen/Qwen2.5-7B-Instruct
              # Set at deploy time for gated models; Qwen2.5 is not gated.
              hf_token: ""
              replicaCount: 1
              requestGPU: 1
              requestCPU: 2
              requestMemory: 4Gi
              limitCPU: 2
              limitMemory: 16Gi
              pvcStorage: 100Gi
              # "Default" = cluster default StorageClass (patched chart).
              storageClass: Default
              # apps/rag101.py calls chat.completions with tools=; vLLM needs
              # both flags or it rejects "auto" tool choice with a 400.
              vllmConfig:
                # Startup check only: vLLM exits if this share of GPU memory
                # is not free. A DGX Spark's GPU shares its 128GB with the
                # host, so vLLM's default 0.9 fails there; 0.4 passes on the
                # Spark and on a 20GB card.
                gpuMemoryUtilization: "0.4"
                extraArgs:
                  # Size the KV cache directly; vLLM then ignores
                  # gpuMemoryUtilization for it. A share can't fit both GPUs:
                  # 0.4 of a 20GB card is less than Qwen2.5-7B's 14.3GiB of
                  # weights, and 0.9 of the Spark is more than is free. 2GiB
                  # holds ~37k Qwen2.5-7B tokens (one full 32k request) and
                  # fits next to the weights on a 20GB card. Raise it for
                  # more concurrency or larger models on bigger GPUs.
                  - --kv-cache-memory-bytes
                  - 2G
                  # Use the model's full context if it fits in that cache,
                  # else the longest that does, so the larger models in the
                  # form start instead of exiting.
                  - --max-model-len
                  - auto
                  - --enable-auto-tool-choice
                  - --tool-call-parser
                  - hermes
        # Shared NFS model cache, off by default; the form turns it on.
        sharedPvcStorage:
          enabled: false
          nfs:
            server: ""
            path: /data/ai-models
          size: 200Gi
          storageClass: Default
          accessModes:
            - ReadWriteMany
        routerSpec:
          enableRouter: true
          routingLogic: roundrobin
          serviceType: ClusterIP
          repository: containers/lmcache-lmstack-router
          tag: "0.1.10-3.116"
          otel:
            endpoint: http://opentelemetry-collector.observability.svc.cluster.local:4317
            serviceName: hr-assistant-vllm-router
          # Each request waits on an LLM answer (~17s on a DGX Spark, p95
          # ~60s), so SUSE Observability's "HTTP response time above 3s"
          # monitor would hold the router critical; raise it for this Service.
          serviceAnnotations:
            monitor.kubernetes-v2.stackstate.io/http-response-time: >-
              {"deviatingThreshold": 60.0, "deviatingTimeWindow": "5 minutes",
              "criticalThreshold": 120.0, "criticalTimeWindow": "10 minutes"}
    - chartName: qdrant
      chartRepo: suse-ai-registry
      chartVersion: "1.19.0"
      releaseName: qdrant
      vendor: suse
      values:
        persistence:
          size: 10Gi
    - chartName: opensearch
      chartRepo: wiredquill-ai-demos
      chartVersion: "3.9.0"
      releaseName: opensearch
      vendor: suse
      values:
        # The chart defaults to the build it shipped with; pin the newest SUSE build.
        image:
          tag: "3.9.0-16.6"
        # Single-node demo, security plugin off: the apps and the collector's
        # elasticsearch receiver talk plain HTTP without auth.
        singleNode: true
        replicas: 1
        protocol: http
        # The SUSE AI StackPack's OpenSearch metric bindings match
        # elasticsearch_cluster_name="opensearch-cluster".
        clusterName: opensearch-cluster
        # The shared collector creates an elasticsearch receiver for pods
        # labelled app.component=opensearch on port 9200.
        labels:
          app.component: opensearch
        opensearchJavaOpts: "-Xms512m -Xmx512m"
        extraEnvs:
          - name: DISABLE_SECURITY_PLUGIN
            value: "true"
          - name: DISABLE_INSTALL_DEMO_CONFIG
            value: "true"
        securityConfig:
          enabled: false
        persistence:
          enabled: false
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            cpu: "1"
            memory: 2Gi
    - chartName: hr-assistant-vllm-policy-db
      chartRepo: wiredquill-ai-demos
      chartVersion: "0.1.10"
      releaseName: hr-policy-db
    - chartName: hr-assistant-vllm-handbook
      chartRepo: wiredquill-ai-demos
      chartVersion: "0.1.10"
      releaseName: employee-handbook
    - chartName: hr-assistant-vllm-app
      chartRepo: wiredquill-ai-demos
      chartVersion: "0.1.10"
      releaseName: hr-assistant
    - chartName: hr-assistant-vllm-load-gen
      chartRepo: wiredquill-ai-demos
      chartVersion: "0.1.10"
      releaseName: load-gen
    # Declares the topology above (apps -> vllm -> model, hr-policy-db ->
    # qdrant / opensearch) so SUSE Observability shows it without waiting for
    # traffic. Its Model field must match the vllm component's model.
    - chartName: hr-assistant-vllm-topology
      chartRepo: wiredquill-ai-demos
      chartVersion: "0.1.10"
      releaseName: topology
