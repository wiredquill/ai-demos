apiVersion: ai-factory.suse.com/v1alpha1
kind: Blueprint
metadata:
  labels:
    ai-factory.suse.com/blueprint-name: hr-assistant-vllm
    ai-factory.suse.com/blueprint-version: 1.3.0
  name: hr-assistant-vllm-1-3-0
spec:
  # Superseded by 1.4.0 (SUSE vLLM, Qdrant and OpenSearch charts). Kept for rollback.
  deprecated: true
  source: Custom  # community, unsupported demo
  displayName: HR Assistant (vLLM)
  version: 1.3.0
  description: |
    Intelligent Employee Support and Policy Management served by SUSE vLLM
    (Qwen2.5-7B-Instruct), with native engine-level GenAI metrics and full
    OpenLIT observability into SUSE Observability.

    Eight components, one per pod, each with its own install form:
      - hr-assistant-vllm-engine      SUSE vLLM serving engine (GPU)
      - hr-assistant-vllm-router      SUSE vLLM router (OpenAI API entry point)
      - hr-assistant-vllm-qdrant      SUSE AI Qdrant vector database
      - hr-assistant-vllm-opensearch  OpenSearch search engine
      - hr-assistant-vllm-policy-db   HR Policy DB app + demo dashboard
      - hr-assistant-vllm-handbook    Employee Handbook RAG app
      - hr-assistant-vllm-app         HR Assistant app
      - hr-assistant-vllm-load-gen    load generator + health-check emitter

    Prerequisites on the target cluster: a node with an NVIDIA GPU + GPU
    operator (the engine requests 1 GPU), a default StorageClass (model
    cache), and the shared SUSE AI OpenTelemetry collector
    (`opentelemetry-collector` in namespace `observability`, installed from
    the ai-observability-collector chart).
  components:
    # Install all eight into one target namespace. The components reach each
    # other by Service name: the app charts share fullnameOverride
    # "hr-assistant-vllm" (hr-assistant-vllm-<workload>), and the router is
    # pinned to release "vllm" (Service vllm-router-service, the default vLLM
    # Router URL in the app forms). Defaults and forms come from each chart's
    # values.yaml and questions.yaml.
    - chartName: hr-assistant-vllm-engine
      chartRepo: wiredquill-ai-demos
      chartVersion: "0.1.0"
      releaseName: vllm-engine
    - chartName: hr-assistant-vllm-router
      chartRepo: wiredquill-ai-demos
      chartVersion: "0.1.0"
      releaseName: vllm
    - chartName: hr-assistant-vllm-qdrant
      chartRepo: wiredquill-ai-demos
      chartVersion: "0.1.0"
      releaseName: qdrant
    - chartName: hr-assistant-vllm-opensearch
      chartRepo: wiredquill-ai-demos
      chartVersion: "0.1.0"
      releaseName: opensearch
    - chartName: hr-assistant-vllm-policy-db
      chartRepo: wiredquill-ai-demos
      chartVersion: "0.1.0"
      releaseName: hr-policy-db
    - chartName: hr-assistant-vllm-handbook
      chartRepo: wiredquill-ai-demos
      chartVersion: "0.1.0"
      releaseName: employee-handbook
    - chartName: hr-assistant-vllm-app
      chartRepo: wiredquill-ai-demos
      chartVersion: "0.1.0"
      releaseName: hr-assistant
    - chartName: hr-assistant-vllm-load-gen
      chartRepo: wiredquill-ai-demos
      chartVersion: "0.1.0"
      releaseName: load-gen
