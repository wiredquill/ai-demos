apiVersion: ai-factory.suse.com/v1alpha1
kind: Blueprint
metadata:
  labels:
    ai-factory.suse.com/blueprint-name: hermes-openshell
    ai-factory.suse.com/blueprint-version: 1.0.0
  name: hermes-openshell-1-0-0
spec:
  source: Custom  # community, unsupported demo
  displayName: Hermes Agent in OpenShell
  version: 1.0.0
  description: |
    Nous Research's Hermes Agent running in an NVIDIA OpenShell 0.1.5 sandbox on
    SUSE BCI 16 or openSUSE Leap 16, under one of four security profiles:
    lockdown, research, developer or dangerous. Hermes runs in a browser
    terminal. The model is an OpenAI-compatible API (OpenRouter by default),
    whose key the OpenShell gateway holds so it never enters the sandbox. For
    a model served in the cluster, use hermes-openshell-vllm.

    Three components, three pods plus the sandbox:
      - agent-sandbox       Agent Sandbox CRD + controller (agent-sandbox-system)
      - openshell-gateway   OpenShell gateway (control plane, svc/openshell)
      - hermes-openshell    client pod: creates the Hermes sandbox under the
                            chosen profile and serves its terminal (NodePort)

    Prerequisites on the target cluster: a CNI that enforces NetworkPolicy
    (RKE2's Canal/Calico/Cilium do), a default StorageClass for the gateway
    database, no earlier Agent Sandbox install that Helm would conflict with,
    and an API key for the model provider (set in the hermes-openshell form).
  components:
    # Install everything into one namespace: hermes-openshell reads the
    # gateway's openshell-client-tls Secret and calls https://openshell:8080.
    - chartName: agent-sandbox
      chartRepo: wiredquill-ai-demos
      chartVersion: "1.0.8"
      releaseName: agent-sandbox
    - chartName: openshell-gateway
      chartRepo: wiredquill-ai-demos
      chartVersion: "0.1.6"
      releaseName: openshell
      values:
        openshell:
          agentSandbox:
            preflight:
              # The components install in parallel, so the Agent Sandbox CRDs
              # may not be served yet when this renders; skip the render-time
              # check instead of failing the bundle.
              enabled: false
    - chartName: hermes-openshell
      chartRepo: wiredquill-ai-demos
      chartVersion: "0.1.0"
      releaseName: hermes
      values:
        profile: research
        model:
          backend: external
          external:
            url: https://openrouter.ai/api/v1
            name: nousresearch/hermes-4-70b
            # Set at deploy time (the form's API key field).
            apiKey: ""
        sandbox:
          image: suse
        service:
          type: NodePort
