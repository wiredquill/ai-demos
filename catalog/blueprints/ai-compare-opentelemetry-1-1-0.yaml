apiVersion: ai-factory.suse.com/v1alpha1
kind: Blueprint
metadata:
  labels:
    ai-factory.suse.com/blueprint-name: ai-compare-opentelemetry
    ai-factory.suse.com/blueprint-version: 1.1.0
  name: ai-compare-opentelemetry-1-1-0
spec:
  source: Custom  # community, unsupported demo
  displayName: AI Compare (OpenTelemetry)
  version: 1.1.0
  description: |
    AI Compare OpenTelemetry Edition: compares direct Ollama answers with
    pipeline-enhanced Open WebUI answers, with GenAI telemetry, token and cost
    tracking, and the SUSE AI topology in SUSE Observability.

    Components (each a separate SUSE AI Factory application):
      - ollama               SUSE Ollama (Application Collection), llama3.2
      - open-webui-pipelines SUSE Open WebUI Pipelines, loading the
                             response-level pipeline from this repository
      - open-webui           SUSE Open WebUI, wired to Ollama and Pipelines
      - ai-compare-opentelemetry  the AI Compare app (SUSE BCI Python),
                             load generator and a SUSE AI OpenTelemetry
                             collector (operator mode)

    Prerequisites on the target cluster: an NVIDIA GPU + GPU operator for
    Ollama, a default StorageClass, the OpenTelemetry Operator, and the SUSE
    Observability API key Secret `open-telemetry-collector` (key API_KEY) in
    namespace `observability`. The SUSE Observability endpoints below default
    to the demo backend; change them in the Configuration step for another
    backend.
  components:
    # Release names are pinned so the components find each other by Service
    # name in the shared target namespace: ollama-service:11434,
    # pipelines-service:9099, open-webui:80, and
    # ai-compare-opentelemetry-otel-collector for telemetry.
    - chartName: ollama
      chartRepo: application-collection
      chartVersion: "1.76.0"
      releaseName: ollama-service
      values:
        image:
          tag: "0.34.4-11.97"
        runtimeClassName: nvidia
        # Ollama 0.34 sizes the default context from GPU memory (32k on a
        # 24 GB card); the demo prompts are short, so pin it.
        extraEnv:
          - name: OLLAMA_CONTEXT_LENGTH
            value: "4096"
        ollama:
          gpu:
            enabled: true
            type: nvidia
            number: 1
          models:
            pull:
              - llama3.2:latest
        # Ollama 0.34 keeps the loaded model and its runner in host memory.
        resources:
          requests:
            cpu: "1"
            memory: 4Gi
          limits:
            cpu: "2"
            memory: 8Gi
        persistentVolume:
          enabled: true
          size: 10Gi
    - chartName: open-webui-pipelines
      chartRepo: application-collection
      chartVersion: "0.9.2"
      releaseName: pipelines-service
      values:
        image:
          tag: "0.20250819.030501-8.103"
        extraEnvVars:
          - name: PIPELINES_URLS
            value: "https://raw.githubusercontent.com/wiredquill/ai-demos/main/pipelines/response_level_pipeline.py"
          - name: PIPELINE_MODE
            value: auto-cycle
          - name: LOG_LEVEL
            value: INFO
          - name: OLLAMA_BASE_URL
            value: http://ollama-service:11434
          - name: OLLAMA_API_BASE_URL
            value: http://ollama-service:11434
    - chartName: open-webui
      chartRepo: application-collection
      chartVersion: "8.19.1"
      releaseName: open-webui
      values:
        # 0.6.41-15.13 is the newest SUSE build that starts: later 0.6.41
        # builds lack langchain.text_splitter and 0.8.0 builds lack mimeparse.
        image:
          tag: "0.6.41-15.13"
        ollama:
          enabled: false
        ollamaUrls:
          - http://ollama-service:11434
        pipelines:
          enabled: false
        enableOpenaiApi: true
        # External Pipelines: the chart only emits OPENAI_API_BASE_URL(S) for
        # the list form when its own pipelines subchart is enabled, so use the
        # single-endpoint form.
        openaiBaseApiUrl: http://pipelines-service:9099
        openaiApiKey: "0p3n-w3bu!"
        tika:
          enabled: false
        websocket:
          enabled: false
        ingress:
          enabled: false
        extraEnvVars:
          - name: WEBUI_AUTH
            value: "false"
          - name: ENABLE_OTEL
            value: "true"
          - name: ENABLE_OTEL_METRICS
            value: "true"
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://ai-compare-opentelemetry-otel-collector:4317
          - name: OTEL_EXPORTER_OTLP_INSECURE
            value: "true"
          - name: OTEL_SERVICE_NAME
            value: open-webui
    - chartName: ai-compare-opentelemetry
      chartRepo: wiredquill-ai-demos
      chartVersion: "0.1.551"
      releaseName: ai-compare-opentelemetry
      values:
        # Ollama, Open WebUI and Pipelines come from the components above.
        ollama:
          enabled: false
          url: http://ollama-service:11434
        openWebui:
          enabled: false
          url: http://open-webui:80
        pipelines:
          enabled: false
          url: http://pipelines-service:9099
        observability:
          mode: operator
        opentelemetry:
          operator:
            suseObservability:
              apiUrl: https://observability.mort.dna-42.com
              otlpEndpoint: otlp-observability.mort.dna-42.com:443
