# dangerous: as open as OpenShell 0.1.5 allows. Any program may reach any
# subdomain of the common TLDs and the bare domains listed below, over HTTP or
# HTTPS, and Hermes runs its commands without asking (approvals: off). For
# showing what an unconstrained agent does, never for real data.
#
# OpenShell can't express "any host": a wildcard needs a label under the TLD
# ("**.*.com", never "*.com"), so bare domains are listed by name. Raw IP
# addresses (allowed_ips) are left out: the 0.1.5 gateway rejects a policy
# that mixes them with these host rules. Wildcard hosts never resolve to
# private addresses, so cluster Services stay unreachable.
#
# What still holds, because OpenShell enforces it whatever the policy says:
#   - no root (run_as_user must not be 0)
#   - no loopback, link-local or cloud metadata (169.254.169.254)
#   - no Kubernetes API / etcd / kubelet ports (6443, 2379, 2380, 10250, 10255)
#   - no writes to /: read_write may not contain "/"
version: 1
filesystem_policy:
  read_only:
    - /usr
    - /opt
    - /lib
    - /lib64
    - /etc
    - /var
    - /srv
  read_write:
    - /home
    - /tmp
    - /var/tmp
    # pseudo-terminals for ttyd's hermes sessions (not in OpenShell's baseline)
    - /dev/ptmx
    - /dev/pts
    - /dev/tty
landlock:
  # run even where the kernel can't enforce the filesystem rules
  compatibility: best_effort
process:
  run_as_user: "10001"
  run_as_group: "10001"
network_policies:
  anywhere:
    name: anywhere
    endpoints:
      # every subdomain of these TLDs (no protocol = plain L4 relay, no L7 checks)
      - {host: "**.*.com", ports: [80, 443]}
      - {host: "**.*.org", ports: [80, 443]}
