name: Simple Content Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create basic test content
        run: |
          mkdir -p test-output

          echo "Testing content generation..."

          # Create simple index.yaml
          cat > test-output/index.yaml << 'EOF'
          apiVersion: v1
          entries:
            ai-compare:
            - name: ai-compare
              version: 0.1.4
            ai-compare-suse:
            - name: ai-compare-suse
              version: 0.1.4
            ai-compare-opentelemetry:
            - name: ai-compare-opentelemetry
              version: 0.1.4
          EOF

          # Create simple index.html
          echo "<h1>Test Successful</h1>" > test-output/index.html

      - name: Show results
        run: |
          echo "=== Files created ==="
          ls -la test-output/

          echo "=== index.yaml content ==="
          cat test-output/index.yaml

          echo "=== Success! ==="
          echo "✅ Basic content generation works"
          echo "✅ Ready to apply to greendocs"