# .github/workflows/ci-cd.yaml
name: Build, Push, and Update AI Compare Charts (upstream & SUSE)

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'frontend/**'
      - 'frontend-react/**'
      - 'charts/**'
      - 'scripts/gen-ai-compare-upstream.py'
      - '.github/workflows/ci-cd.yaml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # Decide which images actually need rebuilding. The filters mirror the
  # COPY lines of each Dockerfile, so keep them in sync when a Dockerfile
  # starts copying a new file. A manual run (workflow_dispatch) builds all.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ai-compare: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.ai-compare == 'true' }}
      load-simulator: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.load-simulator == 'true' }}
      frontend-react: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend-react == 'true' }}
      chart: ${{ steps.filter.outputs.chart == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ai-compare:
              - 'app/Dockerfile.suse'
              - 'app/Dockerfile.upstream'
              - 'app/requirements.txt'
              - 'app/pricing.json'
              - 'app/python-ollama-open-webui.py'
              - 'app/ollama_openai_client.py'
              - 'app/openlit_init.py'
              - 'app/suse_ai_metrics.py'
              - 'app/health_check_emitter.py'
              - 'app/ui/**'
            load-simulator:
              - 'frontend/Dockerfile'
              - 'frontend/load_simulator.py'
            frontend-react:
              - 'frontend-react/**'
            chart:
              - 'charts/ai-compare/**'
              - 'scripts/gen-ai-compare-upstream.py'

      - name: Show build plan
        run: |
          echo "ai-compare images:    ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.ai-compare == 'true' }}"
          echo "load-simulator image: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.load-simulator == 'true' }}"
          echo "frontend-react image: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend-react == 'true' }}"
          echo "ai-compare chart:     ${{ steps.filter.outputs.chart == 'true' }}"

  # TODO: Re-enable tests after fixing Python 3.11 compatibility issues
  # test:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout repository
  #       uses: actions/checkout@v4
  #
  #     - name: Set up Python 3.11
  #       uses: actions/setup-python@v4
  #       with:
  #         python-version: 3.11
  #
  #     - name: Install dependencies
  #       run: |
  #         cd app
  #         python -m pip install --upgrade pip
  #         pip install -r requirements.txt
  #         pip install -r test-requirements.txt
  #
  #     - name: Run tests
  #       run: |
  #         cd app
  #         python -m pytest tests/ -v --tb=short

  build-and-push-images:
    needs: changes
    if: needs.changes.outputs.ai-compare == 'true' || needs.changes.outputs.load-simulator == 'true' || needs.changes.outputs.frontend-react == 'true'
    runs-on: ubuntu-latest
    outputs:
      IMAGE_TAG: ${{ steps.image_meta.outputs.IMAGE_TAG }}
    steps:
      - name: Notify build start
        run: |
          curl -d "GitHub Actions started - Building AI Compare images..." ntfy.sh/wq_task

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tag and lowercase owner
        id: image_meta
        run: |
          TAG=$(echo $GITHUB_SHA | cut -c1-7)
          echo "Generated tag: $TAG"
          echo "GITHUB_SHA: $GITHUB_SHA"

          # Fallback to 'latest' if TAG is empty
          if [ -z "$TAG" ]; then
            TAG="latest"
            echo "Warning: GITHUB_SHA was empty, using 'latest' as fallback"
          fi

          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV
          echo "IMAGE_TAG=$TAG" >> $GITHUB_OUTPUT
          echo "Final tag: $TAG"

          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "OWNER_LC=$OWNER_LC" >> $GITHUB_ENV
          echo "Lowercase Owner: $OWNER_LC"

          echo "BASE_IMAGE_NAME=${{ github.event.repository.name }}" >> $GITHUB_ENV
          echo "SUSE_IMAGE_NAME=${{ github.event.repository.name }}-suse" >> $GITHUB_ENV

      - name: Build and push upstream Docker image
        if: needs.changes.outputs.ai-compare == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: app/Dockerfile.upstream
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ env.BASE_IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.OWNER_LC }}/${{ env.BASE_IMAGE_NAME }}:latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push SUSE Docker image
        if: needs.changes.outputs.ai-compare == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: app/Dockerfile.suse
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ env.SUSE_IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.OWNER_LC }}/${{ env.SUSE_IMAGE_NAME }}:latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Load Simulator Docker image
        if: needs.changes.outputs.load-simulator == 'true'
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ env.BASE_IMAGE_NAME }}-load-simulator:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.OWNER_LC }}/${{ env.BASE_IMAGE_NAME }}-load-simulator:latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push React Frontend Docker image
        if: needs.changes.outputs.frontend-react == 'true'
        uses: docker/build-push-action@v5
        with:
          context: frontend-react
          file: frontend-react/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ env.BASE_IMAGE_NAME }}-frontend-react:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.OWNER_LC }}/${{ env.BASE_IMAGE_NAME }}-frontend-react:latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # Bump the chart when its app image was rebuilt or the chart itself changed
  # (gh-pages is republished from scratch, so a chart edit without a version
  # bump never reaches Rancher). The image tag only moves on a new image.
  update-and-commit-charts:
    needs: [changes, build-and-push-images]
    if: >-
      !failure() && !cancelled() &&
      (needs.changes.outputs.ai-compare == 'true' || needs.changes.outputs.chart == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq
          yq --version

      - name: Update Helm Chart values.yaml
        if: needs.changes.outputs.ai-compare == 'true'
        run: |
          # One chart for both editions; ai-demos and ai-demos-suse share the tag
          VALUES_PATH="charts/ai-compare/values.yaml"
          NEW_IMAGE_TAG="${{ needs.build-and-push-images.outputs.IMAGE_TAG }}"

          echo "Updating $VALUES_PATH with image tag: $NEW_IMAGE_TAG"
          yq eval ".aiCompare.image.tag = \"$NEW_IMAGE_TAG\"" -i "$VALUES_PATH"
          cat "$VALUES_PATH"

      - name: Increment Chart.yaml versions
        run: |
          CHART_PATH="charts/ai-compare/Chart.yaml"

          increment_version() {
            local chart_path=$1
            local current_version=$(yq eval '.version' "$chart_path")
            IFS='.' read -r major minor patch <<< "$current_version"
            new_patch=$((patch + 1))
            new_version="$major.$minor.$new_patch"
            yq eval ".version = \"$new_version\"" -i "$chart_path"
            echo "Updated $chart_path to version: $new_version"
            cat "$chart_path"
          }

          increment_version "$CHART_PATH"

      - name: Regenerate ai-compare-upstream from ai-compare
        run: python3 scripts/gen-ai-compare-upstream.py .

      - name: Commit and push updated Helm chart files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git add "charts/ai-compare/values.yaml" "charts/ai-compare/Chart.yaml" charts/ai-compare-upstream

          if git diff --staged --quiet; then
            echo "No changes to commit in Helm chart files."
          else
            if [ "${{ needs.changes.outputs.ai-compare }}" = "true" ]; then
              git commit -m "CI: Update Helm chart image tags to ${{ needs.build-and-push-images.outputs.IMAGE_TAG }} and increment chart versions"
            else
              git commit -m "CI: Increment chart versions for chart changes"
            fi

            # Pull and handle any conflicts gracefully
            echo "Pulling latest changes before push..."
            if ! git pull origin main --no-edit; then
              echo "Merge conflicts detected, attempting to resolve automatically..."
              # For chart files, prefer our changes (the new image tags)
              git checkout --ours charts/*/Chart.yaml charts/*/values.yaml 2>/dev/null || true
              git add charts/*/Chart.yaml charts/*/values.yaml 2>/dev/null || true
              if git diff --staged --quiet; then
                echo "No conflicts to resolve"
                git merge --abort 2>/dev/null || true
              else
                git commit -m "Resolve merge conflicts in chart files - prefer new image tags" 2>/dev/null || true
              fi
            fi

            # Push with retry logic
            for i in {1..3}; do
              if git push; then
                echo "Successfully pushed updated Helm chart files to repository."
                break
              else
                echo "Push failed, attempt $i/3. Pulling again..."
                git pull origin main --no-edit 2>/dev/null || true
                if [ $i -eq 3 ]; then
                  echo "Failed to push after 3 attempts, but continuing..."
                  break
                fi
              fi
            done
          fi

      - name: Notify build completion
        run: |
          curl -d "GitHub Actions build complete - AI Compare updated with tag ${{ needs.build-and-push-images.outputs.IMAGE_TAG }}" ntfy.sh/wq_task
