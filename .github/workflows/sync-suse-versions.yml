name: Sync SUSE Application Collection Versions

on:
  # Run weekly on Mondays at 9 AM UTC
  schedule:
    - cron: '0 9 * * 1'

  # Allow manual triggering
  workflow_dispatch:
    inputs:
      config_file:
        description: 'Configuration file to use'
        required: false
        default: 'ai-demos-sync-config.yaml'
        type: choice
        options:
          - 'ai-demos-sync-config.yaml'
          - 'suse-sync-config.yaml'
      dry_run:
        description: 'Run in dry-run mode (no changes made)'
        required: false
        default: false
        type: boolean
      verbose:
        description: 'Enable verbose logging'
        required: false
        default: false
        type: boolean

jobs:
  sync-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.12.0'

      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('scripts/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Configure Git
        run: |
          git config --global user.name 'SUSE Sync Bot'
          git config --global user.email 'noreply@github.com'

      - name: Login to SUSE Application Collection Registry (if credentials available)
        if: ${{ secrets.SUSE_REGISTRY_USERNAME != '' }}
        run: |
          echo "${{ secrets.SUSE_REGISTRY_PASSWORD }}" | helm registry login dp.apps.rancher.io --username "${{ secrets.SUSE_REGISTRY_USERNAME }}" --password-stdin
        continue-on-error: true

      - name: Determine run parameters
        id: params
        run: |
          # Set parameters based on workflow trigger
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "config_file=${{ github.event.inputs.config_file }}" >> $GITHUB_OUTPUT
            echo "dry_run=${{ github.event.inputs.dry_run }}" >> $GITHUB_OUTPUT
            echo "verbose=${{ github.event.inputs.verbose }}" >> $GITHUB_OUTPUT
          else
            # Default for scheduled runs
            echo "config_file=ai-demos-sync-config.yaml" >> $GITHUB_OUTPUT
            echo "dry_run=false" >> $GITHUB_OUTPUT
            echo "verbose=true" >> $GITHUB_OUTPUT
          fi

      - name: Run SUSE version synchronization (Dry Run Check)
        id: dry_run_check
        run: |
          cd scripts

          # Always run dry-run first to check what would change
          echo "::group::Dry Run - Checking for Updates"

          dry_run_args="--config ${{ steps.params.outputs.config_file }} --dry-run"
          if [[ "${{ steps.params.outputs.verbose }}" == "true" ]]; then
            dry_run_args="$dry_run_args --verbose"
          fi

          if ./sync-suse-versions.sh $dry_run_args; then
            echo "dry_run_success=true" >> $GITHUB_OUTPUT
            echo "::notice::Dry run completed successfully"
          else
            echo "dry_run_success=false" >> $GITHUB_OUTPUT
            echo "::error::Dry run failed"
            exit 1
          fi

          echo "::endgroup::"

      - name: Run SUSE version synchronization (Live Update)
        id: live_sync
        if: steps.dry_run_check.outputs.dry_run_success == 'true' && steps.params.outputs.dry_run == 'false'
        run: |
          cd scripts

          echo "::group::Live Sync - Applying Updates"

          sync_args="--config ${{ steps.params.outputs.config_file }}"
          if [[ "${{ steps.params.outputs.verbose }}" == "true" ]]; then
            sync_args="$sync_args --verbose"
          fi

          if ./sync-suse-versions.sh $sync_args; then
            echo "sync_success=true" >> $GITHUB_OUTPUT
            echo "::notice::Synchronization completed successfully"
          else
            echo "sync_success=false" >> $GITHUB_OUTPUT
            echo "::error::Synchronization failed"
            exit 1
          fi

          echo "::endgroup::"

      - name: Check for changes
        id: changes
        if: steps.params.outputs.dry_run == 'false'
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "::notice::No changes to commit"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "::notice::Changes detected"

            # Show changed files
            echo "::group::Changed Files"
            git diff --name-only
            echo "::endgroup::"

            # Show diff summary
            echo "::group::Diff Summary"
            git diff --stat
            echo "::endgroup::"
          fi

      - name: Generate change summary
        id: summary
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          # Create a summary of changes for the PR description
          cat > change_summary.md << 'EOF'
          ## SUSE Application Collection Version Sync

          This automated PR updates container versions based on the latest SUSE Application Collection releases.

          ### Configuration Used
          - **Config File**: ${{ steps.params.outputs.config_file }}
          - **Trigger**: ${{ github.event_name }}
          - **Timestamp**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')

          ### Changed Files
          EOF

          # Add changed files to summary
          git diff --name-only | sed 's/^/- /' >> change_summary.md

          echo "" >> change_summary.md
          echo "### Version Changes" >> change_summary.md

          # Extract version changes from recent sync summary file
          if [[ -f scripts/sync-summary-*.txt ]]; then
            latest_summary=$(ls -t scripts/sync-summary-*.txt | head -1)
            echo "Based on: $(basename "$latest_summary")" >> change_summary.md
            echo "" >> change_summary.md
            echo '```' >> change_summary.md
            grep -A 20 "VERSION SUMMARY:" "$latest_summary" | head -25 >> change_summary.md || echo "No version summary available" >> change_summary.md
            echo '```' >> change_summary.md
          fi

          echo "" >> change_summary.md
          echo "### Validation" >> change_summary.md
          echo "- ✅ Dry run completed successfully" >> change_summary.md
          echo "- ✅ Live sync completed successfully" >> change_summary.md
          echo "- ✅ Changes validated and ready for review" >> change_summary.md

          # Read summary into output
          {
            echo 'pr_body<<EOF'
            cat change_summary.md
            echo EOF
          } >> $GITHUB_OUTPUT

      - name: Upload sync reports as artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: suse-sync-reports-${{ github.run_number }}
          path: |
            scripts/suse-sync.log
            scripts/sync-summary-*.txt
            scripts/reports/
            scripts/*.backup-*
          retention-days: 30

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            chore: sync SUSE Application Collection versions

            Automated update of container versions from SUSE Application Collection.
            Configuration: ${{ steps.params.outputs.config_file }}
            Triggered by: ${{ github.event_name }}
          title: "chore: sync SUSE Application Collection versions"
          body: ${{ steps.summary.outputs.pr_body }}
          branch: sync/suse-versions-${{ github.run_number }}
          delete-branch: true
          labels: |
            automated
            dependencies
            suse
            helm
          assignees: ${{ github.actor }}
          reviewers: ${{ github.repository_owner }}

      - name: Comment on PR for manual trigger
        if: steps.changes.outputs.has_changes == 'true' && github.event_name == 'workflow_dispatch'
        uses: peter-evans/create-or-update-comment@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ steps.pr.outputs.pull-request-number }}
          body: |
            🤖 **Manual Sync Triggered**

            This PR was created from a manual workflow dispatch by @${{ github.actor }}.

            **Parameters:**
            - Config: `${{ steps.params.outputs.config_file }}`
            - Dry Run: `${{ steps.params.outputs.dry_run }}`
            - Verbose: `${{ steps.params.outputs.verbose }}`

      - name: Send notification on failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            const title = "SUSE Version Sync Failed";
            const body = `The SUSE Application Collection version synchronization workflow failed.

            **Workflow Run:** [${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            **Trigger:** ${context.eventName}
            **Configuration:** ${{ steps.params.outputs.config_file }}

            Please check the workflow logs for details.`;

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'automation', 'suse-sync']
            });

      - name: Summary
        if: always()
        run: |
          echo "## SUSE Version Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Config**: ${{ steps.params.outputs.config_file }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Dry Run**: ${{ steps.params.outputs.dry_run }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Verbose**: ${{ steps.params.outputs.verbose }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ steps.dry_run_check.outputs.dry_run_success }}" == "true" ]]; then
            echo "✅ **Dry Run**: Successful" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Dry Run**: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ steps.params.outputs.dry_run }}" == "false" ]]; then
            if [[ "${{ steps.live_sync.outputs.sync_success }}" == "true" ]]; then
              echo "✅ **Live Sync**: Successful" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ **Live Sync**: Failed" >> $GITHUB_STEP_SUMMARY
            fi

            if [[ "${{ steps.changes.outputs.has_changes }}" == "true" ]]; then
              echo "📝 **Changes**: PR created with updates" >> $GITHUB_STEP_SUMMARY
            else
              echo "📝 **Changes**: No updates needed" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "🔍 **Mode**: Dry run only - no changes applied" >> $GITHUB_STEP_SUMMARY
          fi
