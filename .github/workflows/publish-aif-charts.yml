name: Publish AI Factory Charts

# Packages the blueprint component charts (catalog/components/*) and the
# hr-assistant base charts onto the aif/charts branch, the git ClusterRepo
# (catalog/clusterrepos/wiredquill-ai-demos.yaml) SUSE AI Factory reads.
# Chart versions are immutable: bump a chart's version to ship it.
on:
  push:
    branches: [main]
    paths:
      - 'catalog/components/**'
      - 'charts/hr-assistant/**'
      - 'charts/hr-assistant-vllm/**'
      - 'charts/ai-compare/**'
      - 'scripts/publish-aif-charts.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-aif-charts
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # charts/hr-assistant pulls its ollama dependency from the Application
      # Collection, which needs a login (same secrets as simple-chart-publish).
      - name: Log in to SUSE Application Collection
        run: |
          helm registry login dp.apps.rancher.io \
            --username "${{ secrets.APPCOLLECTION_USERNAME }}" \
            --password "${{ secrets.APPCOLLECTION_PASSWORD }}"

      - name: Publish
        run: scripts/publish-aif-charts.sh --push
