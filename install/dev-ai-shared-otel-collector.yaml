# Shared cluster OpenTelemetry collector for dev-ai (namespace: observability),
# managed by the OpenTelemetry Operator. Apply with:
#
#   kubectl apply -f install/dev-ai-shared-otel-collector.yaml
#
# Requires the `open-telemetry-collector` Secret (key API_KEY) in the
# observability namespace. Image is the SUSE Application Collection build.
#
# Role split with the hr-assistant-vllm chart (observability.mode=operator):
#   - this collector: cluster-wide vLLM engine scrape + GPU (DCGM) scrape, and
#     the generic OTLP intake for workloads without their own collector
#   - the chart's own collector: app OTLP, SUSE AI topology exporter, span
#     metrics, Qdrant + OpenSearch for that release
# vLLM is scraped here only, so the engine is never double-counted.
#
# SUSE Observability 2.10.x compatibility:
#   - `vllm:` metric names are renamed to `vllm_` (2.6.2+ drops colon names)
#   - vLLM 0.19 renamed two metrics the built-in vLLM dashboard still queries;
#     they are aliased back (kv_cache_usage_perc, request_time_per_output_token)
#   - engine metrics are tagged suse.ai.component.type=inference-engine with
#     component name "vllm", the same identity the app-level gen_ai.* pipeline
#     produces, so both overlay one SUSE AI component
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: opentelemetry-collector
  namespace: observability
spec:
  mode: deployment
  replicas: 1
  image: dp.apps.rancher.io/containers/opentelemetry-collector:0.160.0-k8s-14.13
  env:
    - name: MY_POD_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
    - name: K8S_CLUSTER_NAME
      value: dev-ai
    - name: API_KEY
      valueFrom:
        secretKeyRef:
          key: API_KEY
          name: open-telemetry-collector
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      prometheus:
        config:
          scrape_configs:
            # vLLM serving engines only (vLLM production-stack labels). The
            # router also carries part-of=vllm, but its per-backend `vllm:`
            # stats share names with the engine's own metrics and would
            # double-count in the SUSE Observability vLLM dashboards. Only the
            # engine's HTTP port (80) serves /metrics; the ZMQ/UCX ports
            # (55555/9999) refuse HTTP.
            - job_name: vllm
              scrape_interval: 10s
              metrics_path: /metrics
              scheme: http
              kubernetes_sd_configs:
                - role: service
              relabel_configs:
                - action: keep
                  source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_part_of]
                  regex: vllm
                - action: keep
                  source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_component]
                  regex: serving-engine
                - action: keep
                  source_labels: [__meta_kubernetes_service_port_number]
                  regex: "80"
                # Carried to the resource by transform/vllm below
                - action: replace
                  source_labels: [__meta_kubernetes_namespace]
                  target_label: k8s_namespace_name
              metric_relabel_configs:
                - source_labels: [__name__]
                  regex: 'vllm:(.*)'
                  target_label: __name__
                  replacement: 'vllm_$1'
                - source_labels: [__name__]
                  regex: 'vllm_kv_cache_usage_perc(.*)'
                  target_label: __name__
                  replacement: 'vllm_gpu_cache_usage_perc$1'
                - source_labels: [__name__]
                  regex: 'vllm_request_time_per_output_token_seconds(.*)'
                  target_label: __name__
                  replacement: 'vllm_time_per_output_token_seconds$1'
            - job_name: gpu-metrics
              scrape_interval: 15s
              scheme: http
              kubernetes_sd_configs:
                - role: endpoints
              relabel_configs:
                - action: keep
                  source_labels: [__meta_kubernetes_service_label_app]
                  regex: nvidia-dcgm-exporter
                - source_labels: [__meta_kubernetes_endpoint_node_name]
                  target_label: kubernetes_node
                  replacement: $1
                - source_labels: [__meta_kubernetes_endpoint_node_name]
                  target_label: k8s_node_name
                  replacement: $1
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: kubernetes_namespace
                  replacement: $1
                - source_labels: [__meta_kubernetes_service_name]
                  target_label: service
                  replacement: $1
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
        path: /
    processors:
      batch:
        send_batch_size: 1024
        timeout: 10s
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      k8s_attributes:
        auth_type: serviceAccount
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.node.name
            - k8s.deployment.name
            - k8s.replicaset.name
            - k8s.statefulset.name
            - k8s.container.name
            - k8s.cluster.uid
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection
      resource:
        attributes:
          - action: upsert
            key: k8s.cluster.name
            value: ${env:K8S_CLUSTER_NAME}
      # Safety net for `vllm:` names arriving over OTLP (the scrape job already
      # renames its own in metric_relabel_configs).
      transform:
        metric_statements:
          - context: metric
            statements:
              - replace_pattern(name, "^vllm:", "vllm_")
      transform/vllm:
        error_mode: ignore
        metric_statements:
          - context: datapoint
            statements:
              - set(resource.attributes["k8s.namespace.name"], attributes["k8s_namespace_name"]) where resource.attributes["service.name"] == "vllm" and attributes["k8s_namespace_name"] != nil
              - delete_key(attributes, "k8s_namespace_name") where resource.attributes["service.name"] == "vllm"
          - context: resource
            statements:
              - set(attributes["suse.ai.managed"], "true") where attributes["service.name"] == "vllm"
              - set(attributes["suse.ai.component.name"], "vllm") where attributes["service.name"] == "vllm"
              - set(attributes["suse.ai.component.type"], "inference-engine") where attributes["service.name"] == "vllm"
              - set(attributes["service.namespace"], attributes["k8s.namespace.name"]) where attributes["service.name"] == "vllm" and attributes["k8s.namespace.name"] != nil
    exporters:
      debug:
        verbosity: basic
      otlp_grpc:
        endpoint: otlp-observability.mort.dna-42.com:443
        headers:
          Authorization: SUSEObservability ${env:API_KEY}
        tls:
          insecure: false
    service:
      extensions: [health_check]
      pipelines:
        logs:
          receivers: [otlp]
          processors: [memory_limiter, k8s_attributes, resource, batch]
          exporters: [otlp_grpc]
        metrics:
          receivers: [prometheus, otlp]
          processors: [memory_limiter, k8s_attributes, resource, transform, transform/vllm, batch]
          exporters: [otlp_grpc]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8s_attributes, resource, batch]
          exporters: [otlp_grpc]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
