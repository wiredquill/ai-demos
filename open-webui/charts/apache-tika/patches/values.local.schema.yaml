$schema: http://json-schema.org/draft-07/schema#
type: object
required:
  - global
  - service
properties:
  global:
    type: object
    required:
      - imagePullSecrets
    properties:
      imagePullSecrets:
        type: array
        items:
          type: string
  service:
    type: object
    required:
      - type
    properties:
      type:
        type: string
