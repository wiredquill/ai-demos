apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hr-assistant.fullname" . }}-hr-policy-db
  labels:
    {{- include "hr-assistant.labels" . | nindent 4 }}
    app.component: hr-policy-db
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "hr-assistant.selectorLabels" . | nindent 6 }}
      app.component: hr-policy-db
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "hr-assistant.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        app.component: hr-policy-db
        genai: hr-policy-db
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "hr-assistant.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          env:
          - name: APP_NAME
            value: HRPolicyDatabase
          - name: OTEL_SERVICE_NAME
            value: HRPolicyDatabase
          - name: OTEL_SERVICE_VERSION
            value: "1.0.0"
          - name: DEPLOYMENT_ENVIRONMENT
            value: "{{ .Values.deploymentEnvironment }}"
          - name: MODEL
            value: "{{ include "hr-assistant.model" . }}"
          - name: LLM_PROVIDER
            value: "{{ .Values.llmProvider }}"
          - name: VLLM_ENDPOINT
            value: "{{ include "hr-assistant.vllmEndpoint" . }}"
          - name: OTLP_ENDPOINT
            value: "{{ include "hr-assistant.otlpEndpoint" . }}"
          - name: QDRANT_URL
            value: "http://{{ include "hr-assistant.fullname" . }}-qdrant:{{ .Values.qdrant.service.port }}"
          - name: OPENSEARCH_URL
            value: "http://{{ include "hr-assistant.fullname" . }}-opensearch:{{ .Values.opensearch.service.port }}"
          - name: COLLECT_GPU_STATS
            value: "{{ .Values.collectGpuStats }}"
          - name: OTEL_RESOURCE_ATTRIBUTES
            value: "{{ include "hr-assistant.otelResourceAttributes" (dict "ctx" . "componentName" "hr-policy-db") }}"
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.policyDb.image.repository }}:{{ .Values.policyDb.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
