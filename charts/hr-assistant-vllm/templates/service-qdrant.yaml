{{- if .Values.qdrant.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hr-assistant.fullname" . }}-qdrant
  labels:
    {{- include "hr-assistant.labels" . | nindent 4 }}
    app.component: qdrant
spec:
  type: {{ .Values.qdrant.service.type }}
  ports:
    - port: {{ .Values.qdrant.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "hr-assistant.selectorLabels" . | nindent 4 }}
    app.component: qdrant
{{- end }}
