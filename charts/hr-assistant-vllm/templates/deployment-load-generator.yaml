{{- $fullname := include "hr-assistant.fullname" . }}
{{- $generator := .Values.loadGenerator | default dict -}}
{{- $enabled := $generator.enabled | default true -}}
{{- if $enabled }}
{{- $interval := $generator.intervalSeconds | default 120 -}}
# Persistent load generator (replaces ephemeral CronJob).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-load-gen
  labels:
    {{- include "hr-assistant.labels" . | nindent 4 }}
    app.component: load-generator
spec:
  replicas: {{ $generator.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "hr-assistant.selectorLabels" . | nindent 6 }}
      app.component: load-generator
  template:
    metadata:
      labels:
        {{- include "hr-assistant.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        app.component: load-generator
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "hr-assistant.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: load-gen
          image: registry.suse.com/bci/python:3.11
          # Poll the three app /ask endpoints (GET) on the configured interval. Python is
          # already in the BCI image so no package install at start; requests
          # are fire-and-forget with a 60s timeout so a hung endpoint can
          # never wedge the loop (120s is generous — /ask makes multiple LLM calls). The apps instrument their /ask endpoints;
          # this pod just keeps telemetry flowing.
          env:
            - name: GENAI_HR_ASSISTANT_URL
              value: "http://{{ $fullname }}-hr-assistant:{{ .Values.service.port }}"
            - name: GENAI_EMPLOYEE_HANDBOOK_URL
              value: "http://{{ $fullname }}-employee-handbook:{{ .Values.service.port }}"
            - name: GENAI_HR_POLICY_DB_URL
              value: "http://{{ $fullname }}-hr-policy-db:{{ .Values.service.port }}"
            # Health gate: the vLLM router service (the same endpoint the apps
            # use as VLLM_ENDPOINT). Its /health returns {"status":"healthy"}
            # only once the router AND the engine are serving, so it is the
            # single source of truth for "the LLM stack is up". The load-gen
            # waits on this (plus each app's own /health) before it starts
            # hitting /ask, so it never counts/500s during model warm-up.
            - name: GENAI_LLM_HEALTH_URL
              value: "http://{{ $fullname }}-router-service:80"
            - name: LOAD_GEN_INTERVAL
              value: "{{ $interval }}"
            - name: LOAD_GEN_HEALTH_INTERVAL
              value: "{{ $generator.healthIntervalSeconds | default 10 }}"
          command:
            - /usr/local/bin/python3
            - -u
            - -c
            - |
              import json, os, time, urllib.request, datetime
              def ts():
                  return datetime.datetime.now(datetime.timezone.utc).strftime("%H:%M:%S")
              def call(url, timeout=120):
                  try:
                      with urllib.request.urlopen(url, timeout=timeout) as r:
                          data = r.read(4096)
                          print(f"[{ts()}] {url} -> {r.getcode()} ({len(data)} bytes)", flush=True)
                          return r.getcode()
                  except Exception as e:
                      print(f"[{ts()}] {url} -> ERROR {e}", flush=True)
                      return None
              interval = int(os.environ.get("LOAD_GEN_INTERVAL", "120"))
              health_interval = int(os.environ.get("LOAD_GEN_HEALTH_INTERVAL", "10"))
              apps = [
                  ("HR Assistant", os.environ["GENAI_HR_ASSISTANT_URL"] + "/ask"),
                  ("Employee Handbook", os.environ["GENAI_EMPLOYEE_HANDBOOK_URL"] + "/ask"),
                  ("HR Policy DB", os.environ["GENAI_HR_POLICY_DB_URL"] + "/ask"),
              ]
              # Health gate: wait until the LLM stack (router+engine) and every
              # app are healthy before starting the round loop. This prevents
              # the load-gen from hammering /ask (and counting 500s) while the
              # vLLM engine is still downloading/loading the model on first boot.
              llm_health = os.environ["GENAI_LLM_HEALTH_URL"] + "/health"
              app_health = [u.replace("/ask", "/health") for _, u in apps]
              print(f"[{ts()}] load-generator started (interval={interval}s)")
              print(f"[{ts()}] waiting for stack health before generating load...")
              print(f"[{ts()}]   llm: {llm_health}")
              for n, u in apps:
                  print(f"[{ts()}]   {n}: {u}")
              while True:
                  checks = [("llm", llm_health)] + [(a[0], h) for a, h in zip(apps, app_health)]
                  results = {n: call(u, timeout=5) for n, u in checks}
                  if all(code == 200 for code in results.values()):
                      print(f"[{ts()}] stack healthy; starting load generation", flush=True)
                      break
                  print(f"[{ts()}] not ready yet ({sum(1 for c in results.values() if c==200)}/{len(results)} healthy); retrying in {health_interval}s", flush=True)
                  time.sleep(health_interval)
              rnd = 0
              while True:
                  for n, u in apps:
                      call(u)
                  rnd += 1
                  print(f"[{ts()}] round {rnd} complete; sleeping {interval}s", flush=True)
                  time.sleep(interval)
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
        - name: health-check-emitter
          # Qdrant and OpenSearch are plain scraped backends, not instrumented
          # apps - they never produce trace spans, and the collector's
          # dedicated "topology" exporter (the thing that actually computes
          # SUSE AI component health) is only ever fed by the traces/topology
          # pipeline, never by metrics. Without a span of their own, their
          # components can exist (metrics create component identity) but can
          # never get a health state. This emits a small periodic span per
          # service - the same liveness check the collector itself polls -
          # carrying the identical suse.ai.component.* identity the metrics
          # pipeline already stamps on them, so the topology exporter has a
          # real span to compute health from, the same way it does for every
          # application. Reuses the hr-assistant image (already has the OTel
          # SDK + the script baked in); overrides the entrypoint.
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/.venv/bin/python3", "-u", "health_check_emitter.py"]
          env:
            - name: OTLP_ENDPOINT
              value: "{{ include "hr-assistant.otlpEndpoint" . }}"
            - name: SUSE_AI_NAMESPACE
              value: "{{ include "hr-assistant.serviceNamespace" . }}"
            - name: QDRANT_URL
              value: "http://{{ $fullname }}-qdrant:6333"
            - name: OPENSEARCH_URL
              value: "http://{{ $fullname }}-opensearch:9200"
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
