apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hr-assistant.fullname" . }}-employee-handbook
  labels:
    {{- include "hr-assistant.labels" . | nindent 4 }}
    app.component: employee-handbook
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "hr-assistant.selectorLabels" . | nindent 6 }}
      app.component: employee-handbook
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "hr-assistant.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        app.component: employee-handbook
        genai: employee-handbook
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "hr-assistant.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          env:
          - name: APP_NAME
            value: EmployeeHandbook
          - name: OTEL_SERVICE_NAME
            value: EmployeeHandbook
          - name: OTEL_SERVICE_VERSION
            value: "1.0.0"
          - name: DEPLOYMENT_ENVIRONMENT
            value: "{{ .Values.deploymentEnvironment }}"
          - name: MODEL
            value: "{{ include "hr-assistant.model" . }}"
          - name: OLLAMA_ENDPOINT
            value: {{ include "hr-assistant.ollamaEndpoint" . }}
          - name: OLLAMA_BASE_URL
            value: {{ include "hr-assistant.ollamaEndpoint" . }}
          - name: OBSERVABILITY_ENABLED
            value: "true"
          - name: OTLP_ENDPOINT
            value: "{{ include "hr-assistant.otlpEndpoint" . }}"
          - name: COLLECT_GPU_STATS
            value: "{{ .Values.collectGpuStats }}"
          - name: OTEL_RESOURCE_ATTRIBUTES
            value: "{{ include "hr-assistant.otelResourceAttributes" (dict "ctx" . "componentName" "employee-handbook") }}"
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
