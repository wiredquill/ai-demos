{{- if include "hr-assistant.collectorEnabled" . }}
{{- $so := .Values.opentelemetry.operator.suseObservability }}
{{- if and $so.copySecret.enabled (not $so.existingSecret) (not $so.apiKey) }}
{{/*
Pre-install hook that copies the SUSE Observability API_KEY secret from the
namespace SUSE Observability was installed into, over to the release namespace.
Secrets are namespaced and the collector references one via secretKeyRef, so it
has to exist alongside the collector. Copying it here is what lets the install
ask no questions about API keys at all.

Mirrors charts/ai-compare-opentelemetry/templates/82-collector-secret-copy.yaml.
Uses only curl + shell, so no python/jq dependency in the hook image.
*/}}
{{- $copyName := printf "%s-copy-secret" (include "hr-assistant.collectorName" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $copyName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
  labels:
    {{- include "hr-assistant.labels" . | nindent 4 }}
---
# Read the source secret cluster-wide, write it into the release namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $copyName }}-{{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
  labels:
    {{- include "hr-assistant.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $copyName }}-{{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
  labels:
    {{- include "hr-assistant.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $copyName }}-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ $copyName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $copyName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
  labels:
    {{- include "hr-assistant.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $copyName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
  labels:
    {{- include "hr-assistant.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $copyName }}
subjects:
  - kind: ServiceAccount
    name: {{ $copyName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $copyName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "hr-assistant.labels" . | nindent 4 }}
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "hr-assistant.selectorLabels" . | nindent 8 }}
        app.component: collector-secret-copy
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ $copyName }}
      containers:
        - name: copy-secret
          image: {{ $so.copySecret.image | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              SRC_NS="{{ $so.copySecret.sourceNamespace }}"
              SECRET="{{ $so.copySecret.name }}"
              DST_NS="{{ .Release.Namespace }}"
              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              API="https://kubernetes.default.svc"
              CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              echo "==> Copying secret $SECRET from $SRC_NS to $DST_NS"
              if curl -s --cacert $CA -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" \
                   "$API/api/v1/namespaces/$DST_NS/secrets/$SECRET" | grep -q "^200$"; then
                echo "    Secret $SECRET already exists in $DST_NS - nothing to do"
                exit 0
              fi
              if ! curl -fsS --cacert $CA -H "Authorization: Bearer $TOKEN" \
                   "$API/api/v1/namespaces/$SRC_NS/secrets/$SECRET" -o /tmp/src.json; then
                echo "ERROR: could not read $SRC_NS/$SECRET." >&2
                echo "       Set opentelemetry.operator.suseObservability.existingSecret or .apiKey," >&2
                echo "       or point .copySecret at the namespace holding the SUSE Observability key." >&2
                exit 1
              fi
              # The API pretty-prints, so the data block spans several lines and a
              # line-based grep can never match it - flatten the whitespace first.
              # Escaped quotes inside a last-applied-configuration annotation
              # cannot match the unescaped "data":{ pattern, so this stays safe.
              DATA=$(tr -d '\n\r\t ' < /tmp/src.json | grep -o '"data":{[^}]*}' | head -1)
              if [ -z "$DATA" ]; then
                echo "ERROR: secret $SRC_NS/$SECRET has no data" >&2
                exit 1
              fi
              printf '{"apiVersion":"v1","kind":"Secret","metadata":{"name":"%s"},"type":"Opaque",%s}\n' "$SECRET" "$DATA" > /tmp/clean.json
              curl -fsS --cacert $CA -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                --data @/tmp/clean.json "$API/api/v1/namespaces/$DST_NS/secrets" > /dev/null
              echo "    Secret copied successfully"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
{{- end }}
{{- end }}
