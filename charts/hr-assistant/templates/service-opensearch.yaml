{{- if .Values.opensearch.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hr-assistant.fullname" . }}-opensearch
  labels:
    {{- include "hr-assistant.labels" . | nindent 4 }}
    app.component: opensearch
spec:
  type: {{ .Values.opensearch.service.type }}
  ports:
    - port: {{ .Values.opensearch.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "hr-assistant.selectorLabels" . | nindent 4 }}
    app.component: opensearch
{{- end }}
