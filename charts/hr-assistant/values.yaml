# SUSE AI HR Assistant Demo Configuration
# Clean application: three FastAPI services (HRAssistant orchestrator,
# HRPolicyDatabase RAG app, EmployeeHandbook) plus Ollama, Qdrant and
# OpenSearch. No observability telemetry is emitted by this branch - use the
# feat/stackpack-v2 branch for the SUSE Observability StackPack v2 variant.

# Global configuration
imagePullSecrets:
  - name: application-collection

ollamaEndpoint: 'http://my-hr-assistant-ollama:11434'
collectGpuStats: 'false'  # Enable GPU metrics for demo

# Primary model used by the apps. Defaults to the first model Ollama pulls.
model: ''

# Job cleanup settings (still used by the Ollama model-puller Job)
jobs:
  # Time in seconds after which completed jobs are deleted
  ttlSecondsAfterFinished: 300  # 5 minutes

# Official SUSE Application Collection Ollama chart configuration
ollama:
  enabled: true
  image:
    tag: "0.21.2-11.48"
  imagePullSecrets:
    - name: application-collection
  # runtimeClassName required for NVIDIA libraries to be mounted in container
  runtimeClassName: "nvidia"
  # Subchart's own "ollama" namespace (Helm strips parent key prefix)
  ollama:
    gpu:
      enabled: true
      type: "nvidia"
      number: 1
  resources:
    requests:
      cpu: "1"
      memory: "4Gi"
    limits:
      cpu: "1"
      memory: "4Gi"
  persistence:
    enabled: false
    size: 10Gi
  # Model caching options
  modelCache:
    # NFS-based model caching for shared storage across deployments
    nfs:
      enabled: false
      server: "" # NFS server IP/hostname
      path: "/data/ai-models" # NFS share path for caching models
  models:
    # Map form of the model list — Rancher's questions.yaml cannot set list
    # elements (paths like models[0] are stored as literal keys and ignored),
    # so the pullable models are keyed instead. The Ollama subchart and the
    # model-puller job range over the map VALUES, so they behave exactly like
    # the old list.
    pull:
      main: llama3.2:latest
      secondary: llama3.2:1b
      embeddings: bge-large:latest



# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  # Published by .github/workflows/build-hr-assistant.yml from app/hr-assistant
  # (this branch: the clean, no-observability build).
  repository: ghcr.io/wiredquill/ai-demos-suse
  # This sets the pull policy for images.
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "clean-1"

# The RAG app (hr-policy-db) runs a different image than the chat apps:
# app/hr-assistant is built to ghcr.io/wiredquill/ai-demos/genai-demo by
# .github/workflows/build-hr-assistant.yml and contains main.py + apps/ (rag101,
# rag102), which the chat-app ai-demos-suse image does NOT ship.
policyDb:
  image:
    repository: ghcr.io/wiredquill/ai-demos/genai-demo
    pullPolicy: Always
    tag: "clean-1"

# Qdrant — vector database used by the HRPolicyDatabase RAG app
# (upserts HR policy embeddings and searches them).
qdrant:
  enabled: true
  image:
    repository: qdrant/qdrant
    tag: "v1.19.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  service:
    type: ClusterIP
    port: 6333

# OpenSearch — search engine used by the HRPolicyDatabase RAG app
# (indexes and queries HR policy documents).
opensearch:
  enabled: true
  image:
    repository: opensearchproject/opensearch
    tag: "2.19.6"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
  service:
    type: ClusterIP
    port: 9200
  # Single-node demo: security plugin disabled, no auth, plain HTTP.
  env:
    - name: discovery.type
      value: single-node
    - name: DISABLE_SECURITY_PLUGIN
      value: "true"
    - name: bootstrap.memory_lock
      value: "false"
    - name: ES_JAVA_OPTS
      value: "-Xms512m -Xmx512m"

# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""



# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: NodePort
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 8000
  # Optional NodePort for the hr-policy-db service (dashboard at /).
  # Only applied when service.type is NodePort.
  nodePort: 30080

gpu:
  enabled: false
  count: 1

resources:
  requests:
    memory: '800Mi'
    cpu: '400m'
  limits:
    memory: '1000Mi'
    cpu: '600m'

nodeSelector: {}

tolerations: []
