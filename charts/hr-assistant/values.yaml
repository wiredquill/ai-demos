# SUSE AI HR Assistant Demo Configuration
# Showcases comprehensive LLM observability with OpenLit integration

# Global configuration
imagePullSecrets:
  - name: application-collection

# Observability endpoints
# Ignored when opentelemetry.operator.enabled=true - the apps then export to the
# collector this chart provisions in its own namespace.
otlpEndpoint: 'http://opentelemetry-collector.opentelemetry-collector.svc.cluster.local:4318'
ollamaEndpoint: 'http://my-hr-assistant-ollama:11434'
collectGpuStats: 'false'  # Enable GPU metrics for demo

# Reported as deployment.environment on every signal.
deploymentEnvironment: production

# Primary model used by the apps. Defaults to the first model Ollama pulls.
model: ''

# GenAI semantic-convention identity reported to SUSE Observability.
#
# SUSE Observability builds the SUSE AI topology from the *resource* attribute
# gen_ai.provider.name: it is what makes the inference engine appear as a
# component and what links the application to the models it calls. OpenLIT only
# emits the older gen_ai.system span attribute, so the chart sets this explicitly
# via OTEL_RESOURCE_ATTRIBUTES.
genai:
  providerName: ollama

# OpenTelemetry Operator integration.
#
# When enabled, the chart hands the OpenTelemetry Operator an
# OpenTelemetryCollector CR so this release gets its own SUSE AI collector in its
# own namespace, pre-wired with the GenAI topology pipeline. This replaces
# maintaining one shared, hand-edited cluster collector, and it means
# SUSE_AI_NAMESPACE matches the release namespace so components land under the
# right SUSE AI namespace instead of whatever the shared collector was pinned to.
#
# Requires the OpenTelemetry Operator to already be installed in the cluster.
opentelemetry:
  operator:
    enabled: false
    mode: deployment
    replicas: 1
    # Set true to also log telemetry to the collector's stdout for debugging.
    debug: false
    image:
      repository: registry.suse.com/ai/containers/suse-ai-opentelemetry-collector
      tag: '0.149.0'
      pullPolicy: IfNotPresent
    # registry.suse.com/ai is authenticated; the collector pod needs these.
    imagePullSecrets:
      - name: application-collection
      - name: suse-registry
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: '1'
        memory: 1Gi
    # Cluster name recorded on the telemetry. Should match the cluster name
    # registered with SUSE Observability.
    clusterName: ''
    # SUSE AI namespace the inferred components are attributed to.
    # Defaults to the release namespace when left empty.
    suseAiNamespace: ''
    suseObservability:
      # Base URL of the SUSE Observability server, used by the topology exporter.
      # Example: https://observability.example.com
      apiUrl: ''
      # OTLP gRPC ingestion endpoint as host:port, with no scheme.
      # Example: otlp-observability.example.com:443
      otlpEndpoint: ''
      # Plaintext gRPC. Leave false for a TLS ingestion endpoint.
      otlpInsecure: false
      # Skip TLS verification, for demo clusters with self-signed certificates.
      skipTlsVerify: true
      # API key for SUSE Observability. Prefer existingSecret in real installs.
      apiKey: ''
      # Name of an existing secret holding the API key instead of apiKey above.
      existingSecret: ''
      existingSecretKey: API_KEY

# CronJob schedule for automated requests (demo traffic generation)
schedule: '*/5 * * * *'

# Job cleanup settings
jobs:
  # Time in seconds after which completed jobs are deleted
  ttlSecondsAfterFinished: 300  # 5 minutes

# Official SUSE Application Collection Ollama chart configuration
ollama:
  enabled: true
  image:
    tag: "0.21.2-11.48"
  imagePullSecrets:
    - name: application-collection
  # runtimeClassName required for NVIDIA libraries to be mounted in container
  runtimeClassName: "nvidia"
  # Subchart's own "ollama" namespace (Helm strips parent key prefix)
  ollama:
    gpu:
      enabled: true
      type: "nvidia"
      number: 1
  resources:
    requests:
      cpu: "1"
      memory: "4Gi"
    limits:
      cpu: "1"
      memory: "4Gi"
  persistence:
    enabled: false
    size: 10Gi
  # Model caching options
  modelCache:
    # NFS-based model caching for shared storage across deployments
    nfs:
      enabled: false
      server: "" # NFS server IP/hostname
      path: "/data/ai-models" # NFS share path for caching models
  models:
    pull:
    - llama3.2:1b
    - bge-large:latest



# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  # Published by .github/workflows/build-hr-assistant.yml from app/hr-assistant.
  # The old llm-experiments repository is no longer built and is frozen on
  # openlit 1.27, which predates the gen_ai.provider.name convention.
  repository: ghcr.io/wiredquill/ai-demos/genai-demo
  # This sets the pull policy for images.
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""



# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 8000

gpu:
  enabled: false
  count: 1

resources:
  requests:
    memory: '800Mi'
    cpu: '400m'
  limits:
    memory: '1000Mi'
    cpu: '600m'

nodeSelector: {}

tolerations: []
