questions:
# Observability Configuration
- variable: opentelemetry.operator.enabled
  label: "Use the OpenTelemetry Operator"
  description: "Let the OpenTelemetry Operator create a SUSE AI collector dedicated to this release, already wired with the GenAI topology pipeline that SUSE Observability needs. The apps then send telemetry to it instead of a shared cluster collector, and SUSE AI components are grouped under this namespace. Requires the OpenTelemetry Operator to be installed in the cluster."
  type: boolean
  default: false
  group: Observability

- variable: otlpEndpoint
  label: "⚠️ OTLP Endpoint"
  type: string
  description: "Open Telemetry Endpoint - Include http:// and port. IMPORTANT: This setting is critical for error logging and observability. If pods are generating errors, verify this endpoint is correctly configured and accessible."
  required: true
  default: "http://opentelemetry-collector.observability.svc.cluster.local:4318"
  group: Observability
  show_if: "opentelemetry.operator.enabled=false"

- variable: opentelemetry.operator.suseObservability.apiUrl
  label: "SUSE Observability URL"
  description: "Base URL of the SUSE Observability server, used to publish the SUSE AI topology. Example: https://observability.example.com"
  type: string
  required: true
  default: ""
  group: Observability
  show_if: "opentelemetry.operator.enabled=true"

- variable: opentelemetry.operator.suseObservability.otlpEndpoint
  label: "SUSE Observability OTLP Endpoint"
  description: "OTLP gRPC ingestion endpoint as host:port, with no scheme. Example: otlp-observability.example.com:443"
  type: string
  required: true
  default: ""
  group: Observability
  show_if: "opentelemetry.operator.enabled=true"

- variable: opentelemetry.operator.suseObservability.apiKey
  label: "SUSE Observability API Key"
  description: "API key used to ship traces, metrics and topology. Leave empty if you supply an existing secret instead."
  type: password
  default: ""
  group: Observability
  show_if: "opentelemetry.operator.enabled=true"

- variable: opentelemetry.operator.suseObservability.existingSecret
  label: "Existing API Key Secret"
  description: "Name of an existing secret in this namespace holding the API key. Takes the place of the API key field above."
  type: string
  default: ""
  group: Observability
  show_if: "opentelemetry.operator.enabled=true"

- variable: opentelemetry.operator.suseObservability.existingSecretKey
  label: "Existing API Key Secret Key"
  description: "Key inside that secret which holds the API key."
  type: string
  default: "API_KEY"
  group: Observability
  show_if: "opentelemetry.operator.enabled=true && opentelemetry.operator.suseObservability.existingSecret!="

- variable: opentelemetry.operator.clusterName
  label: "Cluster Name"
  description: "Name of this cluster as registered in SUSE Observability. Recorded on the telemetry the collector sends."
  type: string
  default: ""
  group: Observability
  show_if: "opentelemetry.operator.enabled=true"

- variable: opentelemetry.operator.suseAiNamespace
  label: "SUSE AI Namespace"
  description: "SUSE AI namespace the application, inference engine and model components are grouped under. Defaults to the namespace this chart is installed into."
  type: string
  default: ""
  group: Observability
  show_if: "opentelemetry.operator.enabled=true"

- variable: opentelemetry.operator.suseObservability.skipTlsVerify
  label: "Skip TLS Verification"
  description: "Skip certificate verification when talking to SUSE Observability. Useful for demo clusters using self-signed certificates."
  type: boolean
  default: true
  group: Observability
  show_if: "opentelemetry.operator.enabled=true"

- variable: opentelemetry.operator.image.tag
  label: "SUSE AI Collector Image Tag"
  description: "Tag of the SUSE AI OpenTelemetry Collector image the Operator should run."
  type: string
  default: "0.149.0"
  group: Observability
  show_if: "opentelemetry.operator.enabled=true"

- variable: opentelemetry.operator.debug
  label: "Log Telemetry to Collector Stdout"
  description: "Also write received traces and metrics to the collector's log. Useful when verifying a demo is reporting correctly."
  type: boolean
  default: false
  group: Observability
  show_if: "opentelemetry.operator.enabled=true"

- variable: genai.providerName
  label: "GenAI Provider Name"
  description: "Reported as gen_ai.provider.name. This is what SUSE Observability uses to draw the inference engine in the SUSE AI topology and to link the application to the models it calls."
  type: string
  default: "ollama"
  group: Observability

# General Configuration

- variable: ollama.enabled
  group: General
  label: "Enable Ollama Deployment"
  description: "If true, Ollama will be deployed as part of this chart."
  type: "boolean"
  default: true

- variable: ollama.ollama.gpu.enabled
  group: General
  label: "Enable GPU Acceleration"
  description: "Requires a node with NVIDIA or AMD drivers and the k8s device plugin installed."
  type: "boolean"
  default: true
  show_if: "ollama.enabled=true"

- variable: ollama.ollama.gpu.type
  group: General
  label: "GPU Vendor"
  description: "Select the GPU vendor. NVIDIA requires the NVIDIA device plugin and runtimeClass. AMD requires the AMD ROCm device plugin (amd.com/gpu)."
  type: "enum"
  default: "nvidia"
  show_if: "ollama.enabled=true && ollama.ollama.gpu.enabled=true"
  options:
    - "nvidia"
    - "amd"

- variable: schedule
  label: "Schedule"
  type: string
  default: "*/5 * * * *"
  description: "Cron schedule for user simulation request to apps"
  required: true
  group: General

# Ollama Deployment Configuration
- variable: ollama.models[0]
  group: "Ollama Deployment"
  label: "Primary AI Model"
  description: "The primary AI model to pull for HR queries (e.g., 'llama3.2:1b')."
  type: "string"
  default: "llama3.2:1b"
  show_if: "ollama.enabled=true"

- variable: ollama.models[1]
  group: "Ollama Deployment"
  label: "Secondary AI Model"
  description: "Additional model for embeddings (optional)."
  type: "string"
  default: "bge-large:latest"
  show_if: "ollama.enabled=true"

- variable: ollama.service.type
  group: "Ollama Deployment"
  label: "Ollama Service Type"
  description: "Method to expose the Ollama service. 'ClusterIP' is recommended."
  type: "enum"
  required: true
  default: "ClusterIP"
  show_if: "ollama.enabled=true"
  options:
    - "ClusterIP"
    - "NodePort"
    - "LoadBalancer"

- variable: ollamaEndpoint
  label: "Ollama Server URL"
  type: string
  description: "URL for your existing Ollama Server. Make sure it has llama3.2:1b and bge-large:latest models available."
  required: true
  default: "http://ollama.example.com:11434"
  group: "Ollama Deployment"
  show_if: "ollama.enabled=false"

- variable: ollama.persistence.enabled
  group: "Ollama Deployment"
  label: "Enable Ollama Model Persistence"
  description: "If true, a PersistentVolumeClaim will be created to store Ollama models so they are not re-downloaded on restart."
  type: "boolean"
  default: false
  show_if: "ollama.enabled=true"

- variable: ollama.persistence.size
  group: "Ollama Deployment"
  label: "Ollama Model Storage Size"
  description: "The size of the PersistentVolumeClaim for Ollama models (e.g., '10Gi', '50Gi')."
  type: "string"
  default: "10Gi"
  show_if: "ollama.enabled=true && ollama.persistence.enabled=true"

- variable: ollama.persistence.storageClassName
  group: "Ollama Deployment"
  label: "Ollama Model Storage Class Name"
  description: "The storage class name for the Ollama models PVC. Leave empty to use the default storage class."
  type: "string"
  default: ""
  show_if: "ollama.enabled=true && ollama.persistence.enabled=true"

- variable: ollama.modelCache.nfs.enabled
  group: "Ollama Deployment"
  label: "Enable NFS Model Cache"
  description: "Mount an NFS share to cache Ollama models across deployments and avoid re-downloading."
  type: "boolean"
  default: false
  show_if: "ollama.enabled=true"

- variable: ollama.modelCache.nfs.server
  group: "Ollama Deployment"
  label: "NFS Server"
  description: "IP address or hostname of the NFS server."
  type: "string"
  default: ""
  show_if: "ollama.enabled=true && ollama.modelCache.nfs.enabled=true"

- variable: ollama.modelCache.nfs.path
  group: "Ollama Deployment"
  label: "NFS Share Path"
  description: "Path on the NFS server to use for caching models (e.g., '/data/ai-models')."
  type: "string"
  default: "/data/ai-models"
  show_if: "ollama.enabled=true && ollama.modelCache.nfs.enabled=true"

# Ollama Resources - GPU mode (CPU drops to 1 when GPU selected on General page)
- variable: ollama.resources.requests.cpu
  group: "Ollama Resources"
  label: "Ollama CPU Request"
  description: "CPU request for Ollama. GPU acceleration reduces CPU dependency."
  type: "string"
  default: "1"
  show_if: "ollama.enabled=true && ollama.ollama.gpu.enabled=true"

- variable: ollama.resources.requests.memory
  group: "Ollama Resources"
  label: "Ollama Memory Request"
  description: "Memory request for Ollama in GPU mode."
  type: "string"
  default: "4Gi"
  show_if: "ollama.enabled=true && ollama.ollama.gpu.enabled=true"

- variable: ollama.resources.limits.cpu
  group: "Ollama Resources"
  label: "Ollama CPU Limit"
  description: "CPU limit for Ollama in GPU mode."
  type: "string"
  default: "1"
  show_if: "ollama.enabled=true && ollama.ollama.gpu.enabled=true"

- variable: ollama.resources.limits.memory
  group: "Ollama Resources"
  label: "Ollama Memory Limit"
  description: "Memory limit for Ollama in GPU mode."
  type: "string"
  default: "4Gi"
  show_if: "ollama.enabled=true && ollama.ollama.gpu.enabled=true"

# Ollama Resources - CPU-only mode
- variable: ollama.resources.requests.cpu
  group: "Ollama Resources"
  label: "Ollama CPU Request"
  description: "CPU request for Ollama in CPU-only mode (higher allocation required without GPU)."
  type: "string"
  default: "2"
  show_if: "ollama.enabled=true && ollama.ollama.gpu.enabled=false"

- variable: ollama.resources.requests.memory
  group: "Ollama Resources"
  label: "Ollama Memory Request"
  description: "Memory request for Ollama in CPU-only mode."
  type: "string"
  default: "8Gi"
  show_if: "ollama.enabled=true && ollama.ollama.gpu.enabled=false"

- variable: ollama.resources.limits.cpu
  group: "Ollama Resources"
  label: "Ollama CPU Limit"
  description: "CPU limit for Ollama in CPU-only mode."
  type: "string"
  default: "2"
  show_if: "ollama.enabled=true && ollama.ollama.gpu.enabled=false"

- variable: ollama.resources.limits.memory
  group: "Ollama Resources"
  label: "Ollama Memory Limit"
  description: "Memory limit for Ollama in CPU-only mode."
  type: "string"
  default: "8Gi"
  show_if: "ollama.enabled=true && ollama.ollama.gpu.enabled=false"
