questions:
# Observability Configuration
#
# A single shared collector serves every namespace: each release declares its own
# service.namespace, so SUSE Observability groups its components correctly without
# a collector of its own. Installing a per-release collector via the OpenTelemetry
# Operator is still supported, but it is a values-level option rather than a
# question - see observability.mode in values.yaml.
- variable: otlpEndpoint
  label: "OTLP Endpoint"
  description: "Address of the OpenTelemetry collector the applications report to, including scheme and port."
  type: string
  required: true
  default: "http://open-telemetry-collector-opentelemetry-collector.observability.svc.cluster.local:4318"
  group: Observability

# General Configuration

- variable: ollama.enabled
  group: General
  label: "Enable Ollama Deployment"
  description: "If true, Ollama will be deployed as part of this chart."
  type: "boolean"
  default: true

- variable: ollama.ollama.gpu.enabled
  group: General
  label: "Enable GPU Acceleration"
  description: "Requires a node with NVIDIA or AMD drivers and the k8s device plugin installed."
  type: "boolean"
  default: true
  show_if: "ollama.enabled=true"

- variable: ollama.ollama.gpu.type
  group: General
  label: "GPU Vendor"
  description: "Select the GPU vendor. NVIDIA requires the NVIDIA device plugin and runtimeClass. AMD requires the AMD ROCm device plugin (amd.com/gpu)."
  type: "enum"
  default: "nvidia"
  show_if: "ollama.enabled=true && ollama.ollama.gpu.enabled=true"
  options:
    - "nvidia"
    - "amd"

- variable: schedule
  label: "Load Generation Schedule"
  type: string
  default: "*/2 * * * *"
  description: "Cron schedule for the load generator that calls the apps. Keep it at */2 or faster: the SUSE AI topology exporter expires components ~2 minutes after their last telemetry, so */5 leaves the SUSE AI view empty most of the time. Use '*/1 * * * *' or even '*/2' for quick demo data."
  required: true
  group: General

# Dashboard / Service Access
#
# The dashboard is served by the hr-policy-db app at /dashboard (and each app
# exposes /stats and /logs). Pick how the app services are published so you can
# reach the dashboard from a browser.
- variable: service.type
  group: "Dashboard / Service Access"
  label: "App Service Type (Dashboard Access)"
  description: "How to expose the app services (the dashboard lives at /dashboard on the hr-policy-db service). 'ClusterIP' is fine when you will port-forward; 'NodePort' or 'LoadBalancer' expose it for direct browser access."
  type: "enum"
  required: true
  default: "ClusterIP"
  options:
    - "ClusterIP"
    - "NodePort"
    - "LoadBalancer"

- variable: service.nodePort
  group: "Dashboard / Service Access"
  label: "Dashboard NodePort"
  description: "NodePort for the hr-policy-db service (dashboard). Only used when the service type is NodePort. Must be 30000-32767."
  type: "int"
  default: 30080
  show_if: "service.type=NodePort"

# Ollama Deployment Configuration
- variable: ollama.models[0]
  group: "Ollama Deployment"
  label: "Primary AI Model"
  description: "The primary AI model to pull for HR queries (e.g., 'llama3.2:1b')."
  type: "string"
  default: "llama3.2:1b"
  show_if: "ollama.enabled=true"

- variable: ollama.models[1]
  group: "Ollama Deployment"
  label: "Secondary AI Model"
  description: "Additional model for embeddings (optional)."
  type: "string"
  default: "bge-large:latest"
  show_if: "ollama.enabled=true"

- variable: ollama.service.type
  group: "Ollama Deployment"
  label: "Ollama Service Type"
  description: "Method to expose the Ollama service. 'ClusterIP' is recommended."
  type: "enum"
  required: true
  default: "ClusterIP"
  show_if: "ollama.enabled=true"
  options:
    - "ClusterIP"
    - "NodePort"
    - "LoadBalancer"

- variable: ollamaEndpoint
  label: "Ollama Server URL"
  type: string
  description: "URL for your existing Ollama Server. Make sure it has llama3.2:1b and bge-large:latest models available."
  required: true
  default: "http://ollama.example.com:11434"
  group: "Ollama Deployment"
  show_if: "ollama.enabled=false"

- variable: ollama.persistence.enabled
  group: "Ollama Deployment"
  label: "Enable Ollama Model Persistence"
  description: "If true, a PersistentVolumeClaim will be created to store Ollama models so they are not re-downloaded on restart."
  type: "boolean"
  default: false
  show_if: "ollama.enabled=true"

- variable: ollama.persistence.size
  group: "Ollama Deployment"
  label: "Ollama Model Storage Size"
  description: "The size of the PersistentVolumeClaim for Ollama models (e.g., '10Gi', '50Gi')."
  type: "string"
  default: "10Gi"
  show_if: "ollama.enabled=true && ollama.persistence.enabled=true"

- variable: ollama.persistence.storageClassName
  group: "Ollama Deployment"
  label: "Ollama Model Storage Class Name"
  description: "The storage class name for the Ollama models PVC. Leave empty to use the default storage class."
  type: "string"
  default: ""
  show_if: "ollama.enabled=true && ollama.persistence.enabled=true"

- variable: ollama.modelCache.nfs.enabled
  group: "Ollama Deployment"
  label: "Enable NFS Model Cache"
  description: "Mount an NFS share to cache Ollama models across deployments and avoid re-downloading."
  type: "boolean"
  default: false
  show_if: "ollama.enabled=true"

- variable: ollama.modelCache.nfs.server
  group: "Ollama Deployment"
  label: "NFS Server"
  description: "IP address or hostname of the NFS server."
  type: "string"
  default: ""
  show_if: "ollama.enabled=true && ollama.modelCache.nfs.enabled=true"

- variable: ollama.modelCache.nfs.path
  group: "Ollama Deployment"
  label: "NFS Share Path"
  description: "Path on the NFS server to use for caching models (e.g., '/data/ai-models')."
  type: "string"
  default: "/data/ai-models"
  show_if: "ollama.enabled=true && ollama.modelCache.nfs.enabled=true"

# Ollama Resources - GPU mode (CPU drops to 1 when GPU selected on General page)
- variable: ollama.resources.requests.cpu
  group: "Ollama Resources"
  label: "Ollama CPU Request"
  description: "CPU request for Ollama. GPU acceleration reduces CPU dependency."
  type: "string"
  default: "1"
  show_if: "ollama.enabled=true && ollama.ollama.gpu.enabled=true"

- variable: ollama.resources.requests.memory
  group: "Ollama Resources"
  label: "Ollama Memory Request"
  description: "Memory request for Ollama in GPU mode."
  type: "string"
  default: "4Gi"
  show_if: "ollama.enabled=true && ollama.ollama.gpu.enabled=true"

- variable: ollama.resources.limits.cpu
  group: "Ollama Resources"
  label: "Ollama CPU Limit"
  description: "CPU limit for Ollama in GPU mode."
  type: "string"
  default: "1"
  show_if: "ollama.enabled=true && ollama.ollama.gpu.enabled=true"

- variable: ollama.resources.limits.memory
  group: "Ollama Resources"
  label: "Ollama Memory Limit"
  description: "Memory limit for Ollama in GPU mode."
  type: "string"
  default: "4Gi"
  show_if: "ollama.enabled=true && ollama.ollama.gpu.enabled=true"

# Ollama Resources - CPU-only mode
- variable: ollama.resources.requests.cpu
  group: "Ollama Resources"
  label: "Ollama CPU Request"
  description: "CPU request for Ollama in CPU-only mode (higher allocation required without GPU)."
  type: "string"
  default: "2"
  show_if: "ollama.enabled=true && ollama.ollama.gpu.enabled=false"

- variable: ollama.resources.requests.memory
  group: "Ollama Resources"
  label: "Ollama Memory Request"
  description: "Memory request for Ollama in CPU-only mode."
  type: "string"
  default: "8Gi"
  show_if: "ollama.enabled=true && ollama.ollama.gpu.enabled=false"

- variable: ollama.resources.limits.cpu
  group: "Ollama Resources"
  label: "Ollama CPU Limit"
  description: "CPU limit for Ollama in CPU-only mode."
  type: "string"
  default: "2"
  show_if: "ollama.enabled=true && ollama.ollama.gpu.enabled=false"

- variable: ollama.resources.limits.memory
  group: "Ollama Resources"
  label: "Ollama Memory Limit"
  description: "Memory limit for Ollama in CPU-only mode."
  type: "string"
  default: "8Gi"
  show_if: "ollama.enabled=true && ollama.ollama.gpu.enabled=false"

# Vector Database + Search Engine components
#
# These deploy alongside the app so the SUSE AI section in SUSE Observability
# shows a "Vector Databases" component (Qdrant) and a "Search Engines"
# component (OpenSearch). They are demo data sources: the hr-policy-db app
# seeds and queries both on every load-gen cycle, so the topology shows the
# app depending on them. Disable either to remove the component.
- variable: qdrant.enabled
  group: "Observability Demo Components"
  label: "Deploy Qdrant (Vector Database)"
  description: "Deploys Qdrant and wires the collector to tag it as a Vector Databases component. The RAG app seeds and searches it for topology data."
  type: "boolean"
  default: true

- variable: opensearch.enabled
  group: "Observability Demo Components"
  label: "Deploy OpenSearch (Search Engine)"
  description: "Deploys OpenSearch and wires the collector to tag it as a Search Engines component. The RAG app indexes and searches it for topology data."
  type: "boolean"
  default: true
