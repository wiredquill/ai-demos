questions:
# --- Dashboard / Service Access (Form Page) ---
- variable: service.type
  group: "Dashboard / Service Access"
  label: "App Service Type"
  description: "How the app services are exposed. The dashboard lives at `/dashboard` on the hr-policy-db service.<br><br><b>Options:</b><br>• NodePort (default) — direct browser access<br>• LoadBalancer — external load balancer<br>• ClusterIP — for port-forwarding"
  type: "enum"
  required: true
  default: "NodePort"
  options:
    - "NodePort"
    - "LoadBalancer"
    - "ClusterIP"

- variable: service.nodePort
  group: "Dashboard / Service Access"
  label: "Dashboard NodePort"
  description: "NodePort for the hr-policy-db service.<br>Used only when service type is NodePort.<br>Range: 30000-32767."
  type: "int"
  default: 30080
  show_if: "service.type=NodePort"

# --- Observability (Form Page) ---
- variable: otlpEndpoint
  label: "OTLP Endpoint"
  description: "OpenTelemetry collector address (scheme://host:port).<br><br><b>Leave blank to auto-discover:</b> the chart looks up the collector Service in the Collector Namespace below and uses it automatically.<br><br>Find it manually:<br><code>kubectl get svc -n &lt;namespace&gt; | grep opentelemetry</code>"
  type: string
  required: false
  default: ""
  group: Observability

- variable: observability.collectorNamespace
  label: "Collector Namespace"
  description: "Namespace holding the shared OpenTelemetry collector Service.<br><br>Used to auto-discover the collector when OTLP Endpoint is blank, and by the pre-install connectivity check.<br><br>Default: <code>observability</code>. If your collector is in <code>suse-observability</code>, enter it here — or leave this field as-is and the chart checks both namespaces."
  type: string
  required: false
  default: "observability"
  group: Observability

# --- General Configuration (Form Page) ---
- variable: ollama.enabled
  group: General
  label: "Enable Ollama Deployment"
  description: "Deploy Ollama as part of this chart."
  type: "boolean"
  default: true

- variable: ollama.ollama.gpu.enabled
  group: General
  label: "Enable GPU Acceleration"
  description: "Requires a node with NVIDIA or AMD drivers and the k8s device plugin installed."
  type: "boolean"
  default: true
  show_if: "ollama.enabled=true"

- variable: ollama.ollama.gpu.type
  group: General
  label: "GPU Vendor"
  description: "NVIDIA requires the NVIDIA device plugin and runtimeClass.<br>AMD requires the AMD ROCm device plugin (amd.com/gpu)."
  type: "enum"
  default: "nvidia"
  show_if: "ollama.enabled=true && ollama.ollama.gpu.enabled=true"
  options:
    - "nvidia"
    - "amd"

- variable: loadGenerator.intervalSeconds
  label: "Load Generation Interval (seconds)"
  type: int
  default: 120
  description: "How often the load-generator pod polls the app /ask endpoints.<br><br>Keep at 120 or lower: the SUSE AI topology exporter expires components ~2 minutes after last telemetry. A longer interval leaves the SUSE AI view empty between polls.<br><br>The generator runs as an always-on Deployment, so the pod no longer flaps offline/online in the topology."
  required: true
  group: General

# --- Ollama Deployment Configuration ---
- variable: ollama.models.pull.main
  group: "Ollama Deployment"
  label: "Primary AI Model"
  description: "The primary AI model to pull for HR queries.<br>Example: <code>llama3.2:1b</code>"
  type: "string"
  default: "llama3.2:latest"
  show_if: "ollama.enabled=true"

- variable: ollama.models.pull.secondary
  group: "Ollama Deployment"
  label: "Secondary AI Model"
  description: "Additional model for embeddings (optional)."
  type: "string"
  default: "llama3.2:1b"
  show_if: "ollama.enabled=true"

- variable: ollama.models.pull.embeddings
  group: "Ollama Deployment"
  label: "Embeddings Model"
  description: "Model used for embedding lookups.<br>Example: <code>bge-large:latest</code>"
  type: "string"
  default: "bge-large:latest"
  show_if: "ollama.enabled=true"

- variable: ollama.service.type
  group: "Ollama Deployment"
  label: "Ollama Service Type"
  description: "Method to expose the Ollama service. <b>ClusterIP</b> is recommended."
  type: "enum"
  required: true
  default: "ClusterIP"
  show_if: "ollama.enabled=true"
  options:
    - "ClusterIP"
    - "NodePort"
    - "LoadBalancer"

- variable: ollamaEndpoint
  label: "Ollama Server URL"
  type: string
  description: "URL for your existing Ollama Server.<br>Make sure it has <code>llama3.2:1b</code> and <code>bge-large:latest</code> models available."
  required: true
  default: "http://ollama.example.com:11434"
  group: "Ollama Deployment"
  show_if: "ollama.enabled=false"

- variable: ollama.persistence.enabled
  group: "Ollama Deployment"
  label: "Enable Ollama Model Persistence"
  description: "Create a PersistentVolumeClaim to store Ollama models so they are not re-downloaded on restart."
  type: "boolean"
  default: false
  show_if: "ollama.enabled=true"

- variable: ollama.persistence.size
  group: "Ollama Deployment"
  label: "Ollama Model Storage Size"
  description: "Size of the PVC for Ollama models. Example: <code>10Gi</code>"
  type: "string"
  default: "10Gi"
  show_if: "ollama.enabled=true && ollama.persistence.enabled=true"

- variable: ollama.persistence.storageClassName
  group: "Ollama Deployment"
  label: "Ollama Model Storage Class Name"
  description: "Storage class name for the Ollama models PVC. Leave empty to use the default storage class."
  type: "string"
  default: ""
  show_if: "ollama.enabled=true && ollama.persistence.enabled=true"

- variable: ollama.modelCache.nfs.enabled
  group: "Ollama Deployment"
  label: "Enable NFS Model Cache"
  description: "Mount an NFS share to cache Ollama models across deployments and avoid re-downloading."
  type: "boolean"
  default: false
  show_if: "ollama.enabled=true"

- variable: ollama.modelCache.nfs.server
  group: "Ollama Deployment"
  label: "NFS Server"
  description: "IP address or hostname of the NFS server."
  type: "string"
  default: ""
  show_if: "ollama.enabled=true && ollama.modelCache.nfs.enabled=true"

- variable: ollama.modelCache.nfs.path
  group: "Ollama Deployment"
  label: "NFS Share Path"
  description: "Path on the NFS server to use for caching models. Example: <code>/data/ai-models</code>"
  type: "string"
  default: "/data/ai-models"
  show_if: "ollama.enabled=true && ollama.modelCache.nfs.enabled=true"

# --- Ollama Resources - GPU mode ---
- variable: ollama.resources.requests.cpu
  group: "Ollama Resources"
  label: "Ollama CPU Request"
  description: "CPU request for Ollama. GPU acceleration reduces CPU dependency."
  type: "string"
  default: "1"
  show_if: "ollama.enabled=true && ollama.ollama.gpu.enabled=true"

- variable: ollama.resources.requests.memory
  group: "Ollama Resources"
  label: "Ollama Memory Request"
  description: "Memory request for Ollama in GPU mode."
  type: "string"
  default: "4Gi"
  show_if: "ollama.enabled=true && ollama.ollama.gpu.enabled=true"

- variable: ollama.resources.limits.cpu
  group: "Ollama Resources"
  label: "Ollama CPU Limit"
  description: "CPU limit for Ollama in GPU mode."
  type: "string"
  default: "1"
  show_if: "ollama.enabled=true && ollama.ollama.gpu.enabled=true"

- variable: ollama.resources.limits.memory
  group: "Ollama Resources"
  label: "Ollama Memory Limit"
  description: "Memory limit for Ollama in GPU mode."
  type: "string"
  default: "4Gi"
  show_if: "ollama.enabled=true && ollama.ollama.gpu.enabled=true"

# --- Ollama Resources - CPU-only mode ---
- variable: ollama.resources.requests.cpu
  group: "Ollama Resources"
  label: "Ollama CPU Request"
  description: "CPU request for Ollama in CPU-only mode (higher allocation required without GPU)."
  type: "string"
  default: "2"
  show_if: "ollama.enabled=true && ollama.ollama.gpu.enabled=false"

- variable: ollama.resources.requests.memory
  group: "Ollama Resources"
  label: "Ollama Memory Request"
  description: "Memory request for Ollama in CPU-only mode."
  type: "string"
  default: "8Gi"
  show_if: "ollama.enabled=true && ollama.ollama.gpu.enabled=false"

- variable: ollama.resources.limits.cpu
  group: "Ollama Resources"
  label: "Ollama CPU Limit"
  description: "CPU limit for Ollama in CPU-only mode."
  type: "string"
  default: "2"
  show_if: "ollama.enabled=true && ollama.ollama.gpu.enabled=false"

- variable: ollama.resources.limits.memory
  group: "Ollama Resources"
  label: "Ollama Memory Limit"
  description: "Memory limit for Ollama in CPU-only mode."
  type: "string"
  default: "8Gi"
  show_if: "ollama.enabled=true && ollama.ollama.gpu.enabled=false"

# --- Vector Database + Search Engine components ---
- variable: qdrant.enabled
  group: "Observability Demo Components"
  label: "Deploy Qdrant (Vector Database)"
  description: "Deploys Qdrant and wires the collector to tag it as a Vector Databases component. The RAG app seeds and searches it for topology data."
  type: "boolean"
  default: true

- variable: opensearch.enabled
  group: "Observability Demo Components"
  label: "Deploy OpenSearch (Search Engine)"
  description: "Deploys OpenSearch and wires the collector to tag it as a Search Engines component. The RAG app indexes and searches it for topology data."
  type: "boolean"
  default: true
