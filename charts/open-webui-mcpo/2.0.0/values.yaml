# Default values for mcp-mcpo-helm.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  # -- Global override for container image registry
  imageRegistry: ""
  # -- Global override for container image registry pull secrets
  imagePullSecrets: []
replicaCount: 1
image:
  # -- Docker image repository
  repository: containers/open-webui-mcpo
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "0.0.20-2.2"
  # -- Docker image registry
  registry: dp.apps.rancher.io
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
# fsGroup: 2000

securityContext: {}
# capabilities:
#   drop:
#   - ALL
# readOnlyRootFilesystem: true
# runAsNonRoot: true
# runAsUser: 1000

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000
ingress:
  enabled: false
  className: ""
  annotations: {}
  # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  path: /
  pathType: Prefix
  hosts:
    - mcpo.local
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local
resources: {}
# We usually recommend not to specify default resources and to leave this as a conscious
# choice for the user. This also increases chances charts run on environments with little
# resources, such as Minikube. If you do want to specify resources, uncomment the following
# lines, adjust them as necessary, and remove the curly braces after 'resources:'.
# limits:
#   cpu: 100m
#   memory: 128Mi
# requests:
#   cpu: 100m
#   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80
nodeSelector: {}
tolerations: []
affinity: {}
# Environment variables for the MCP server
# Example:
# env:
#   MCP_OPTION: "value"
env: {}
# Environment variables from secrets
envSecrets: {}
# Secret configuration for sensitive data
secretEnv:
  data: {}
# Use a pre-existing Secret as the mcpo config instead of rendering `config`
# (below) into a ConfigMap. The Secret must contain a `config.json` key with the
# full mcpo configuration. When set, `config` is ignored and no ConfigMap is
# created. Use this when config.json carries sensitive data (e.g. Authorization
# headers / API tokens) that must not live in a plaintext ConfigMap or in git.
# The Secret is NOT managed by this chart — create it out-of-band.
#   kubectl create secret generic mcpo-secrets --from-file=config.json=./config.json
existingConfigSecret: ""
# Configuration file contents for mcpo. Values will be rendered as JSON in
# `config.json` and mounted to the container. Ignored when `existingConfigSecret`
# is set.
config:
  mcpServers:
    memory:
      command: npx
      args:
        - -y
        - "@modelcontextprotocol/server-memory"
  # Example of a more complete configuration:
  # mcpServers:
  #   memory:
  #     command: npx
  #     args:
  #       - -y
  #       - "@modelcontextprotocol/server-memory"
  #   time:
  #     command: uvx
  #     args:
  #       - mcp-server-time
  #       - --local-timezone=America/New_York
  #   mcp_sse:
  #     type: sse
  #     url: http://127.0.0.1:8001/sse
  #     headers:
  #       Authorization: Bearer token
  #       X-Custom-Header: value
  #   mcp_streamable_http:
  #     type: streamable_http
  #     url: http://127.0.0.1:8002/mcp
