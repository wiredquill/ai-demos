{{- if .Values.neuvector.enabled }}
# NeuVector network security rule for AI Compare SUSE monitoring
apiVersion: neuvector.com/v1
kind: NvSecurityRule
metadata:
  name: {{ include "ai-compare-suse.fullname" . }}-ai-monitoring
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-compare-suse.labels" . | nindent 4 }}
spec:
  target:
    selector:
      name: {{ include "ai-compare-suse.fullname" . }}
  ingress:
  - action: allow
    name: allow-ai-chat-traffic
    selector:
      name: external
    ports:
    - port: 7860
      protocol: tcp
  - action: allow
    name: allow-health-checks
    selector:
      name: nodes
    ports:
    - port: 8080
      protocol: tcp
  egress:
  - action: allow
    name: allow-ollama-access
    selector:
      name: ollama
    ports:
    - port: 11434
      protocol: tcp
  - action: allow
    name: allow-webui-access
    selector:
      name: open-webui
    ports:
    - port: 8080
      protocol: tcp
{{- end }}
