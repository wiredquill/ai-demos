{{- if .Values.neuvector.enabled }}
apiVersion: neuvector.com/v1
kind: NvSecurityRule
metadata:
  name: {{ include "ai-compare-suse.fullname" . }}-security-rule
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-compare-suse.labels" . | nindent 4 }}
spec:
  name: {{ .Release.Namespace }}.{{ include "ai-compare-suse.fullname" . }}
  comment: "Security group for AI Compare application with DLP monitoring"
  mode: discover
  kind: container
  dlpSensors:
    - name: {{ include "ai-compare-suse.fullname" . }}-dlp-rule
  ingress:
    - action: allow
      name: Allow from Open WebUI
      selector: open-webui
    - action: allow
      name: Allow from Ollama
      selector: ollama
  egress:
    - action: allow
      name: Allow external traffic
      selector: external
      ports: any
{{- end }}
