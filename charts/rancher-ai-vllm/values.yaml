# Default values for rancher-ai-vllm
# Thin wrapper around the SUSE Application Collection `vllm` chart (engine +
# router) that adds a Prometheus scrape target for SUSE Observability.
#
# Token data comes from vLLM's NATIVE /metrics endpoint (vllm:prompt_tokens_total,
# vllm:generation_tokens_total, ...) — no proxy or sidecar required. The
# cluster-level SUSE Observability collector scrapes the Service created by
# `vllm.extraObjects` below (label app.kubernetes.io/part-of=vllm).

# -- Cluster identity stamped into OTel resource attributes (k8s.cluster.name)
clusterName: ""

# ===== vLLM (SUSE Application Collection subchart) =====
vllm:
  global:
    imagePullSecrets:
      - name: application-collection
  servingEngineSpec:
    enableEngine: true
    labels:
      environment: "production"
    servicePort: 80
    # IMPORTANT: modelSpec is a MAP (keyed by model name), NOT a list.
    # The Rancher UI questions.yaml cannot write list elements (paths like
    # modelSpec[0].modelURL are stored as a literal map key and silently
    # ignored), but dotted map paths (modelSpec.main.modelURL) work fine.
    # The vendored subchart templates iterate modelSpec with a single-var
    # range, so a map iterates its values exactly like the old list did —
    # no subchart changes needed. Add more entries to serve multiple models.
    modelSpec:
      main:
        # This key is the UI anchor; it does not become part of resource
        # names — the `name` field below does.
        name: qwen35b
        registry: dp.apps.rancher.io
        repository: containers/vllm-openai
        tag: "0.19.0"
        modelURL: Qwen/Qwen3.6-35B-A3B
        requestGPU: 1
        requestGPUType: nvidia.com/gpu
        requestCPU: 8
        requestMemory: "32Gi"
        # Limits: vLLM loads weights through CPU RAM before moving to GPU.
        # limitMemory must comfortably exceed the model size (e.g. 35B AWQ ~19GB
        # -> 32Gi; 7B fp16 ~16GB -> 24Gi). Leave 0/"" to inherit the request.
        limitCPU: 8
        limitMemory: "48Gi"
        # MIG only: uncomment to cap GPU memory on partitioned GPUs (nvidia.com/gpumem).
        # limitGPUMem: "71680"
        # Model cache: vLLM downloads weights into a PVC so restarts are fast.
        pvcStorage: "100Gi"
        # Storage class for the model cache PVC. "Default" (chart default) uses
        # the cluster's DEFAULT storage class — the vendored subchart is
        # patched to omit storageClassName for "Default"/"" so the default
        # class provisions it. Set any real class name (harvester, longhorn,
        # local-path) to pin a specific class.
        storageClass: "Default"
        # Shared NFS model cache (see sharedPvcStorage below): downloads go to
        # /data/shared-pvc-storage so a NEW instance skips re-downloading.
        vllmConfig:
          extraArgs:
            - "--download-dir"
            - "/data/shared-pvc-storage"
  # Shared NFS-backed model cache. Creates a static PV+PVC (RWX) pointing at
  # your NFS share and mounts it at /data/shared-pvc-storage in the engine.
  # vLLM caches downloaded weights there (--download-dir above), so launching
  # another instance / release reuses the same model files — no re-download.
  # enabled: false turns the whole block off (no PV/PVC/mount) and vLLM falls
  # back to the per-instance model PVC. storageClass "Default"/"" = static
  # NFS binding (storageClassName: "" on both PV and PVC) — no provisioner
  # class required; set a real class name to pin one.
  sharedPvcStorage:
    enabled: true
    nfs:
      server: "10.0.9.10"
      path: "/data/ai-models"
    size: "200Gi"
    storageClass: "Default"
    accessModes:
      - ReadWriteMany
  routerSpec:
    enableRouter: true
    # Internal router service. ALWAYS ClusterIP — external exposure is handled
    # by the dedicated Service in routerExposure below (the packaged subchart's
    # router Service cannot render nodePort/loadBalancerIP, so we render our own).
    serviceType: ClusterIP
    otel:
      # Traces to the shared SUSE Observability collector (gRPC endpoint)
      endpoint: "http://open-telemetry-collector-opentelemetry-collector.observability.svc.cluster.local:4317"
      serviceName: vllm-router
    ingress:
      # Expose the OpenAI-compatible endpoint to Rancher AI / Liz. Rancher AI
      # runs on the Rancher LOCAL cluster and talks to the LLM over the
      # network — enable this when Liz is on a different cluster.
      enabled: false
      className: nginx
      annotations: {}
      hosts:
        main:
          host: vllm.wiredquill.com
          paths:
            - path: /
              pathType: Prefix
      tls: []
  # ===== External exposure of the router endpoint (NodePort / LoadBalancer) =====
  # Alternative to Ingress. Rendered as a dedicated Service selecting the same
  # router pods. Rancher AI openaiUrl:
  #   NodePort:      http://<node-ip>:<nodePort>/v1
  #   LoadBalancer:  http://<lb-ip>:80/v1
  routerExposure:
    # ClusterIP = in-cluster only (no extra Service created).
    # NodePort = expose on every node's IP (bare-metal / Rancher without LB).
    # LoadBalancer = external LB IP (cloud / MetalLB).
    type: ClusterIP
    # Fixed NodePort (30000-32767) used when type=NodePort.
    nodePort: ""
    # Fixed LoadBalancer IP used when type=LoadBalancer (optional; empty = auto).
    loadBalancerIP: ""
  extraObjects:
    # Prometheus scrape target for the engine: a Service selecting the same
    # pods as the chart's engine Service, labelled for the collector's
    # part-of=vllm scrape rule. Rendered inside the vllm subchart context.
    - |-
      apiVersion: v1
      kind: Service
      metadata:
        name: {{ .Release.Name }}-engine-scrape
        labels:
          app.kubernetes.io/part-of: vllm
          app.kubernetes.io/managed-by: helm
        annotations:
          prometheus.io/scrape: "true"
          prometheus.io/port: "80"
          prometheus.io/path: /metrics
      spec:
        selector:
          model: {{ (first (values .Values.servingEngineSpec.modelSpec)).name }}
          helm-release-name: {{ .Release.Name }}
        ports:
        - name: http
          port: 80
          targetPort: container-port
    # External exposure of the router endpoint — rendered only when
    # routerExposure.type is NodePort or LoadBalancer. Selects the same pods
    # as the internal router Service (helm-release-name + router labels).
    - |-
      {{- if ne .Values.routerExposure.type "ClusterIP" }}
      apiVersion: v1
      kind: Service
      metadata:
        name: {{ .Release.Name }}-router-external
        labels:
          app.kubernetes.io/part-of: vllm
          app.kubernetes.io/managed-by: helm
      spec:
        type: {{ .Values.routerExposure.type }}
        {{- if eq .Values.routerExposure.type "LoadBalancer" }}
        {{- if .Values.routerExposure.loadBalancerIP }}
        loadBalancerIP: {{ .Values.routerExposure.loadBalancerIP }}
        {{- end }}
        {{- end }}
        selector:
          app.kubernetes.io/name: router
          app.kubernetes.io/instance: {{ .Release.Name }}
          app.kubernetes.io/component: router
        ports:
        - name: http
          port: 80
          targetPort: 8000
          {{- if eq .Values.routerExposure.type "NodePort" }}
          {{- if .Values.routerExposure.nodePort }}
          nodePort: {{ .Values.routerExposure.nodePort }}
          {{- end }}
          {{- end }}
      {{- end }}
