{{- if .Values.collector.operator.enabled }}
{{/*
Pre-install hook that copies the SUSE Observability API_KEY secret from the
source namespace (observability) into the release namespace. The collector CR
references the secret via secretKeyRef, and secrets are namespaced, so it must
exist in the release namespace for the collector pod to start.

Uses only curl + shell (curlimages/curl image, no python/jq dependency).
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ai-compare-opentelemetry.fullname" . }}-copy-collector-secret
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "ai-compare-opentelemetry.labels" . | nindent 4 }}
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ai-compare-opentelemetry.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: collector-secret-copy
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "ai-compare-opentelemetry.fullname" . }}-collector-secret-copy
      containers:
      - name: copy-secret
        image: curlimages/curl:8.5.0
        command:
        - /bin/sh
        - -c
        - |
          set -e
          SRC_NS="{{ .Values.collector.operator.sourceNamespace }}"
          SECRET="{{ .Values.collector.operator.apiKeySecret }}"
          DST_NS="{{ .Release.Namespace }}"
          TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          API="https://kubernetes.default.svc"
          echo "==> Copying secret $SECRET from $SRC_NS to $DST_NS"
          # Skip if it already exists in the destination namespace
          if curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" "$API/api/v1/namespaces/$DST_NS/secrets/$SECRET" | grep -q "^200$"; then
            echo "    Secret $SECRET already exists in $DST_NS - skipping"
            exit 0
          fi
          # Fetch the source secret; extract just the data map (base64 values have no braces)
          curl -fsS -H "Authorization: Bearer $TOKEN" "$API/api/v1/namespaces/$SRC_NS/secrets/$SECRET" -o /tmp/src.json
          DATA=$(grep -o '"data": *{[^}]*}' /tmp/src.json | head -1)
          if [ -z "$DATA" ]; then
            echo "ERROR: could not extract data from secret $SRC_NS/$SECRET" >&2
            exit 1
          fi
          # Build a clean secret body (no namespace/uid/resourceVersion/creationTimestamp/managedFields)
          printf '{"apiVersion":"v1","kind":"Secret","metadata":{"name":"%s"},"type":"Opaque",%s}\n' "$SECRET" "$DATA" > /tmp/clean.json
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            --data @/tmp/clean.json "$API/api/v1/namespaces/$DST_NS/secrets" > /dev/null
          echo "    Secret copied successfully"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
{{- end }}
