{{- if .Values.collector.operator.enabled }}
{{/*
OpenTelemetryCollector CR deployed by the OpenTelemetry Operator.
Same SUSE AI relay config as the helm-managed collector (infer pipelines +
topology exporter), pinned to the release namespace via SUSE_AI_NAMESPACE.
The operator creates the Deployment + Services (<name>-collector) from this CR.
*/}}
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: {{ .Values.collector.operator.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-compare-opentelemetry.labels" . | nindent 4 }}
spec:
  image: {{ .Values.collector.operator.image }}
  serviceAccount: {{ include "ai-compare-opentelemetry.fullname" . }}-collector
  env:
    - name: MY_POD_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
    - name: K8S_CLUSTER_NAME
      value: {{ .Values.collector.operator.clusterName }}
    - name: SUSE_AI_NAMESPACE
      value: {{ .Release.Namespace }}
    - name: API_KEY
      valueFrom:
        secretKeyRef:
          name: {{ .Values.collector.operator.apiKeySecret }}
          key: API_KEY
  config:
    connectors:
      routing/traces:
        error_mode: ignore
        table:
          - action: copy
            condition: "true"
            pipelines:
              - traces/sampling
              - traces/model-relations
              - traces/provider-relations
              - traces/topology
    exporters:
      debug:
        verbosity: basic
      otlp_grpc:
        endpoint: {{ .Values.collector.operator.otlpGrpcEndpoint }}
        headers:
          Authorization: SUSEObservability ${env:API_KEY}
        tls:
          insecure: false
      topology:
        api_key: ${env:API_KEY}
        endpoint: {{ .Values.collector.operator.backendEndpoint }}
        namespace: ${env:SUSE_AI_NAMESPACE}
        tls:
          insecure_skip_verify: true
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
        path: /
    processors:
      batch: {}
      filter/exclude-already-tagged:
        error_mode: ignore
        metrics:
          resource:
            - attributes["suse.ai.component.name"] != nil
      filter/genai-metrics-only:
        error_mode: ignore
        metrics:
          metric:
            - not(IsMatch(name, "gen_ai\\..*"))
      filter/genai-spans:
        error_mode: ignore
        traces:
          span:
            - attributes["gen_ai.request.model"] == nil
      groupbyattrs/infer-models:
        keys:
          - gen_ai.request.model
          - gen_ai.provider.name
      groupbyattrs/infer-providers:
        keys:
          - gen_ai.provider.name
      groupbyattrs/model-relations:
        keys:
          - gen_ai.provider.name
      k8s_attributes:
        extract:
          labels:
            - from: pod
              key_regex: (.*)
              tag_name: $$1
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.node.name
            - k8s.pod.start_time
            - k8s.deployment.name
            - k8s.replicaset.name
            - k8s.replicaset.uid
            - k8s.daemonset.name
            - k8s.daemonset.uid
            - k8s.job.name
            - k8s.job.uid
            - k8s.container.name
            - k8s.cronjob.name
            - k8s.statefulset.name
            - k8s.statefulset.uid
            - container.image.tag
            - container.image.name
            - k8s.cluster.uid
            - service.namespace
            - service.name
            - service.version
            - service.instance.id
          otel_annotations: true
        passthrough: false
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      transform/infer-applications:
        error_mode: ignore
        metric_statements:
          - context: resource
            statements:
              - set(attributes["suse.ai.managed"], "true")
              - set(attributes["suse.ai.component.type"], "application")
              - set(attributes["suse.ai.component.name"], attributes["service.name"])
              - set(attributes["k8s.namespace.name"], "${env:SUSE_AI_NAMESPACE}")
      transform/infer-models:
        error_mode: ignore
        metric_statements:
          - context: resource
            statements:
              - set(attributes["service.name"], attributes["gen_ai.request.model"]) where attributes["gen_ai.request.model"] != nil
              - set(attributes["service.instance.id"], attributes["gen_ai.request.model"]) where attributes["gen_ai.request.model"] != nil
              - set(attributes["suse.ai.managed"], "true") where attributes["gen_ai.request.model"] != nil
              - set(attributes["suse.ai.component.name"], attributes["gen_ai.request.model"]) where attributes["gen_ai.request.model"] != nil
              - set(attributes["suse.ai.component.type"], "llm-model") where attributes["gen_ai.request.model"] != nil
              - set(attributes["k8s.namespace.name"], "${env:SUSE_AI_NAMESPACE}") where attributes["gen_ai.request.model"] != nil
      transform/infer-providers:
        error_mode: ignore
        metric_statements:
          - context: resource
            statements:
              - set(attributes["service.name"], attributes["gen_ai.provider.name"]) where attributes["gen_ai.provider.name"] != nil
              - set(attributes["service.instance.id"], attributes["gen_ai.provider.name"]) where attributes["gen_ai.provider.name"] != nil
              - set(attributes["suse.ai.managed"], "true") where attributes["gen_ai.provider.name"] != nil
              - set(attributes["suse.ai.component.name"], attributes["gen_ai.provider.name"]) where attributes["gen_ai.provider.name"] != nil
              - set(attributes["suse.ai.component.type"], "inference-engine") where attributes["gen_ai.provider.name"] != nil
              - set(attributes["k8s.namespace.name"], "${env:SUSE_AI_NAMESPACE}") where attributes["gen_ai.provider.name"] != nil
      transform/model-relations:
        error_mode: ignore
        trace_statements:
          - context: resource
            statements:
              - set(attributes["service.name"], attributes["gen_ai.provider.name"]) where attributes["gen_ai.provider.name"] != nil
              - set(attributes["service.instance.id"], attributes["gen_ai.provider.name"]) where attributes["gen_ai.provider.name"] != nil
          - context: span
            statements:
              - set(attributes["peer.service"], attributes["gen_ai.request.model"]) where attributes["gen_ai.request.model"] != nil
      transform/provider-relations:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              - set(attributes["peer.service"], resource.attributes["gen_ai.provider.name"]) where resource.attributes["gen_ai.provider.name"] != nil
      transform/topology-provider:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              - set(attributes["gen_ai.provider.name"], resource.attributes["gen_ai.provider.name"]) where resource.attributes["gen_ai.provider.name"] != nil
              - set(attributes["gen_ai.request.model"], resource.attributes["gen_ai.request.model"]) where resource.attributes["gen_ai.request.model"] != nil
    receivers:
      jaeger:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:14250
          thrift_compact:
            endpoint: ${env:MY_POD_IP}:6831
          thrift_http:
            endpoint: ${env:MY_POD_IP}:14268
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
          http:
            endpoint: ${env:MY_POD_IP}:4318
      prometheus:
        config:
          scrape_configs:
            - job_name: gpu-metrics
              scheme: http
              scrape_interval: 10s
              static_configs:
                - labels:
                    host: {{ .Values.collector.operator.gpuNode }}
                    hostname: {{ .Values.collector.operator.gpuNode }}
                    k8s_node_name: {{ .Values.collector.operator.gpuNode }}
                    kubernetes_namespace: gpu-operator
                    kubernetes_node: {{ .Values.collector.operator.gpuNode }}
                    node: {{ .Values.collector.operator.gpuNode }}
                    service: nvidia-dcgm-exporter
                  targets:
                    - nvidia-dcgm-exporter.gpu-operator.svc:9400
            - job_name: vllm
              kubernetes_sd_configs:
                - role: service
              relabel_configs:
                - action: keep
                  regex: vllm
                  source_labels: [__meta_kubernetes_service_label_app]
                - action: keep
                  regex: "true"
                  source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
                - regex: ([^:]+)(?::\d+)?;(\d+)
                  replacement: $1:$2
                  source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
                  target_label: __address__
              scrape_interval: 10s
      zipkin:
        endpoint: ${env:MY_POD_IP}:9411
    service:
      extensions:
        - health_check
      pipelines:
        logs:
          exporters: [otlp_grpc, debug]
          processors: [k8s_attributes, memory_limiter, batch]
          receivers: [otlp]
        metrics:
          exporters: [otlp_grpc, debug]
          processors: [k8s_attributes, memory_limiter, batch]
          receivers: [prometheus, otlp]
        metrics/infer-applications:
          exporters: [otlp_grpc]
          processors: [filter/genai-metrics-only, filter/exclude-already-tagged, transform/infer-applications, k8s_attributes, batch]
          receivers: [otlp]
        metrics/infer-models:
          exporters: [otlp_grpc]
          processors: [filter/genai-metrics-only, groupbyattrs/infer-models, transform/infer-models, k8s_attributes, batch]
          receivers: [otlp]
        metrics/infer-providers:
          exporters: [otlp_grpc]
          processors: [filter/genai-metrics-only, groupbyattrs/infer-providers, transform/infer-providers, k8s_attributes, batch]
          receivers: [otlp]
        traces:
          exporters: [routing/traces]
          processors: [k8s_attributes, memory_limiter, batch]
          receivers: [otlp, jaeger, zipkin]
        traces/model-relations:
          exporters: [otlp_grpc, debug]
          processors: [filter/genai-spans, groupbyattrs/model-relations, transform/model-relations, batch]
          receivers: [routing/traces]
        traces/provider-relations:
          exporters: [otlp_grpc, debug]
          processors: [filter/genai-spans, transform/provider-relations, batch]
          receivers: [routing/traces]
        traces/sampling:
          exporters: [otlp_grpc, debug]
          processors: [batch]
          receivers: [routing/traces]
        traces/topology:
          exporters: [topology]
          processors: [transform/topology-provider, batch]
          receivers: [routing/traces]
    telemetry:
      metrics:
        readers:
          - pull:
              exporter:
                prometheus:
                  host: ${env:MY_POD_IP}
                  port: 8888
      resource:
        host.name: ${env:OTEL_K8S_NODE_NAME}
        k8s.namespace.name: ${env:OTEL_K8S_NAMESPACE}
        k8s.node.ip: ${env:OTEL_K8S_NODE_IP}
        k8s.node.name: ${env:OTEL_K8S_NODE_NAME}
        k8s.pod.ip: ${env:OTEL_K8S_POD_IP}
        k8s.pod.name: ${env:OTEL_K8S_POD_NAME}
{{- end }}
