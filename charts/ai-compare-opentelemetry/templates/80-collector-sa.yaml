{{- if .Values.collector.operator.enabled }}
{{/*
ServiceAccount for the operator-managed collector.
The CR references this via spec.serviceAccount, so the collector pod gets the
image pull secrets at creation time (no post-creation SA patch race).
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ai-compare-opentelemetry.fullname" . }}-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-compare-opentelemetry.labels" . | nindent 4 }}
imagePullSecrets:
  - name: application-collection
  - name: suse-registry
---
{{/*
Cluster RBAC for the collector's k8s_attributes processor (pods/namespaces/nodes
metadata enrichment) and the prometheus service discovery for vLLM scraping.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ai-compare-opentelemetry.fullname" . }}-collector-rbac
  labels:
    {{- include "ai-compare-opentelemetry.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: [pods, namespaces, nodes, endpoints, services]
  verbs: [get, list, watch]
- apiGroups: [apps, extensions]
  resources: [replicasets]
  verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ai-compare-opentelemetry.fullname" . }}-collector-rbac
  labels:
    {{- include "ai-compare-opentelemetry.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ai-compare-opentelemetry.fullname" . }}-collector-rbac
subjects:
- kind: ServiceAccount
  name: {{ include "ai-compare-opentelemetry.fullname" . }}-collector
  namespace: {{ .Release.Namespace }}
{{- end }}
