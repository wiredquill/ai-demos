apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  annotations:
    # GenAI Application Annotations for SUSE Observability
    genai.observability/enabled: "true"
    genai.observability/type: "llm-backend"
    genai.observability/models: "llama3.2:latest"
    genai.observability/framework: "ollama"
    observability.suse.com/genai-app: "true"
    ai.application.category: "model-serving"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
        app.kubernetes.io/name: ai-compare
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: llm-backend
        app.kubernetes.io/part-of: genai-stack
        ai.framework: "ollama"
        genai.application: "true"
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # --- ADDED RUNTIMECLASSNAME BLOCK ---
      # This will add runtimeClassName: nvidia only when GPU is enabled for NVIDIA
      {{- if and .Values.ollama.gpu.enabled (eq .Values.ollama.hardware.type "nvidia") }}
      runtimeClassName: nvidia
      {{- end }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                {{- if eq .Values.ollama.hardware.type "apple" }}
                - arm64
                {{- else }}
                - amd64
                {{- end }}
      initContainers:
      {{- if .Values.ollama.modelCache.nfs.enabled }}
      # NFS-backed init container: pulls models directly into NFS if not already present
      - name: ollama-pull-model
        image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        command: ["/bin/sh", "-c"]
        args:
          - |
            ollama serve &
            sleep 5
            {{- range .Values.ollama.models }}
            ollama list | grep -q "{{ . }}" || ollama pull {{ . }}
            {{- end }}
            wait
        volumeMounts:
        - name: ollama-models
          mountPath: /root/.ollama
        env:
        - name: OLLAMA_HOST
          value: "0.0.0.0:11434"
        resources:
          limits:
            memory: "4Gi"
            cpu: "2"
          requests:
            memory: "1Gi"
            cpu: "500m"
      {{- else }}
      # Standard Model Download
      # Pulls configured models; skipped if already present in PVC
      - name: ollama-pull-model
        image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        command: ["/bin/sh", "-c"]
        args:
          - |
            ollama serve &
            sleep 5
            {{- range .Values.ollama.models }}
            ollama list | grep -q "{{ . }}" || ollama pull {{ . }}
            {{- end }}
            wait
        volumeMounts:
        - name: ollama-models
          mountPath: /root/.ollama
        resources:
          limits:
            memory: "4Gi"
            cpu: "2"
          requests:
            memory: "512Mi"
            cpu: "500m"
      {{- end }}
      containers:
      - name: ollama
        image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        command: ["ollama", "serve"]
        ports:
        - containerPort: {{ .Values.ollama.service.port }}
          name: http
        env:
        - name: OLLAMA_HOST
          value: "0.0.0.0:{{ .Values.ollama.service.port }}"
        volumeMounts:
        - name: ollama-models
          mountPath: /root/.ollama
        resources:
          requests:
            memory: {{ .Values.ollama.resources.requests.memory | quote }}
            cpu: {{ .Values.ollama.resources.requests.cpu | quote }}
          limits:
            memory: {{ .Values.ollama.resources.limits.memory | quote }}
            cpu: {{ .Values.ollama.resources.limits.cpu | quote }}
            {{- if and .Values.ollama.gpu.enabled (eq .Values.ollama.hardware.type "nvidia") }}
            nvidia.com/gpu: 1
            {{- end }}
        readinessProbe:
          httpGet:
            path: /
            port: {{ .Values.ollama.service.port }}
          initialDelaySeconds: 15
          periodSeconds: 15
      {{- if .Values.ollama.observability.enabled }}
      # OpenTelemetry Sidecar for Ollama observability
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:0.91.0
        ports:
        - containerPort: 4317
          name: otlp-grpc
        - containerPort: 4318
          name: otlp-http
        - containerPort: 8888
          name: metrics
        env:
        - name: OLLAMA_ENDPOINT
          value: "http://localhost:{{ .Values.ollama.service.port }}"
        - name: OTLP_ENDPOINT
          value: "{{ .Values.ollama.observability.otlpEndpoint }}"
        volumeMounts:
        - name: otel-config
          mountPath: /etc/otel-collector-config.yaml
          subPath: otel-collector-config.yaml
        command: ["/otelcol-contrib"]
        args: ["--config=/etc/otel-collector-config.yaml"]
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
      {{- end }}
      volumes:
      - name: ollama-models
        {{- if .Values.ollama.modelCache.nfs.enabled }}
        nfs:
          server: {{ .Values.ollama.modelCache.nfs.server }}
          path: {{ .Values.ollama.modelCache.nfs.path }}
        {{- else if .Values.ollama.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ include "ai-compare-opentelemetry.fullname" . }}-ollama-models-pvc
        {{- else }}
        emptyDir: {}
        {{- end }}
      {{- if .Values.ollama.observability.enabled }}
      # OpenTelemetry configuration
      - name: otel-config
        configMap:
          name: {{ include "ai-compare-opentelemetry.fullname" . }}-ollama-otel-config
      {{- end }}
