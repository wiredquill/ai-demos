{{- if .Values.pipelines.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: pipelines-service
  labels:
    app: pipelines
  annotations:
    {{- include "ai-compare-opentelemetry.spanDurationServiceAnnotations" . | nindent 4 }}
spec:
  selector:
    app: pipelines
  ports:
  - name: http
    port: {{ .Values.pipelines.service.port }}
    targetPort: {{ .Values.pipelines.service.port }}
    protocol: TCP
  type: {{ .Values.pipelines.service.type }}
{{- end }}