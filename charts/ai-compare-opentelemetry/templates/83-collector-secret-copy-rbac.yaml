{{- if .Values.collector.operator.enabled }}
{{/*
RBAC for the secret-copy pre-install hook.
Minimal scope: can read the specific API_KEY secret by name from any namespace,
and can create secrets only in the release namespace.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ai-compare-opentelemetry.fullname" . }}-collector-secret-copy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-compare-opentelemetry.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ai-compare-opentelemetry.fullname" . }}-collector-secret-reader
  labels:
    {{- include "ai-compare-opentelemetry.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: [secrets]
  resourceNames: ["{{ .Values.collector.operator.apiKeySecret }}"]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ai-compare-opentelemetry.fullname" . }}-collector-secret-reader
  labels:
    {{- include "ai-compare-opentelemetry.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ai-compare-opentelemetry.fullname" . }}-collector-secret-reader
subjects:
- kind: ServiceAccount
  name: {{ include "ai-compare-opentelemetry.fullname" . }}-collector-secret-copy
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ai-compare-opentelemetry.fullname" . }}-collector-secret-writer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-compare-opentelemetry.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: [secrets]
  verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ai-compare-opentelemetry.fullname" . }}-collector-secret-writer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-compare-opentelemetry.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ai-compare-opentelemetry.fullname" . }}-collector-secret-writer
subjects:
- kind: ServiceAccount
  name: {{ include "ai-compare-opentelemetry.fullname" . }}-collector-secret-copy
  namespace: {{ .Release.Namespace }}
{{- end }}
