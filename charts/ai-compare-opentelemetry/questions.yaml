questions:
# General Configuration
- variable: ollama.enabled
  group: General
  label: "Enable Ollama Deployment"
  description: "If true, Ollama will be deployed as part of this chart."
  type: "boolean"
  default: true

- variable: ollamaEndpoint
  label: "Ollama Endpoint"
  type: string
  description: "The URL for the Ollama service - Include http:// and port."
  required: true
  default: "http://ollama:11434"
  group: General
  show_if: "ollama.enabled=false"

- variable: otlpEndpoint
  label: "OTLP Endpoint"
  type: string
  description: "Open Telemetry Endpoint - Include http:// and port."
  required: true
  default: "http://opentelemetry-collector.opentelemetry-collector.svc.cluster.local:4318"
  group: General

- variable: ollama.gpu.enabled
  group: General
  label: "Enable GPU Acceleration"
  description: "Requires a node with NVIDIA or AMD drivers and the k8s device plugin installed."
  type: "boolean"
  default: true

- variable: ollama.hardware.type
  group: General
  label: "GPU Vendor"
  description: "Select the GPU vendor. NVIDIA requires the NVIDIA device plugin and runtimeClass. AMD requires the AMD ROCm device plugin (amd.com/gpu)."
  type: "enum"
  default: "nvidia"
  show_if: "ollama.gpu.enabled=true"
  options:
    - "nvidia"
    - "amd"

- variable: frontend.enabled
  group: General
  label: "Enable Load Simulator"
  description: "Deploy HTTP load simulator for traffic generation and observability monitoring."
  type: "boolean"
  default: true

- variable: schedule
  label: "Schedule"
  type: string
  default: "*/5 * * * *"
  description: "Cron schedule for user simulation request to apps"
  required: true
  group: General
  show_if: "frontend.enabled=true"

- variable: aiCompare.service.type
  group: General
  label: "AI Compare Service Type"
  description: "Method to expose the AI Compare service."
  type: "enum"
  required: true
  default: "NodePort"
  options:
    - "ClusterIP"
    - "NodePort"
    - "LoadBalancer"

- variable: aiCompare.service.nodePort
  group: General
  label: "AI Compare NodePort (Gradio UI)"
  description: "NodePort for the Gradio UI (port 7860). Only used when Service Type is NodePort."
  type: "integer"
  default: 31705
  show_if: "aiCompare.service.type=NodePort"

- variable: aiCompare.service.httpApiNodePort
  group: General
  label: "AI Compare NodePort (HTTP API)"
  description: "NodePort for the HTTP API server (port 8080). Only used when Service Type is NodePort."
  type: "integer"
  default: 31706
  show_if: "aiCompare.service.type=NodePort"

- variable: neuvector.enabled
  group: General
  label: "Enable SUSE Security (NeuVector)"
  description: "Deploy NeuVector network security rules and DLP sensors for security demos. Uses declarative YAML configuration."
  type: "boolean"
  default: false

# Ollama Deployment Configuration
- variable: ollama.models[0]
  group: "Ollama Deployment"
  label: "Ollama Model"
  description: "The Ollama model to pull and use for inference."
  type: "string"
  default: "llama3.2:latest"
  required: true
  show_if: "ollama.enabled=true"

- variable: ollama.service.type
  group: "Ollama Deployment"
  label: "Ollama Service Type"
  description: "Method to expose the Ollama service. 'ClusterIP' is recommended."
  type: "enum"
  required: true
  default: "ClusterIP"
  show_if: "ollama.enabled=true"
  options:
    - "ClusterIP"
    - "NodePort"
    - "LoadBalancer"

- variable: ollama.persistence.enabled
  group: "Ollama Deployment"
  label: "Enable Ollama Model Persistence"
  description: "If true, a PersistentVolumeClaim will be created to store Ollama models so they are not re-downloaded on restart."
  type: "boolean"
  default: true
  show_if: "ollama.enabled=true"

- variable: ollama.persistence.size
  group: "Ollama Deployment"
  label: "Ollama Model Storage Size"
  description: "The size of the PersistentVolumeClaim for Ollama models (e.g., '10Gi', '50Gi')."
  type: "string"
  default: "10Gi"
  show_if: "ollama.enabled=true && ollama.persistence.enabled=true"

- variable: ollama.persistence.storageClassName
  group: "Ollama Deployment"
  label: "Ollama Model Storage Class Name"
  description: "The storage class name for the Ollama models PVC. Leave empty to use the default storage class."
  type: "string"
  default: ""
  show_if: "ollama.enabled=true && ollama.persistence.enabled=true"

- variable: ollama.modelCache.nfs.enabled
  group: "Ollama Deployment"
  label: "Enable NFS Model Cache"
  description: "Mount an NFS share to cache Ollama models across deployments and avoid re-downloading."
  type: "boolean"
  default: false
  show_if: "ollama.enabled=true"

- variable: ollama.modelCache.nfs.server
  group: "Ollama Deployment"
  label: "NFS Server"
  description: "IP address or hostname of the NFS server."
  type: "string"
  default: ""
  show_if: "ollama.enabled=true && ollama.modelCache.nfs.enabled=true"

- variable: ollama.modelCache.nfs.path
  group: "Ollama Deployment"
  label: "NFS Share Path"
  description: "Path on the NFS server to use for caching models (e.g., '/data/ai-models')."
  type: "string"
  default: "/data/ai-models"
  show_if: "ollama.enabled=true && ollama.modelCache.nfs.enabled=true"

# Ollama Resources - GPU mode (shown when GPU enabled on General page)
- variable: ollama.resources.requests.cpu
  group: "Ollama Resources"
  label: "Ollama CPU Request"
  description: "CPU request for Ollama. GPU acceleration reduces CPU dependency."
  type: "string"
  default: "1"
  show_if: "ollama.enabled=true && ollama.gpu.enabled=true"

- variable: ollama.resources.requests.memory
  group: "Ollama Resources"
  label: "Ollama Memory Request"
  description: "Memory request for Ollama in GPU mode."
  type: "string"
  default: "4Gi"
  show_if: "ollama.enabled=true && ollama.gpu.enabled=true"

- variable: ollama.resources.limits.cpu
  group: "Ollama Resources"
  label: "Ollama CPU Limit"
  description: "CPU limit for Ollama in GPU mode."
  type: "string"
  default: "2"
  show_if: "ollama.enabled=true && ollama.gpu.enabled=true"

- variable: ollama.resources.limits.memory
  group: "Ollama Resources"
  label: "Ollama Memory Limit"
  description: "Memory limit for Ollama in GPU mode."
  type: "string"
  default: "8Gi"
  show_if: "ollama.enabled=true && ollama.gpu.enabled=true"

# Ollama Resources - CPU-only mode (shown when GPU disabled on General page)
- variable: ollama.resourcesCpuOnly.requests.cpu
  group: "Ollama Resources"
  label: "Ollama CPU Request"
  description: "CPU request for Ollama in CPU-only mode (higher allocation required without GPU)."
  type: "string"
  default: "1.5"
  show_if: "ollama.enabled=true && ollama.gpu.enabled=false"

- variable: ollama.resourcesCpuOnly.requests.memory
  group: "Ollama Resources"
  label: "Ollama Memory Request"
  description: "Memory request for Ollama in CPU-only mode."
  type: "string"
  default: "6Gi"
  show_if: "ollama.enabled=true && ollama.gpu.enabled=false"

- variable: ollama.resourcesCpuOnly.limits.cpu
  group: "Ollama Resources"
  label: "Ollama CPU Limit"
  description: "CPU limit for Ollama in CPU-only mode."
  type: "string"
  default: "3"
  show_if: "ollama.enabled=true && ollama.gpu.enabled=false"

- variable: ollama.resourcesCpuOnly.limits.memory
  group: "Ollama Resources"
  label: "Ollama Memory Limit"
  description: "Memory limit for Ollama in CPU-only mode."
  type: "string"
  default: "12Gi"
  show_if: "ollama.enabled=true && ollama.gpu.enabled=false"
