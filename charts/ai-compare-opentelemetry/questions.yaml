questions:
# General Configuration
- variable: ollama.enabled
  group: General
  label: "Enable Ollama Deployment"
  description: "If true, Ollama will be deployed as part of this chart."
  type: "boolean"
  default: true

- variable: ollamaEndpoint
  label: "Ollama Endpoint"
  type: string
  description: "The URL for the Ollama service - Include http:// and port."
  required: true
  default: "http://ollama:11434"
  group: General
  show_if: "ollama.enabled=false"

- variable: otlpEndpoint
  label: "OTLP Endpoint"
  type: string
  description: "Open Telemetry Endpoint - Include http:// and port."
  required: true
  default: "http://opentelemetry-collector.opentelemetry-collector.svc.cluster.local:4318"
  group: General

- variable: ollama.gpu.enabled
  group: General
  label: "Enable NVIDIA GPU Acceleration"
  description: "Requires a node with NVIDIA drivers and the k8s device plugin installed."
  type: "boolean"
  default: true

- variable: frontend.enabled
  group: General
  label: "Enable Load Simulator"
  description: "Deploy HTTP load simulator for traffic generation and observability monitoring."
  type: "boolean"
  default: true

- variable: schedule
  label: "Schedule"
  type: string
  default: "*/5 * * * *"
  description: "Cron schedule for user simulation request to apps"
  required: true
  group: General
  show_if: "frontend.enabled=true"

- variable: aiCompare.service.type
  group: General
  label: "AI Compare Service Type"
  description: "Method to expose the AI Compare service."
  type: "enum"
  required: true
  default: "NodePort"
  options:
    - "ClusterIP"
    - "NodePort"
    - "LoadBalancer"

- variable: aiCompare.service.nodePort
  group: General
  label: "AI Compare NodePort (Gradio UI)"
  description: "NodePort for the Gradio UI (port 7860). Only used when Service Type is NodePort."
  type: "integer"
  default: 31705
  show_if: "aiCompare.service.type=NodePort"

- variable: aiCompare.service.httpApiNodePort
  group: General
  label: "AI Compare NodePort (HTTP API)"
  description: "NodePort for the HTTP API server (port 8080). Only used when Service Type is NodePort."
  type: "integer"
  default: 31706
  show_if: "aiCompare.service.type=NodePort"

- variable: neuvector.enabled
  group: General
  label: "Enable SUSE Security (NeuVector)"
  description: "Deploy NeuVector network security rules and DLP sensors for security demos. Uses declarative YAML configuration."
  type: "boolean"
  default: false

# Ollama Deployment Configuration
- variable: ollama.models[0]
  group: "Ollama Deployment"
  label: "Primary Ollama Model"
  description: "The primary Ollama model to pull (e.g., 'llama3.2:latest', 'tinyllama:latest')."
  type: "string"
  default: "llama3.2:latest"
  show_if: "ollama.enabled=true"

- variable: ollama.models[1]
  group: "Ollama Deployment"
  label: "Secondary Ollama Model (Costing Model)"
  description: "Additional model for embeddings (optional)."
  type: "string"
  default: "bge-large:latest"
  show_if: "ollama.enabled=true"

- variable: ollama.service.type
  group: "Ollama Deployment"
  label: "Ollama Service Type"
  description: "Method to expose the Ollama service. 'ClusterIP' is recommended."
  type: "enum"
  required: true
  default: "ClusterIP"
  show_if: "ollama.enabled=true"
  options:
    - "ClusterIP"
    - "NodePort"
    - "LoadBalancer"

- variable: ollama.resources.requests.cpu
  group: "Ollama Deployment"
  label: "Ollama CPU Request"
  description: "The amount of CPU to reserve for the main Ollama container (e.g., '500m', '1')."
  type: "string"
  default: "2"
  show_if: "ollama.enabled=true"

- variable: ollama.resources.requests.memory
  group: "Ollama Deployment"
  label: "Ollama Memory Request"
  description: "The amount of memory to reserve for the main Ollama container (e.g., '1Gi', '2048Mi')."
  type: "string"
  default: "2Gi"
  show_if: "ollama.enabled=true"

- variable: ollama.resources.limits.cpu
  group: "Ollama Deployment"
  label: "Ollama CPU Limit"
  description: "The maximum amount of CPU the main Ollama container can use."
  type: "string"
  default: "4"
  show_if: "ollama.enabled=true"

- variable: ollama.resources.limits.memory
  group: "Ollama Deployment"
  label: "Ollama Memory Limit"
  description: "The maximum amount of memory the main Ollama container can use."
  type: "string"
  default: "16Gi"
  show_if: "ollama.enabled=true"

- variable: ollama.persistence.enabled
  group: "Ollama Deployment"
  label: "Enable Ollama Model Persistence"
  description: "If true, a PersistentVolumeClaim will be created to store Ollama models so they are not re-downloaded on restart."
  type: "boolean"
  default: true
  show_if: "ollama.enabled=true"

- variable: ollama.persistence.size
  group: "Ollama Deployment"
  label: "Ollama Model Storage Size"
  description: "The size of the PersistentVolumeClaim for Ollama models (e.g., '10Gi', '50Gi')."
  type: "string"
  default: "10Gi"
  show_if: "ollama.enabled=true && ollama.persistence.enabled=true"

- variable: ollama.persistence.storageClassName
  group: "Ollama Deployment"
  label: "Ollama Model Storage Class Name"
  description: "The storage class name for the Ollama models PVC. Leave empty to use the default storage class."
  type: "string"
  default: ""
  show_if: "ollama.enabled=true && ollama.persistence.enabled=true"

- variable: ollama.modelCache.nfs.enabled
  group: "Ollama Deployment"
  label: "Enable NFS Model Cache"
  description: "Mount an NFS share to cache Ollama models across deployments and avoid re-downloading."
  type: "boolean"
  default: false
  show_if: "ollama.enabled=true"

- variable: ollama.modelCache.nfs.server
  group: "Ollama Deployment"
  label: "NFS Server"
  description: "IP address or hostname of the NFS server."
  type: "string"
  default: ""
  show_if: "ollama.enabled=true && ollama.modelCache.nfs.enabled=true"

- variable: ollama.modelCache.nfs.path
  group: "Ollama Deployment"
  label: "NFS Share Path"
  description: "Path on the NFS server to use for caching models (e.g., '/data/ai-models')."
  type: "string"
  default: "/data/ai-models"
  show_if: "ollama.enabled=true && ollama.modelCache.nfs.enabled=true"

# OpenTelemetry Observability Configuration
- variable: collectGpuStats
  label: "Collect GPU Statistics"
  type: string
  default: "true"
  description: "Set to 'true' to collect detailed GPU performance statistics"
  required: true
  group: "OpenTelemetry Observability"

- variable: aiCompare.observability.enabled
  group: "OpenTelemetry Observability"
  label: "Enable AI Compare Observability"
  description: "Enable comprehensive GenAI observability with token tracking and cost analysis"
  type: "boolean"
  default: true

- variable: aiCompare.observability.collectGpuStats
  group: "OpenTelemetry Observability"
  label: "Enhanced GPU Monitoring"
  description: "Enable detailed GPU utilization and performance monitoring"
  type: "boolean"
  default: true
  show_if: "aiCompare.observability.enabled=true"

- variable: ollama.observability.enabled
  group: "OpenTelemetry Observability"
  label: "Enable Ollama Observability"
  description: "Enable HTTP metrics, request tracing, and performance monitoring for Ollama server"
  type: "boolean"
  default: true

# Resource Configuration (GPU-aware)
- variable: ollama.gpu.enabled
  group: "Resource Configuration"
  label: "GPU-Aware Resource Sizing"
  description: "Toggle GPU mode affects Ollama resource allocation: GPU enabled uses 1CPU/4Gi, disabled uses 1.5CPU/6Gi (follows K8s best practices)"
  type: "boolean"
  default: true
  show_if: "ollama.enabled=true"

- variable: aiCompare.resources.requests.cpu
  group: "Resource Configuration"
  label: "AI Compare CPU Request (CPU-only deployments)"
  description: "CPU request for AI Compare app in CPU-only mode. GPU deployments use 400m automatically."
  type: "string"
  default: "500m"
  show_if: "ollama.enabled=true"

- variable: aiCompare.resources.requests.memory
  group: "Resource Configuration"
  label: "AI Compare Memory Request (CPU-only deployments)"
  description: "Memory request for AI Compare app in CPU-only mode. GPU deployments use 512Mi automatically."
  type: "string"
  default: "1Gi"
  show_if: "ollama.enabled=true"

- variable: aiCompare.resources.limits.cpu
  group: "Resource Configuration"
  label: "AI Compare CPU Limit (CPU-only deployments)"
  description: "CPU limit for AI Compare app in CPU-only mode. GPU deployments use 1000m automatically."
  type: "string"
  default: "2000m"
  show_if: "ollama.enabled=true"

- variable: aiCompare.resources.limits.memory
  group: "Resource Configuration"
  label: "AI Compare Memory Limit (CPU-only deployments)"
  description: "Memory limit for AI Compare app in CPU-only mode. GPU deployments use 2Gi automatically."
  type: "string"
  default: "4Gi"
  show_if: "ollama.enabled=true"

# Ollama GPU-Aware Resources
- variable: ollama.resources.requests.cpu
  group: "Resource Configuration"
  label: "Ollama CPU Request (GPU deployments)"
  description: "CPU request for Ollama in GPU-enabled mode (will be overridden to 1.5 if GPU disabled)."
  type: "string"
  default: "1"
  show_if: "ollama.enabled=true"

- variable: ollama.resources.limits.cpu
  group: "Resource Configuration"
  label: "Ollama CPU Limit (GPU deployments)"
  description: "CPU limit for Ollama in GPU-enabled mode (will be overridden to 3 if GPU disabled)."
  type: "string"
  default: "2"
  show_if: "ollama.enabled=true"

- variable: ollama.resources.requests.memory
  group: "Resource Configuration"
  label: "Ollama Memory Request (GPU deployments)"
  description: "Memory request for Ollama in GPU-enabled mode (will be overridden to 6Gi if GPU disabled)."
  type: "string"
  default: "4Gi"
  show_if: "ollama.enabled=true"

- variable: ollama.resources.limits.memory
  group: "Resource Configuration"
  label: "Ollama Memory Limit (GPU deployments)"
  description: "Memory limit for Ollama in GPU-enabled mode (will be overridden to 12Gi if GPU disabled)."
  type: "string"
  default: "8Gi"
  show_if: "ollama.enabled=true"

# CPU-only Resource Overrides (when GPU disabled)
- variable: ollama.resourcesCpuOnly.requests.cpu
  group: "Resource Configuration"
  label: "Ollama CPU Request (CPU-only mode)"
  description: "CPU request for Ollama when GPU is disabled. Used as override when ollama.gpu.enabled=false."
  type: "string"
  default: "1.5"
  show_if: "ollama.enabled=true && ollama.gpu.enabled=false"

- variable: ollama.resourcesCpuOnly.limits.cpu
  group: "Resource Configuration"
  label: "Ollama CPU Limit (CPU-only mode)"
  description: "CPU limit for Ollama when GPU is disabled. Used as override when ollama.gpu.enabled=false."
  type: "string"
  default: "3"
  show_if: "ollama.enabled=true && ollama.gpu.enabled=false"

- variable: ollama.resourcesCpuOnly.requests.memory
  group: "Resource Configuration"
  label: "Ollama Memory Request (CPU-only mode)"
  description: "Memory request for Ollama when GPU is disabled. Used as override when ollama.gpu.enabled=false."
  type: "string"
  default: "6Gi"
  show_if: "ollama.enabled=true && ollama.gpu.enabled=false"

- variable: ollama.resourcesCpuOnly.limits.memory
  group: "Resource Configuration"
  label: "Ollama Memory Limit (CPU-only mode)"
  description: "Memory limit for Ollama when GPU is disabled. Used as override when ollama.gpu.enabled=false."
  type: "string"
  default: "12Gi"
  show_if: "ollama.enabled=true && ollama.gpu.enabled=false"

# GPU-optimized Resources (AI Compare)
- variable: aiCompare.resourcesGpuOptimized.requests.cpu
  group: "Resource Configuration"
  label: "AI Compare CPU Request (GPU-optimized mode)"
  description: "CPU request for AI Compare app when GPU is enabled. Used as override when ollama.gpu.enabled=true."
  type: "string"
  default: "400m"
  show_if: "ollama.enabled=true && ollama.gpu.enabled=true"

- variable: aiCompare.resourcesGpuOptimized.limits.cpu
  group: "Resource Configuration"
  label: "AI Compare CPU Limit (GPU-optimized mode)"
  description: "CPU limit for AI Compare app when GPU is enabled. Used as override when ollama.gpu.enabled=true."
  type: "string"
  default: "1000m"
  show_if: "ollama.enabled=true && ollama.gpu.enabled=true"

- variable: aiCompare.resourcesGpuOptimized.requests.memory
  group: "Resource Configuration"
  label: "AI Compare Memory Request (GPU-optimized mode)"
  description: "Memory request for AI Compare app when GPU is enabled. Used as override when ollama.gpu.enabled=true."
  type: "string"
  default: "512Mi"
  show_if: "ollama.enabled=true && ollama.gpu.enabled=true"

- variable: aiCompare.resourcesGpuOptimized.limits.memory
  group: "Resource Configuration"
  label: "AI Compare Memory Limit (GPU-optimized mode)"
  description: "Memory limit for AI Compare app when GPU is enabled. Used as override when ollama.gpu.enabled=true."
  type: "string"
  default: "2Gi"
  show_if: "ollama.enabled=true && ollama.gpu.enabled=true"
