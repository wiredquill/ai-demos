description: SUSE AI Observability collector with zero-maintenance, label-driven auto-discovery and OpenTelemetry auto-instrumentation. Deploys an OpenTelemetryCollector CR (SUSE AI image with topology exporter) and Instrumentation CRs, managed by the OpenTelemetry Operator. New apps that carry the standard discovery labels/annotations are collected automatically — no collector re-deploy needed.
