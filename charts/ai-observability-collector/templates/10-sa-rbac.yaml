# ServiceAccount for the operator-managed collector.
# The OpenTelemetryCollector CR references this via spec.serviceAccount, so the
# collector pod gets the image pull secrets at creation time (no post-creation
# SA patch race, no pod bounce).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aiobs.collectorService" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aiobs.labels" . | nindent 4 }}
imagePullSecrets:
{{- range .Values.collector.imagePullSecrets }}
  - name: {{ . }}
{{- end }}
---
# Cluster RBAC for the collector's k8s_attributes processor (pods/namespaces/nodes
# metadata enrichment) and the prometheus service discovery.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "aiobs.collectorService" . }}-rbac
  labels:
    {{- include "aiobs.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: [pods, namespaces, nodes, endpoints, services]
  verbs: [get, list, watch]
- apiGroups: [apps, extensions]
  resources: [replicasets]
  verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "aiobs.collectorService" . }}-rbac
  labels:
    {{- include "aiobs.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "aiobs.collectorService" . }}-rbac
subjects:
- kind: ServiceAccount
  name: {{ include "aiobs.collectorService" . }}
  namespace: {{ .Release.Namespace }}
