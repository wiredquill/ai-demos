# RBAC for the secret-copy pre-install hook.
# Minimal scope: can read the specific API_KEY secret by name from the source
# namespace, and can create secrets only in the release namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aiobs.collectorService" . }}-secret-copy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aiobs.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-10"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "aiobs.collectorService" . }}-secret-reader
  labels:
    {{- include "aiobs.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-10"
rules:
- apiGroups: [""]
  resources: [secrets]
  resourceNames: ["{{ .Values.collector.apiKeySecret }}"]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "aiobs.collectorService" . }}-secret-reader
  labels:
    {{- include "aiobs.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-10"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "aiobs.collectorService" . }}-secret-reader
subjects:
- kind: ServiceAccount
  name: {{ include "aiobs.collectorService" . }}-secret-copy
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "aiobs.collectorService" . }}-secret-writer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aiobs.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-10"
rules:
- apiGroups: [""]
  resources: [secrets]
  verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "aiobs.collectorService" . }}-secret-writer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aiobs.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-10"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "aiobs.collectorService" . }}-secret-writer
subjects:
- kind: ServiceAccount
  name: {{ include "aiobs.collectorService" . }}-secret-copy
  namespace: {{ .Release.Namespace }}
