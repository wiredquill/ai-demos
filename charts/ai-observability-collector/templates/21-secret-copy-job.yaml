# Pre-install hook that copies the SUSE Observability API_KEY secret from the
# source namespace into the release namespace. The collector CR references the
# secret via secretKeyRef, and secrets are namespaced, so it must exist in the
# release namespace for the collector pod to start. Idempotent (skips if the
# secret already exists in the release namespace).
#
# Uses only curl + shell (curlimages/curl image, no python/jq dependency).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "aiobs.collectorService" . }}-copy-secret
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "aiobs.labels" . | nindent 4 }}
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-observability-collector
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: secret-copy
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "aiobs.collectorService" . }}-secret-copy
      containers:
      - name: copy-secret
        image: curlimages/curl:8.5.0
        command:
        - /bin/sh
        - -c
        - |
          set -e
          SRC_NS="{{ .Values.collector.sourceNamespace }}"
          SECRET="{{ .Values.collector.apiKeySecret }}"
          DST_NS="{{ .Release.Namespace }}"
          TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          API="https://kubernetes.default.svc"
          echo "==> Copying secret $SECRET from $SRC_NS to $DST_NS"
          if curl -s --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt -o /dev/null -w "%{http_code}" -H "Accept: application/json" -H "Authorization: Bearer $TOKEN" "$API/api/v1/namespaces/$DST_NS/secrets/$SECRET" | grep -q "^200$"; then
            echo "    Secret $SECRET already exists in $DST_NS - skipping"
            exit 0
          fi
          curl -fsS --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt -H "Accept: application/json" -H "Authorization: Bearer $TOKEN" "$API/api/v1/namespaces/$SRC_NS/secrets/$SECRET" -o /tmp/src.json
          DATA=$(tr -d '\n' < /tmp/src.json | grep -o '"data": *{[^}]*}' | head -1)
          if [ -z "$DATA" ]; then
            echo "ERROR: could not extract data from secret $SRC_NS/$SECRET" >&2
            exit 1
          fi
          printf '{"apiVersion":"v1","kind":"Secret","metadata":{"name":"%s"},"type":"Opaque",%s}\n' "$SECRET" "$DATA" > /tmp/clean.json
          curl -fsS --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt -X POST -H "Accept: application/json" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            --data @/tmp/clean.json "$API/api/v1/namespaces/$DST_NS/secrets" > /dev/null
          echo "    Secret copied successfully"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
