# OpenTelemetryCollector CR deployed by the OpenTelemetry Operator.
# Uses the SUSE AI collector image (ships the proprietary `topology` exporter
# that populates the SUSE AI topology view; appco collector images do NOT have
# it). Prometheus receivers use dynamic Kubernetes SD driven by standard
# labels/annotations, so new apps are discovered automatically without editing
# this config.
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: {{ .Values.collector.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aiobs.labels" . | nindent 4 }}
spec:
  image: {{ printf "%s:%s" .Values.collector.image .Values.collector.tag }}
  imagePullPolicy: {{ .Values.collector.pullPolicy }}
  serviceAccount: {{ include "aiobs.collectorService" . }}
  replicas: {{ .Values.collector.replicas | default 1 }}
  resources:
    {{- toYaml .Values.collector.resources | nindent 4 }}
  env:
    - name: MY_POD_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
    - name: K8S_CLUSTER_NAME
      value: {{ .Values.collector.clusterName | quote }}
    - name: SUSE_AI_NAMESPACE
      value: {{ .Release.Namespace | quote }}
    - name: API_KEY
      valueFrom:
        secretKeyRef:
          name: {{ .Values.collector.apiKeySecret }}
          key: API_KEY
  config:
    connectors:
      routing/traces:
        error_mode: ignore
        table:
          - action: copy
            condition: "true"
            pipelines:
              - traces/sampling
              - traces/model-relations
              - traces/provider-relations
              - traces/topology
    exporters:
      debug:
        verbosity: basic
      otlp_grpc:
        endpoint: {{ .Values.collector.otlpEndpoint }}
        headers:
          Authorization: SUSEObservability ${env:API_KEY}
        tls:
          insecure: {{ .Values.collector.otlpInsecure }}
      topology:
        api_key: ${env:API_KEY}
        endpoint: {{ .Values.collector.backendEndpoint }}
        namespace: ${env:SUSE_AI_NAMESPACE}
        tls:
          insecure_skip_verify: true
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
        path: /
    processors:
      batch: {}
      filter/exclude-already-tagged:
        error_mode: ignore
        metrics:
          resource:
            - attributes["suse.ai.component.name"] != nil
      filter/genai-metrics-only:
        error_mode: ignore
        metrics:
          metric:
            - not(IsMatch(name, "gen_ai\\..*"))
      filter/genai-spans:
        error_mode: ignore
        traces:
          span:
            - attributes["gen_ai.request.model"] == nil
      groupbyattrs/infer-models:
        keys:
          - gen_ai.request.model
          - gen_ai.provider.name
      groupbyattrs/infer-providers:
        keys:
          - gen_ai.provider.name
      groupbyattrs/model-relations:
        keys:
          - gen_ai.provider.name
      k8s_attributes:
        extract:
          labels:
            - from: pod
              key_regex: (.*)
              tag_name: $$1
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.node.name
            - k8s.pod.start_time
            - k8s.deployment.name
            - k8s.replicaset.name
            - k8s.replicaset.uid
            - k8s.daemonset.name
            - k8s.daemonset.uid
            - k8s.job.name
            - k8s.job.uid
            - k8s.container.name
            - k8s.cronjob.name
            - k8s.statefulset.name
            - k8s.statefulset.uid
            - container.image.tag
            - container.image.name
            - k8s.cluster.uid
            - service.namespace
            - service.name
            - service.version
            - service.instance.id
          otel_annotations: true
        passthrough: false
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      resource:
        attributes:
        - key: k8s.cluster.name
          value: ${env:K8S_CLUSTER_NAME}
          action: insert
        - key: service.instance.id
          from_attribute: k8s.pod.uid
          action: insert
      tail_sampling:
        decision_wait: 10s
        policies:
        - name: rate-limited-composite
          type: composite
          composite:
            max_total_spans_per_second: {{ .Values.traces.sampling.maxSpansPerSecond }}
            policy_order: [errors, slow-traces, rest]
            composite_sub_policy:
            - name: errors
              type: status_code
              status_code:
                status_codes: [ ERROR ]
            - name: slow-traces
              type: latency
              latency:
                threshold_ms: 1000
            - name: rest
              type: always_sample
            rate_allocation:
            - policy: errors
              percent: 33
            - policy: slow-traces
              percent: 33
            - policy: rest
              percent: 34
      transform/infer-applications:
        error_mode: ignore
        metric_statements:
          - context: resource
            statements:
              - set(attributes["suse.ai.managed"], "true")
              - set(attributes["suse.ai.component.type"], "application")
              - set(attributes["suse.ai.component.name"], attributes["service.name"])
              - set(attributes["k8s.namespace.name"], "${env:SUSE_AI_NAMESPACE}")
      transform/infer-models:
        error_mode: ignore
        metric_statements:
          - context: resource
            statements:
              - set(attributes["service.name"], attributes["gen_ai.request.model"]) where attributes["gen_ai.request.model"] != nil
              - set(attributes["service.instance.id"], attributes["gen_ai.request.model"]) where attributes["gen_ai.request.model"] != nil
              - set(attributes["suse.ai.managed"], "true") where attributes["gen_ai.request.model"] != nil
              - set(attributes["suse.ai.component.name"], attributes["gen_ai.request.model"]) where attributes["gen_ai.request.model"] != nil
              - set(attributes["suse.ai.component.type"], "llm-model") where attributes["gen_ai.request.model"] != nil
              - set(attributes["k8s.namespace.name"], "${env:SUSE_AI_NAMESPACE}") where attributes["gen_ai.request.model"] != nil
      transform/infer-providers:
        error_mode: ignore
        metric_statements:
          - context: resource
            statements:
              - set(attributes["service.name"], attributes["gen_ai.provider.name"]) where attributes["gen_ai.provider.name"] != nil
              - set(attributes["service.instance.id"], attributes["gen_ai.provider.name"]) where attributes["gen_ai.provider.name"] != nil
              - set(attributes["suse.ai.managed"], "true") where attributes["gen_ai.provider.name"] != nil
              - set(attributes["suse.ai.component.name"], attributes["gen_ai.provider.name"]) where attributes["gen_ai.provider.name"] != nil
              - set(attributes["suse.ai.component.type"], "inference-engine") where attributes["gen_ai.provider.name"] != nil
              - set(attributes["k8s.namespace.name"], "${env:SUSE_AI_NAMESPACE}") where attributes["gen_ai.provider.name"] != nil
      transform/model-relations:
        error_mode: ignore
        trace_statements:
          - context: resource
            statements:
              - set(attributes["service.name"], attributes["gen_ai.provider.name"]) where attributes["gen_ai.provider.name"] != nil
              - set(attributes["service.instance.id"], attributes["gen_ai.provider.name"]) where attributes["gen_ai.provider.name"] != nil
          - context: span
            statements:
              - set(attributes["peer.service"], attributes["gen_ai.request.model"]) where attributes["gen_ai.request.model"] != nil
      transform/provider-relations:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              - set(attributes["peer.service"], resource.attributes["gen_ai.provider.name"]) where resource.attributes["gen_ai.provider.name"] != nil
      transform/topology-provider:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              - set(attributes["gen_ai.provider.name"], resource.attributes["gen_ai.provider.name"]) where resource.attributes["gen_ai.provider.name"] != nil
              - set(attributes["gen_ai.request.model"], resource.attributes["gen_ai.request.model"]) where resource.attributes["gen_ai.request.model"] != nil
    receivers:
      jaeger:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:14250
          thrift_compact:
            endpoint: ${env:MY_POD_IP}:6831
          thrift_http:
            endpoint: ${env:MY_POD_IP}:14268
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
          http:
            endpoint: ${env:MY_POD_IP}:4318
      prometheus:
        config:
          scrape_configs:
            # --- Dynamic auto-discovery: any pod with the standard markers ---
            - job_name: ai-auto-discovery
              scrape_interval: {{ .Values.discovery.scrapeInterval }}
              kubernetes_sd_configs:
                - role: pod
                  {{- if .Values.discovery.namespaces }}
                  namespaces:
                    names:
                      {{- range .Values.discovery.namespaces }}
                      - {{ . }}
                      {{- end }}
                  {{- end }}
              relabel_configs:
                # keep pods that opt in via label observability/enabled=true
                # OR the standard prometheus.io/scrape=true annotation
                - action: keep
                  source_labels: [__meta_kubernetes_pod_label_observability_enabled, __meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  regex: "true;.*|.*;true"
                # respect prometheus.io/path if set
                - action: replace
                  source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                  target_label: __metrics_path__
                  regex: (.+)
                # respect prometheus.io/port, else use the container port
                - action: replace
                  source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
                  regex: '([^;]+);(\d+)'
                  replacement: '$1:$2'
                  target_label: __address__
                - action: replace
                  source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scheme]
                  regex: (https?)
                  replacement: '$1'
                  target_label: __scheme__
                # carry pod labels through to topology as attributes
                - action: labelmap
                  regex: __meta_kubernetes_pod_label_(.+)
            {{- if .Values.discovery.gpu.enabled }}
            # --- GPU metrics (DCGM exporter, dynamic discovery by pod label) ---
            - job_name: gpu-metrics
              scrape_interval: {{ .Values.discovery.scrapeInterval }}
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names: [{{ .Values.discovery.gpu.namespace }}]
              relabel_configs:
                - action: keep
                  source_labels: [__meta_kubernetes_pod_label_app]
                  regex: .*dcgm-exporter.*
                - action: replace
                  source_labels: [__meta_kubernetes_pod_ip]
                  target_label: __address__
                  replacement: $1:9400
                - action: replace
                  source_labels: [__meta_kubernetes_pod_node_name]
                  target_label: host
                - action: replace
                  source_labels: [__meta_kubernetes_pod_node_name]
                  target_label: hostname
                - action: replace
                  source_labels: [__meta_kubernetes_pod_node_name]
                  target_label: kubernetes_node
                - action: replace
                  source_labels: [__meta_kubernetes_pod_node_name]
                  target_label: node
            {{- end }}
            {{- if .Values.extraJobs }}
            {{- toYaml .Values.extraJobs | nindent 12 }}
            {{- end }}
      zipkin:
        endpoint: ${env:MY_POD_IP}:9411
    service:
      extensions:
        - health_check
      pipelines:
        logs:
          exporters: [otlp_grpc, debug]
          processors: [k8s_attributes, resource, memory_limiter, batch]
          receivers: [otlp]
        metrics:
          exporters: [otlp_grpc, debug]
          processors: [k8s_attributes, resource, memory_limiter, batch]
          receivers: [prometheus, otlp]
        metrics/infer-applications:
          exporters: [otlp_grpc]
          processors: [filter/genai-metrics-only, filter/exclude-already-tagged, transform/infer-applications, k8s_attributes, resource, batch]
          receivers: [otlp]
        metrics/infer-models:
          exporters: [otlp_grpc]
          processors: [filter/genai-metrics-only, groupbyattrs/infer-models, transform/infer-models, k8s_attributes, resource, batch]
          receivers: [otlp]
        metrics/infer-providers:
          exporters: [otlp_grpc]
          processors: [filter/genai-metrics-only, groupbyattrs/infer-providers, transform/infer-providers, k8s_attributes, resource, batch]
          receivers: [otlp]
        traces:
          exporters: [routing/traces]
          processors: [k8s_attributes, resource, memory_limiter, batch]
          receivers: [otlp, jaeger, zipkin]
        traces/model-relations:
          exporters: [otlp_grpc, debug]
          processors: [filter/genai-spans, groupbyattrs/model-relations, transform/model-relations, batch]
          receivers: [routing/traces]
        traces/provider-relations:
          exporters: [otlp_grpc, debug]
          processors: [filter/genai-spans, transform/provider-relations, batch]
          receivers: [routing/traces]
        traces/sampling:
          exporters: [otlp_grpc, debug]
          processors: [tail_sampling, batch]
          receivers: [routing/traces]
        traces/topology:
          exporters: [topology]
          processors: [transform/topology-provider, batch]
          receivers: [routing/traces]
    telemetry:
      metrics:
        readers:
          - pull:
              exporter:
                prometheus:
                  host: ${env:MY_POD_IP}
                  port: 8888
      resource:
        host.name: ${env:OTEL_K8S_NODE_NAME}
        k8s.namespace.name: ${env:OTEL_K8S_NAMESPACE}
        k8s.node.ip: ${env:OTEL_K8S_NODE_IP}
        k8s.node.name: ${env:OTEL_K8S_NODE_NAME}
        k8s.pod.ip: ${env:OTEL_K8S_POD_IP}
        k8s.pod.name: ${env:OTEL_K8S_POD_NAME}
