# Cluster-wide SUSE AI OpenTelemetry collector, managed by the OpenTelemetry
# Operator. One per cluster; every SUSE AI app in any namespace sends OTLP here.
#
# Uses the SUSE AI collector image, which ships the `topology` exporter that
# builds the SUSE AI view (the Application Collection collector images do not
# have it). Built for SUSE Observability 2.10.x with the SUSE AI Observability
# Extension 2.1.x:
#   - GenAI topology: app -> inference engine -> model relations, inferred from
#     the gen_ai.* telemetry the apps emit (same pipeline as the per-release
#     collector in the hr-assistant charts)
#   - backends discovered cluster-wide by label, each attributed to its own
#     namespace: vLLM engines (job vllm), Qdrant (job qdrant), OpenSearch
#     (elasticsearch receiver created per pod by receiver_creator)
#   - the metric names the SUSE AI StackPack monitors query: vllm_* (renamed
#     from vllm:*, with vLLM 0.19 aliases), Qdrant's native metrics,
#     elasticsearch_cluster_health for cluster "opensearch-cluster"
#   - span metrics for service health; OTLP logs are dropped (SUSE
#     Observability 2.10 has no OTLP logs service; the agent collects logs)
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: {{ .Values.collector.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aiobs.labels" . | nindent 4 }}
spec:
  mode: deployment
  image: {{ printf "%s:%s" .Values.collector.image .Values.collector.tag }}
  imagePullPolicy: {{ .Values.collector.pullPolicy }}
  serviceAccount: {{ include "aiobs.serviceAccount" . }}
  replicas: {{ .Values.collector.replicas | default 1 }}
  resources:
    {{- toYaml .Values.collector.resources | nindent 4 }}
  env:
    - name: MY_POD_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
    - name: K8S_CLUSTER_NAME
      value: {{ required "collector.clusterName is required (the cluster name shown in SUSE Observability)" .Values.collector.clusterName | quote }}
    # Fallback namespace only for telemetry that carries neither
    # service.namespace nor a Kubernetes namespace of its own.
    - name: SUSE_AI_NAMESPACE
      value: {{ .Release.Namespace | quote }}
    - name: API_KEY
      valueFrom:
        secretKeyRef:
          name: {{ .Values.collector.apiKeySecret }}
          key: API_KEY
  config:
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
        path: /
      {{- if .Values.discovery.opensearch.enabled }}
      k8s_observer:
        auth_type: serviceAccount
        observe_pods: true
      {{- end }}

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
          http:
            endpoint: ${env:MY_POD_IP}:4318
      prometheus:
        config:
          scrape_configs:
            {{- if .Values.discovery.vllm.enabled }}
            # vLLM serving engines only (vLLM production-stack labels), HTTP
            # port 80. The router also carries part-of=vllm but its per-backend
            # vllm: stats share names with the engine's and would double-count.
            - job_name: vllm
              scrape_interval: {{ .Values.discovery.scrapeInterval }}
              metrics_path: /metrics
              kubernetes_sd_configs:
                - role: service
              relabel_configs:
                - action: keep
                  source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_part_of]
                  regex: vllm
                - action: keep
                  source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_component]
                  regex: serving-engine
                - action: keep
                  source_labels: [__meta_kubernetes_service_port_number]
                  regex: "80"
                - action: replace
                  source_labels: [__meta_kubernetes_namespace]
                  target_label: k8s_namespace_name
            {{- end }}
            {{- if .Values.discovery.qdrant.enabled }}
            # Qdrant: bundled (app.component=qdrant) or the SUSE AI Qdrant chart
            # (app=qdrant); its headless discovery Service is skipped.
            - job_name: qdrant
              scrape_interval: {{ .Values.discovery.scrapeInterval }}
              metrics_path: /metrics
              kubernetes_sd_configs:
                - role: service
              relabel_configs:
                - action: keep
                  source_labels: [__meta_kubernetes_service_label_app_component, __meta_kubernetes_service_label_app]
                  regex: "qdrant;.*|.*;qdrant"
                - action: drop
                  source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_component]
                  regex: cluster-discovery
                - action: keep
                  source_labels: [__meta_kubernetes_service_port_number]
                  regex: "6333"
                - action: replace
                  source_labels: [__meta_kubernetes_namespace]
                  target_label: k8s_namespace_name
            {{- end }}
            {{- if .Values.discovery.gpu.enabled }}
            # NVIDIA DCGM exporter (GPU operator)
            - job_name: gpu-metrics
              scrape_interval: 15s
              scheme: http
              kubernetes_sd_configs:
                - role: endpoints
              relabel_configs:
                - action: keep
                  source_labels: [__meta_kubernetes_service_label_app]
                  regex: nvidia-dcgm-exporter
                - source_labels: [__meta_kubernetes_endpoint_node_name]
                  target_label: kubernetes_node
                  replacement: $1
                - source_labels: [__meta_kubernetes_endpoint_node_name]
                  target_label: k8s_node_name
                  replacement: $1
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: kubernetes_namespace
                  replacement: $1
                - source_labels: [__meta_kubernetes_service_name]
                  target_label: service
                  replacement: $1
            {{- end }}
            {{- if .Values.discovery.annotated.enabled }}
            # Opt-in for anything else: pods labelled observability/enabled=true
            # or annotated prometheus.io/scrape=true. Backends with their own
            # job above are excluded so they are not scraped twice.
            - job_name: ai-auto-discovery
              scrape_interval: {{ .Values.discovery.scrapeInterval }}
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - action: keep
                  source_labels: [__meta_kubernetes_pod_label_observability_enabled, __meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  regex: "true;.*|.*;true"
                - action: drop
                  source_labels: [__meta_kubernetes_pod_label_app_component, __meta_kubernetes_pod_label_app, __meta_kubernetes_pod_label_app_kubernetes_io_part_of]
                  regex: "qdrant;.*;.*|.*;qdrant;.*|opensearch;.*;.*|.*;.*;vllm"
                # OpenTelemetry collector pods (annotated for scraping by the
                # operator) are not application telemetry.
                - action: drop
                  source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
                  regex: opentelemetry-collector
                - action: replace
                  source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                  target_label: __metrics_path__
                  regex: (.+)
                - action: replace
                  source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
                  regex: '([^;]+);(\d+)'
                  replacement: '$1:$2'
                  target_label: __address__
                - action: replace
                  source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scheme]
                  regex: (https?)
                  replacement: '$1'
                  target_label: __scheme__
            {{- end }}
            {{- with .Values.extraJobs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- if .Values.discovery.opensearch.enabled }}
      # OpenSearch has no /metrics: an elasticsearch receiver is created for
      # every pod labelled app.component=opensearch on port 9200, in any
      # namespace, tagged with that pod's namespace.
      receiver_creator/opensearch:
        watch_observers: [k8s_observer]
        receivers:
          elasticsearch:
            rule: type == "port" && port == 9200 && pod.labels["app.component"] == "opensearch"
            config:
              endpoint: 'http://`endpoint`'
              collection_interval: 10s
              tls:
                insecure_skip_verify: true
            resource_attributes:
              k8s.namespace.name: '`pod.namespace`'
      {{- end }}

    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch: {}
      resource:
        attributes:
          - key: k8s.cluster.name
            value: ${env:K8S_CLUSTER_NAME}
            action: upsert
          - key: service.instance.id
            from_attribute: k8s.pod.uid
            action: insert
      k8s_attributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.node.name
            - k8s.deployment.name
            - k8s.replicaset.name
            - k8s.statefulset.name
            - k8s.container.name
            - k8s.cluster.uid
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection

      # vLLM metric names. Done here rather than in metric_relabel_configs,
      # which would strip the metric type (counters/histograms arrive untyped).
      transform/vllm-names:
        error_mode: ignore
        metric_statements:
          - context: metric
            statements:
              # SUSE Observability drops colon metric names
              - replace_pattern(name, "^vllm:", "vllm_")
              # vLLM 0.19 renamed two metrics the SUSE AI vLLM dashboard queries
              - set(name, "vllm_gpu_cache_usage_perc") where name == "vllm_kv_cache_usage_perc"
              - set(name, "vllm_time_per_output_token_seconds") where name == "vllm_request_time_per_output_token_seconds"
      # --- Scraped backends: SUSE AI identity + their own namespace ----------
      transform/scraped-namespace:
        error_mode: ignore
        metric_statements:
          - context: datapoint
            statements:
              - set(resource.attributes["k8s.namespace.name"], attributes["k8s_namespace_name"]) where attributes["k8s_namespace_name"] != nil
              - delete_key(attributes, "k8s_namespace_name")
      transform/backends:
        error_mode: ignore
        metric_statements:
          - context: resource
            statements:
              - set(attributes["suse.ai.managed"], "true") where attributes["service.name"] == "vllm" or attributes["service.name"] == "qdrant"
              - set(attributes["suse.ai.component.name"], attributes["service.name"]) where attributes["service.name"] == "vllm" or attributes["service.name"] == "qdrant"
              - set(attributes["suse.ai.component.type"], "inference-engine") where attributes["service.name"] == "vllm"
              - set(attributes["suse.ai.component.type"], "vectordb") where attributes["service.name"] == "qdrant"
              - set(attributes["service.namespace"], attributes["k8s.namespace.name"]) where (attributes["service.name"] == "vllm" or attributes["service.name"] == "qdrant") and attributes["k8s.namespace.name"] != nil
      transform/opensearch:
        error_mode: ignore
        metric_statements:
          - context: resource
            statements:
              - set(attributes["service.name"], "opensearch")
              - set(attributes["suse.ai.managed"], "true")
              - set(attributes["suse.ai.component.name"], "opensearch")
              - set(attributes["suse.ai.component.type"], "search-engine")
              - set(attributes["service.namespace"], attributes["k8s.namespace.name"]) where attributes["k8s.namespace.name"] != nil
              - set(attributes["k8s.namespace.name"], "${env:SUSE_AI_NAMESPACE}") where attributes["k8s.namespace.name"] == nil
              - set(attributes["service.instance.id"], Concat(["opensearch", attributes["k8s.namespace.name"]], "-"))

      # --- SUSE AI topology inference (GenAI telemetry from the apps) --------
      filter/genai-metrics-only:
        error_mode: ignore
        metrics:
          metric:
            - not(IsMatch(name, "gen_ai\\..*"))
      filter/genai-spans:
        error_mode: ignore
        traces:
          span:
            - attributes["gen_ai.request.model"] == nil
      filter/exclude-already-tagged:
        error_mode: ignore
        metrics:
          resource:
            - attributes["suse.ai.component.name"] != nil
      groupbyattrs/infer-models:
        keys:
          - gen_ai.request.model
          - gen_ai.provider.name
      groupbyattrs/infer-providers:
        keys:
          - gen_ai.provider.name
      groupbyattrs/model-relations:
        keys:
          - gen_ai.provider.name
      # Namespace precedence for every inferred component: the app's own
      # service.namespace, then its pod namespace (k8s_attributes runs first),
      # then the collector's namespace.
      transform/infer-applications:
        error_mode: ignore
        metric_statements:
          - context: resource
            statements:
              - set(attributes["suse.ai.managed"], "true")
              - set(attributes["suse.ai.component.type"], "application")
              - set(attributes["suse.ai.component.name"], attributes["service.name"])
              - set(attributes["k8s.namespace.name"], attributes["service.namespace"]) where attributes["service.namespace"] != nil
              - set(attributes["k8s.namespace.name"], "${env:SUSE_AI_NAMESPACE}") where attributes["k8s.namespace.name"] == nil
      transform/infer-models:
        error_mode: ignore
        metric_statements:
          - context: resource
            statements:
              - set(attributes["service.name"], attributes["gen_ai.request.model"]) where attributes["gen_ai.request.model"] != nil
              - set(attributes["service.instance.id"], attributes["gen_ai.request.model"]) where attributes["gen_ai.request.model"] != nil
              - set(attributes["suse.ai.managed"], "true") where attributes["gen_ai.request.model"] != nil
              - set(attributes["suse.ai.component.name"], attributes["gen_ai.request.model"]) where attributes["gen_ai.request.model"] != nil
              - set(attributes["suse.ai.component.type"], "llm-model") where attributes["gen_ai.request.model"] != nil
              - set(attributes["k8s.namespace.name"], attributes["service.namespace"]) where attributes["gen_ai.request.model"] != nil and attributes["service.namespace"] != nil
              - set(attributes["k8s.namespace.name"], "${env:SUSE_AI_NAMESPACE}") where attributes["gen_ai.request.model"] != nil and attributes["k8s.namespace.name"] == nil
      transform/infer-providers:
        error_mode: ignore
        metric_statements:
          - context: resource
            statements:
              - set(attributes["service.name"], attributes["gen_ai.provider.name"]) where attributes["gen_ai.provider.name"] != nil
              - set(attributes["service.instance.id"], attributes["gen_ai.provider.name"]) where attributes["gen_ai.provider.name"] != nil
              - set(attributes["suse.ai.managed"], "true") where attributes["gen_ai.provider.name"] != nil
              - set(attributes["suse.ai.component.name"], attributes["gen_ai.provider.name"]) where attributes["gen_ai.provider.name"] != nil
              - set(attributes["suse.ai.component.type"], "inference-engine") where attributes["gen_ai.provider.name"] != nil
              - set(attributes["k8s.namespace.name"], attributes["service.namespace"]) where attributes["gen_ai.provider.name"] != nil and attributes["service.namespace"] != nil
              - set(attributes["k8s.namespace.name"], "${env:SUSE_AI_NAMESPACE}") where attributes["gen_ai.provider.name"] != nil and attributes["k8s.namespace.name"] == nil
      transform/model-relations:
        error_mode: ignore
        trace_statements:
          - context: resource
            statements:
              - set(attributes["service.name"], attributes["gen_ai.provider.name"]) where attributes["gen_ai.provider.name"] != nil
              - set(attributes["service.instance.id"], attributes["gen_ai.provider.name"]) where attributes["gen_ai.provider.name"] != nil
          - context: span
            statements:
              - set(attributes["peer.service"], attributes["gen_ai.request.model"]) where attributes["gen_ai.request.model"] != nil
      transform/provider-relations:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              - set(attributes["peer.service"], resource.attributes["gen_ai.provider.name"]) where resource.attributes["gen_ai.provider.name"] != nil
      transform/db-topology-relations:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              - set(attributes["peer.service"], "qdrant") where attributes["db.system.name"] == "qdrant" or attributes["db.system"] == "qdrant"
              - set(attributes["peer.service"], "opensearch") where IsMatch(attributes["server.address"], ".*opensearch.*") or IsMatch(attributes["net.peer.name"], ".*opensearch.*") or IsMatch(attributes["url.full"], ".*opensearch.*") or IsMatch(attributes["http.url"], ".*opensearch.*")
      transform/topology-provider:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              - set(attributes["gen_ai.provider.name"], resource.attributes["gen_ai.provider.name"]) where resource.attributes["gen_ai.provider.name"] != nil
              - set(attributes["gen_ai.request.model"], resource.attributes["gen_ai.request.model"]) where resource.attributes["gen_ai.request.model"] != nil
      {{- if .Values.traces.sampling.enabled }}
      tail_sampling:
        decision_wait: 10s
        policies:
          - name: rate-limited-composite
            type: composite
            composite:
              max_total_spans_per_second: {{ .Values.traces.sampling.maxSpansPerSecond }}
              policy_order: [errors, slow-traces, rest]
              composite_sub_policy:
                - name: errors
                  type: status_code
                  status_code:
                    status_codes: [ERROR]
                - name: slow-traces
                  type: latency
                  latency:
                    threshold_ms: 1000
                - name: rest
                  type: always_sample
              rate_allocation:
                - policy: errors
                  percent: 33
                - policy: slow-traces
                  percent: 33
                - policy: rest
                  percent: 34
      {{- end }}

    connectors:
      span_metrics:
        metrics_expiration: 5m
        namespace: otel_span
      routing/traces:
        error_mode: ignore
        table:
          - condition: "true"
            action: copy
            pipelines:
              - traces/sampling
              - traces/spanmetrics
              - traces/model-relations
              - traces/provider-relations
              - traces/topology

    exporters:
      otlp_grpc:
        endpoint: {{ required "collector.otlpEndpoint is required" .Values.collector.otlpEndpoint | quote }}
        headers:
          Authorization: "SUSEObservability ${env:API_KEY}"
        tls:
          insecure: {{ .Values.collector.otlpInsecure }}
      topology:
        api_key: ${env:API_KEY}
        endpoint: {{ required "collector.backendEndpoint is required" .Values.collector.backendEndpoint | quote }}
        # Shared collector: each component's namespace comes from its own
        # telemetry. A fixed exporter namespace would label every SUSE AI
        # component with the collector's namespace (SUSE reference config).
        namespace: ""
        cluster_name: ${env:K8S_CLUSTER_NAME}
        tls:
          insecure_skip_verify: {{ .Values.collector.skipTlsVerify }}
      nop: {}
      {{- if .Values.collector.debug }}
      debug:
        verbosity: basic
      {{- end }}

    service:
      extensions: [health_check{{ if .Values.discovery.opensearch.enabled }}, k8s_observer{{ end }}]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8s_attributes, resource, batch]
          exporters: [routing/traces]
        traces/sampling:
          receivers: [routing/traces]
          processors: [{{ if .Values.traces.sampling.enabled }}tail_sampling, {{ end }}batch]
          exporters: [otlp_grpc{{ if .Values.collector.debug }}, debug{{ end }}]
        traces/spanmetrics:
          receivers: [routing/traces]
          processors: []
          exporters: [span_metrics]
        traces/model-relations:
          receivers: [routing/traces]
          processors: [filter/genai-spans, groupbyattrs/model-relations, transform/model-relations, batch]
          exporters: [otlp_grpc]
        traces/provider-relations:
          receivers: [routing/traces]
          processors: [filter/genai-spans, transform/provider-relations, batch]
          exporters: [otlp_grpc]
        traces/topology:
          receivers: [routing/traces]
          processors: [transform/topology-provider, transform/db-topology-relations, batch]
          exporters: [topology]
        metrics:
          receivers: [otlp, prometheus, span_metrics]
          processors: [memory_limiter, k8s_attributes, transform/vllm-names, transform/scraped-namespace, transform/backends, resource, batch]
          exporters: [otlp_grpc{{ if .Values.collector.debug }}, debug{{ end }}]
        {{- if .Values.discovery.opensearch.enabled }}
        metrics/opensearch:
          receivers: [receiver_creator/opensearch]
          processors: [memory_limiter, transform/opensearch, resource, batch]
          exporters: [otlp_grpc]
        {{- end }}
        metrics/infer-applications:
          receivers: [otlp]
          processors: [memory_limiter, k8s_attributes, filter/genai-metrics-only, filter/exclude-already-tagged, transform/infer-applications, resource, batch]
          exporters: [otlp_grpc]
        metrics/infer-models:
          receivers: [otlp]
          processors: [memory_limiter, k8s_attributes, filter/genai-metrics-only, groupbyattrs/infer-models, transform/infer-models, resource, batch]
          exporters: [otlp_grpc]
        metrics/infer-providers:
          receivers: [otlp]
          processors: [memory_limiter, k8s_attributes, filter/genai-metrics-only, groupbyattrs/infer-providers, transform/infer-providers, resource, batch]
          exporters: [otlp_grpc]
        logs:
          receivers: [otlp]
          processors: [memory_limiter]
          exporters: [nop]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
