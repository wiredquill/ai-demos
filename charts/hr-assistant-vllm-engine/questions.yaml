questions:
- variable: hr.vllm.servingEngineSpec.modelSpec.main.modelURL
  label: Model (by GPU VRAM class)
  group: Model
  type: enum
  required: true
  default: Qwen/Qwen2.5-7B-Instruct
  options:
  - Qwen/Qwen2.5-7B-Instruct
  - Qwen/Qwen3.6-35B-A3B
  - meta-llama/Llama-3.3-70B-Instruct
  - openai/gpt-oss-120b
  description: Hugging Face model ID. 16GB VRAM → Qwen2.5-7B (fp16); 24GB → Qwen3.6-35B-A3B (AWQ/GPTQ); 64GB → Llama-3.3-70B (AWQ); 100GB → gpt-oss-120b.<br>Set the same model in the app components.
- variable: hr.vllm.servingEngineSpec.modelSpec.main.hf_token
  label: Hugging Face Token
  group: Model
  type: password
  required: false
  default: ''
  description: Needed for gated models (e.g. meta-llama/*); recommended for all to avoid anonymous rate limits. Stored in a Secret and injected as HF_TOKEN.
- variable: hr.vllm.servingEngineSpec.modelSpec.main.requestGPU
  label: GPU Request
  group: Resources
  type: int
  default: 1
  description: GPUs per engine replica.
- variable: hr.vllm.servingEngineSpec.modelSpec.main.requestCPU
  label: CPU Request (cores)
  group: Resources
  type: int
  default: 2
- variable: hr.vllm.servingEngineSpec.modelSpec.main.requestMemory
  label: Memory Request
  group: Resources
  type: string
  default: 4Gi
  description: vLLM streams weights through CPU RAM while loading; a Qwen2.5-7B pod peaks ~3.3Gi.
- variable: hr.vllm.servingEngineSpec.modelSpec.main.limitMemory
  label: Memory Limit
  group: Resources
  type: string
  default: 16Gi
  description: Must exceed the model size during load, or the pod is OOM-killed.
- variable: hr.vllm.servingEngineSpec.modelSpec.main.pvcStorage
  label: Model Cache PVC Size
  group: Storage
  type: string
  default: 100Gi
- variable: hr.vllm.servingEngineSpec.modelSpec.main.storageClass
  label: Storage Class
  group: Storage
  type: string
  default: Default
  description: '''Default'' uses the cluster''s default StorageClass.'
- variable: hr.vllm.sharedPvcStorage.enabled
  label: Shared NFS Model Cache
  group: Storage
  type: boolean
  default: false
  description: Cache weights once on NFS and reuse them across installs. Needs TCP 2049 from the nodes to the NFS server.
- variable: hr.vllm.sharedPvcStorage.nfs.server
  label: NFS Server
  group: Storage
  type: string
  default: ''
  show_if: hr.vllm.sharedPvcStorage.enabled=true
  description: e.g. 10.0.9.10
- variable: hr.vllm.sharedPvcStorage.nfs.path
  label: NFS Path
  group: Storage
  type: string
  default: /data/ai-models
  show_if: hr.vllm.sharedPvcStorage.enabled=true
