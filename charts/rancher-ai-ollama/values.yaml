# Default values for rancher-ai-ollama
# A minimal Ollama serving stack for SUSE Rancher AI (Liz) with a LiteLLM
# gateway in front that exports gen_ai.* token/cost metrics to SUSE Observability.

# -- Global image pull policy
imagePullPolicy: IfNotPresent
# -- Correctly formatted list for imagePullSecrets
imagePullSecrets:
  - name: application-collection
# -- Extra image pull secret for the SUSE Registry (registry.suse.com) when using
# the SUSE-published LiteLLM image. Create a secret named `suse-ai-registry` and
# add it here, e.g.:
# imagePullSecrets:
#   - name: application-collection
#   - name: suse-ai-registry

# -- Cluster identity stamped into OTel resource attributes (k8s.cluster.name)
clusterName: ""

ollama:
  image:
    repository: dp.apps.rancher.io/containers/ollama
    tag: "0.21.2-11.48"
  service:
    port: 11434
    type: ClusterIP
  gpu:
    enabled: true
    # -- GPU vendor: nvidia | amd | cpu (cpu disables GPU requests entirely)
    type: nvidia
    # -- Number of GPUs (or time-sliced slices) requested per replica
    count: 1
    # -- GPU resource name. Use "nvidia.com/gpu" for full GPUs or time-sliced
    # GPUs (GPU Operator time-slicing advertises nvidia.com/gpu slices), or a
    # MIG profile like "nvidia.com/mig-4g.71gb" for MIG partitions (H100/A100).
    resource: nvidia.com/gpu
  # -- Number of Ollama replicas. Keep at 1 for a single model server; each
  # replica requests gpu.count GPUs.
  replicaCount: 1
  models:
    # -- Primary model (also registered in LiteLLM under the same name).
    # Picked from the GPU-class dropdown in questions.yaml.
    primary: gpt-oss:20b
    # -- Optional additional models, comma separated (e.g. "gemma4:12b,bge-large:latest")
    extra: ""
  resources:
    requests:
      cpu: "1"
      memory: "8Gi"
    limits:
      cpu: "4"
      memory: "16Gi"
  persistence:
    enabled: true
    size: "100Gi"
    storageClassName: "" # Use default if empty
    # -- Use an existing PVC instead of creating one (shared model cache)
    existingClaim: ""
  modelCache:
    nfs:
      # -- NFS-based model cache: pre-warm Ollama models from a shared NFS share
      enabled: false
      server: "" # e.g. 10.0.9.10
      path: "/data/ai-models"

litellm:
  enabled: true
  image:
    # Public upstream image (works everywhere). SUSE AI customers can switch to
    # the SUSE-published image: registry: registry.suse.com,
    # repository: ai/containers/litellm, tag: 1.80.15-stable.1 (requires the
    # suse-ai-registry pull secret).
    registry: docker.io
    repository: litellm/litellm
    tag: "1.94.2"
  service:
    port: 4000
    type: ClusterIP
  # -- LiteLLM master key (used as the OpenAI API key by Rancher AI / clients).
  # Leave empty to auto-generate (retrieve from the generated secret).
  masterkey: ""
  observability:
    # -- Export gen_ai.* token/cost/latency metrics to the OTel collector
    enabled: true
    # -- OTLP/HTTP endpoint of the shared SUSE Observability collector
    otlpEndpoint: "http://open-telemetry-collector-opentelemetry-collector.observability.svc.cluster.local:4318"
    # -- Optional existing secret holding the collector bearer token; the value
    # under apiKeySecretKey is sent as OTEL_HEADERS "Authorization: Bearer <token>"
    apiKeySecret: ""
    apiKeySecretKey: "API_KEY"

observability:
  ollamaSidecar:
    # -- Optional OTel collector sidecar next to Ollama. Exports Ollama HTTP
    # status/health metrics only (token data comes from LiteLLM, so this is
    # NOT required for token costing).
    enabled: false

ingress:
  enabled: false
  className: nginx
  # -- Hostname for the LiteLLM OpenAI-compatible endpoint (what Rancher AI's
  # openaiUrl points at). e.g. llm.wiredquill.com
  host: ""
  annotations: {}
  tls: []
  #  - secretName: llm-tls
  #    hosts:
  #      - llm.wiredquill.com
