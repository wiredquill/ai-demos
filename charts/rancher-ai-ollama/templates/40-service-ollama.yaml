apiVersion: v1
kind: Service
metadata:
  name: {{ include "rancher-ai-ollama.fullname" . }}-ollama
  labels:
    {{- include "rancher-ai-ollama.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  type: {{ .Values.ollama.service.type }}
  ports:
  - port: {{ .Values.ollama.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: ollama
    release: {{ .Release.Name }}
