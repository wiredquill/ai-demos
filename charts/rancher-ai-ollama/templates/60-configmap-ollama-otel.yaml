{{- if .Values.observability.ollamaSidecar.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rancher-ai-ollama.fullname" . }}-ollama-otel-config
  labels:
    {{- include "rancher-ai-ollama.labels" . | nindent 4 }}
    app.kubernetes.io/component: observability
data:
  otel-collector-config.yaml: |
    receivers:
      # HTTP check receiver to probe Ollama status
      httpcheck:
        targets:
          - endpoint: http://localhost:{{ .Values.ollama.service.port }}
            method: GET
        collection_interval: 30s
      # Prometheus receiver for Ollama metrics
      prometheus:
        config:
          scrape_configs:
            - job_name: 'ollama'
              scrape_interval: 30s
              static_configs:
                - targets: ['localhost:{{ .Values.ollama.service.port }}']
              metrics_path: '/metrics'
      # OTLP receiver for traces sent directly
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      resource:
        attributes:
          - key: service.name
            value: "ollama-server"
            action: upsert
          - key: service.version
            value: "{{ .Values.ollama.image.tag }}"
            action: upsert
          - key: deployment.environment
            value: "{{ .Release.Namespace }}"
            action: upsert
          - key: k8s.cluster.name
            value: "{{ default "unknown-cluster" .Values.clusterName }}"
            action: upsert
          - key: k8s.namespace.name
            value: "{{ .Release.Namespace }}"
            action: upsert
      batch:
        timeout: 10s
        send_batch_size: 1024
    exporters:
      otlphttp:
        endpoint: {{ .Values.litellm.observability.otlpEndpoint }}
        headers:
          "Content-Type": "application/x-protobuf"
        compression: gzip
      debug:
        verbosity: basic
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      pprof:
        endpoint: 0.0.0.0:1777
      zpages:
        endpoint: 0.0.0.0:55679
    service:
      extensions: [health_check, pprof, zpages]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [otlphttp, debug]
        metrics:
          receivers: [prometheus, httpcheck]
          processors: [resource, batch]
          exporters: [otlphttp, debug]
{{- end }}
