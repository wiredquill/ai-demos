apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rancher-ai-ollama.fullname" . }}-ollama
  labels:
    {{- include "rancher-ai-ollama.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  replicas: {{ .Values.ollama.replicaCount }}
  selector:
    matchLabels:
      app: ollama
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: ollama
        release: {{ .Release.Name }}
        app.kubernetes.io/component: ollama
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.ollama.gpu.enabled (eq .Values.ollama.gpu.type "nvidia") }}
      runtimeClassName: nvidia
      {{- end }}
      {{- if and .Values.ollama.gpu.enabled (ne .Values.ollama.gpu.type "cpu") }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64
      {{- end }}
      initContainers:
      {{- if .Values.ollama.modelCache.nfs.enabled }}
      # NFS Model Cache init container: pre-warm all configured models
      - name: nfs-model-cache
        image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        command: ["/bin/sh"]
        args:
          - -c
          - |
            set -e
            echo "=== NFS Model Cache ({{ .Values.ollama.modelCache.nfs.server }}:{{ .Values.ollama.modelCache.nfs.path }}) ==="
            ollama serve &
            OLLAMA_PID=$!
            sleep 10
            cleanup() { kill $OLLAMA_PID 2>/dev/null || true; }
            trap cleanup EXIT
            {{- $models := include "rancher-ai-ollama.modelList" . | splitList "," }}
            {{- range $models }}
            {{- $m := trim . }}
            {{- if $m }}
            {{- $name := splitList ":" $m | first }}
            {{- $tag := splitList ":" $m | last }}
            MODEL="{{ $m }}"
            MODEL_NAME="{{ $name }}"
            MODEL_TAG="{{ $tag }}"
            CACHE_PATH="/mnt/nfs-cache/${MODEL_NAME}_${MODEL_TAG}"
            echo "=== Checking ${MODEL} ==="
            if [ -d "${CACHE_PATH}" ] && [ "$(ls -A ${CACHE_PATH})" ]; then
              cp -r "${CACHE_PATH}"/* /root/.ollama/models/ 2>/dev/null || true
              if ollama list | grep -q "${MODEL_NAME}:${MODEL_TAG}"; then
                echo "OK: ${MODEL} loaded from cache"
              else
                echo "Cache corrupted for ${MODEL}, re-downloading"
                rm -rf "${CACHE_PATH}" 2>/dev/null || true
                ollama pull "${MODEL}"
                mkdir -p "${CACHE_PATH}"
                cp -r /root/.ollama/models/* "${CACHE_PATH}/" 2>/dev/null || true
              fi
            else
              echo "Downloading ${MODEL} and populating cache"
              ollama pull "${MODEL}"
              mkdir -p "${CACHE_PATH}"
              cp -r /root/.ollama/models/* "${CACHE_PATH}/" 2>/dev/null || true
            fi
            {{- end }}
            {{- end }}
            echo "=== Model provisioning complete ==="
        volumeMounts:
        - name: ollama-models
          mountPath: /root/.ollama
        - name: nfs-model-cache
          mountPath: /mnt/nfs-cache
        env:
        - name: OLLAMA_HOST
          value: "0.0.0.0:{{ .Values.ollama.service.port }}"
        resources:
          limits:
            memory: "4Gi"
            cpu: "2"
          requests:
            memory: "1Gi"
            cpu: "500m"
      {{- else }}
      # Standard init container: pull each configured model
      - name: ollama-pull-model
        image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            ollama serve &
            OLLAMA_PID=$!
            sleep 5
            {{- $models := include "rancher-ai-ollama.modelList" . | splitList "," }}
            {{- range $models }}
            {{- $m := trim . }}
            {{- if $m }}
            echo "=== Pulling {{ $m }} ==="
            ollama pull {{ $m }}
            {{- end }}
            {{- end }}
            kill $OLLAMA_PID 2>/dev/null || true
        volumeMounts:
        - name: ollama-models
          mountPath: /root/.ollama
        env:
        - name: OLLAMA_HOST
          value: "0.0.0.0:{{ .Values.ollama.service.port }}"
        resources:
          limits:
            memory: "4Gi"
            cpu: "2"
          requests:
            memory: "512Mi"
            cpu: "500m"
      {{- end }}
      containers:
      - name: ollama
        image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        command: ["ollama", "serve"]
        ports:
        - containerPort: {{ .Values.ollama.service.port }}
          name: http
        env:
        - name: OLLAMA_HOST
          value: "0.0.0.0:{{ .Values.ollama.service.port }}"
        - name: OLLAMA_KEEP_ALIVE
          value: "24h"
        - name: OLLAMA_NUM_PARALLEL
          value: "1"
        volumeMounts:
        - name: ollama-models
          mountPath: /root/.ollama
        resources:
          requests:
            memory: {{ .Values.ollama.resources.requests.memory | quote }}
            cpu: {{ .Values.ollama.resources.requests.cpu | quote }}
          limits:
            memory: {{ .Values.ollama.resources.limits.memory | quote }}
            cpu: {{ .Values.ollama.resources.limits.cpu | quote }}
            {{- if and .Values.ollama.gpu.enabled (eq .Values.ollama.gpu.type "nvidia") }}
            {{ .Values.ollama.gpu.resource }}: {{ .Values.ollama.gpu.count }}
            {{- else if and .Values.ollama.gpu.enabled (eq .Values.ollama.gpu.type "amd") }}
            amd.com/gpu: 1
            {{- end }}
        readinessProbe:
          httpGet:
            path: /
            port: {{ .Values.ollama.service.port }}
          initialDelaySeconds: 30
          periodSeconds: 15
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /
            port: {{ .Values.ollama.service.port }}
          initialDelaySeconds: 90
          periodSeconds: 30
          failureThreshold: 3
      {{- if .Values.observability.ollamaSidecar.enabled }}
      # OpenTelemetry sidecar: HTTP status/health for Ollama (NOT token data --
      # tokens come from LiteLLM)
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:0.157.0
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        ports:
        - containerPort: 4317
          name: otlp-grpc
        - containerPort: 4318
          name: otlp-http
        env:
        - name: OLLAMA_ENDPOINT
          value: "http://localhost:{{ .Values.ollama.service.port }}"
        volumeMounts:
        - name: otel-config
          mountPath: /etc/otel-collector-config.yaml
          subPath: otel-collector-config.yaml
        command: ["/otelcol-contrib"]
        args: ["--config=/etc/otel-collector-config.yaml"]
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
      {{- end }}
      volumes:
      - name: ollama-models
        {{- if .Values.ollama.persistence.enabled }}
        persistentVolumeClaim:
          {{- if .Values.ollama.persistence.existingClaim }}
          claimName: {{ .Values.ollama.persistence.existingClaim }}
          {{- else }}
          claimName: {{ include "rancher-ai-ollama.fullname" . }}-ollama-models-pvc
          {{- end }}
        {{- else }}
        emptyDir: {}
        {{- end }}
      {{- if .Values.ollama.modelCache.nfs.enabled }}
      - name: nfs-model-cache
        nfs:
          server: {{ .Values.ollama.modelCache.nfs.server }}
          path: {{ .Values.ollama.modelCache.nfs.path }}
      {{- end }}
      {{- if .Values.observability.ollamaSidecar.enabled }}
      - name: otel-config
        configMap:
          name: {{ include "rancher-ai-ollama.fullname" . }}-ollama-otel-config
      {{- end }}
