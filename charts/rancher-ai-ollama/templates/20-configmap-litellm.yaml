{{- if .Values.litellm.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rancher-ai-ollama.fullname" . }}-litellm-config
  labels:
    {{- include "rancher-ai-ollama.labels" . | nindent 4 }}
data:
  config.yaml: |
    model_list:
    {{- $models := include "rancher-ai-ollama.modelList" . | splitList "," }}
    {{- range $models }}
    {{- $m := trim . }}
    {{- if $m }}
      - model_name: {{ $m }}
        litellm_params:
          model: ollama/{{ $m }}
          api_base: http://{{ include "rancher-ai-ollama.fullname" $ }}-ollama:{{ $.Values.ollama.service.port }}
    {{- end }}
    {{- end }}
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
{{- end }}
