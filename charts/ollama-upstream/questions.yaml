questions:
- variable: ollama.service.type
  default: "ClusterIP"
  description: "Service type for Ollama"
  type: enum
  options:
    - "ClusterIP"
    - "NodePort"
    - "LoadBalancer"
  label: Service Type
  group: "Service Configuration"

- variable: ollama.resources.requests.memory
  default: "2Gi"
  description: "Memory request for Ollama"
  type: string
  label: Memory Request
  group: "Resource Configuration"

- variable: ollama.resources.requests.cpu
  default: "1000m"
  description: "CPU request for Ollama"
  type: string
  label: CPU Request
  group: "Resource Configuration"

- variable: ollama.resources.limits.memory
  default: "8Gi"
  description: "Memory limit for Ollama"
  type: string
  label: Memory Limit
  group: "Resource Configuration"

- variable: ollama.resources.limits.cpu
  default: "4000m"
  description: "CPU limit for Ollama"
  type: string
  label: CPU Limit
  group: "Resource Configuration"

- variable: ollama.gpu.enabled
  default: true
  description: "Enable GPU support for Ollama"
  type: boolean
  label: Enable GPU
  group: "GPU Configuration"

- variable: ollama.gpu.type
  default: "nvidia"
  description: "GPU type (nvidia, amd, intel)"
  type: enum
  options:
    - "nvidia"
    - "amd"
    - "intel"
  label: GPU Type
  group: "GPU Configuration"
  show_if: "ollama.gpu.enabled=true"

- variable: ollama.gpu.number
  default: 1
  description: "Number of GPUs to allocate"
  type: int
  min: 1
  max: 8
  label: GPU Count
  group: "GPU Configuration"
  show_if: "ollama.gpu.enabled=true"

- variable: ollama.persistence.enabled
  default: true
  description: "Enable persistent storage for models"
  type: boolean
  label: Enable Persistence
  group: "Storage Configuration"

- variable: ollama.persistence.size
  default: "50Gi"
  description: "Size of persistent volume for models"
  type: string
  label: Storage Size
  group: "Storage Configuration"
  show_if: "ollama.persistence.enabled=true"

- variable: ollama.persistence.storageClass
  default: ""
  description: "Storage class for persistent volume (empty for default)"
  type: storageclass
  label: Storage Class
  group: "Storage Configuration"
  show_if: "ollama.persistence.enabled=true"

- variable: ollama.models.autoDownload
  default: []
  description: "List of models to automatically download on startup"
  type: multiline
  label: Auto-download Models
  group: "Model Configuration"

- variable: ollama.models.pullPolicy
  default: "IfNotPresent"
  description: "Model pull policy"
  type: enum
  options:
    - "Always"
    - "IfNotPresent"
    - "Never"
  label: Model Pull Policy
  group: "Model Configuration"

- variable: ollama.ingress.enabled
  default: false
  description: "Enable ingress for external access"
  type: boolean
  label: Enable Ingress
  group: "Networking"

- variable: ollama.ingress.className
  default: "nginx"
  description: "Ingress class name"
  type: string
  label: Ingress Class
  group: "Networking"
  show_if: "ollama.ingress.enabled=true"

- variable: ollama.ingress.host
  default: "ollama.local"
  description: "Hostname for ingress"
  type: hostname
  label: Ingress Hostname
  group: "Networking"
  show_if: "ollama.ingress.enabled=true"

- variable: ollama.ingress.tls.enabled
  default: false
  description: "Enable TLS for ingress"
  type: boolean
  label: Enable TLS
  group: "Networking"
  show_if: "ollama.ingress.enabled=true"

- variable: ollama.security.runAsNonRoot
  default: true
  description: "Run container as non-root user"
  type: boolean
  label: Run as Non-Root
  group: "Security"

- variable: ollama.security.readOnlyRootFilesystem
  default: false
  description: "Mount root filesystem as read-only"
  type: boolean
  label: Read-Only Root FS
  group: "Security"

- variable: ollama.monitoring.enabled
  default: false
  description: "Enable Prometheus monitoring"
  type: boolean
  label: Enable Monitoring
  group: "Observability"

- variable: ollama.monitoring.serviceMonitor.enabled
  default: false
  description: "Create ServiceMonitor for Prometheus"
  type: boolean
  label: Create ServiceMonitor
  group: "Observability"
  show_if: "ollama.monitoring.enabled=true"

- variable: ollama.logging.level
  default: "info"
  description: "Log level for Ollama"
  type: enum
  options:
    - "debug"
    - "info"
    - "warn"
    - "error"
  label: Log Level
  group: "Observability"
