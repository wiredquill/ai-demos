questions:
# === FRONT PAGE - MOST IMPORTANT OPTIONS ===
- variable: ollama.image.tag
  default: "0.12.7"
  description: "Ollama version to deploy (e.g., 0.12.7, latest, dev)"
  type: string
  label: Ollama Version
  group: "Image Configuration"

- variable: ollama.image.useDevVersion
  default: false
  description: "Pull development version of Ollama (uses 'dev' tag instead of version number)"
  type: boolean
  label: Use Dev Version
  group: "Image Configuration"

- variable: ollama.service.type
  default: "ClusterIP"
  description: "Service type for accessing Ollama"
  type: enum
  options:
    - "ClusterIP"
    - "NodePort"
    - "LoadBalancer"
  label: Service Type
  group: "Service Configuration"

- variable: ollama.service.nodePort
  default: null
  description: "NodePort number (30000-32767). Leave empty for random assignment."
  type: int
  min: 30000
  max: 32767
  label: NodePort Number
  group: "Service Configuration"
  show_if: "ollama.service.type=NodePort"

- variable: ollama.ollama.gpu.enabled
  default: true
  description: "Enable GPU support for Ollama (NVIDIA GPU required)"
  type: boolean
  label: Enable GPU
  group: "GPU Configuration"

- variable: ollama.ollama.gpu.type
  default: "nvidia"
  description: "GPU type (nvidia or amd)"
  type: enum
  options:
    - "nvidia"
    - "amd"
  label: GPU Type
  group: "GPU Configuration"
  show_if: "ollama.ollama.gpu.enabled=true"

- variable: ollama.ollama.gpu.number
  default: 1
  description: "Number of GPUs to allocate"
  type: int
  min: 1
  max: 8
  label: GPU Count
  group: "GPU Configuration"
  show_if: "ollama.ollama.gpu.enabled=true"

# === RESOURCE CONFIGURATION ===
- variable: ollama.resources.requests.memory
  default: "2Gi"
  description: "Memory request for Ollama pod"
  type: string
  label: Memory Request
  group: "Resource Configuration"

- variable: ollama.resources.requests.cpu
  default: "1"
  description: "CPU request for Ollama pod"
  type: string
  label: CPU Request
  group: "Resource Configuration"

- variable: ollama.resources.limits.memory
  default: "8Gi"
  description: "Memory limit for Ollama pod"
  type: string
  label: Memory Limit
  group: "Resource Configuration"

- variable: ollama.resources.limits.cpu
  default: "4000m"
  description: "CPU limit for Ollama pod"
  type: string
  label: CPU Limit
  group: "Resource Configuration"

# === MODEL CONFIGURATION ===
- variable: ollama.ollama.models[0]
  default: "llama3.2:latest"
  description: "Primary model to pull on startup (e.g., 'llama3.2:latest', 'tinyllama:latest')"
  type: string
  label: Primary Model
  group: "Model Configuration"

- variable: ollama.ollama.models[1]
  default: ""
  description: "Optional second model to pull on startup"
  type: string
  label: Secondary Model
  group: "Model Configuration"

# === STORAGE CONFIGURATION ===
- variable: ollama.persistentVolume.enabled
  default: true
  description: "Enable persistent storage for models"
  type: boolean
  label: Enable Persistence
  group: "Storage Configuration"

- variable: ollama.persistentVolume.size
  default: "50Gi"
  description: "Size of persistent volume for models"
  type: string
  label: Storage Size
  group: "Storage Configuration"
  show_if: "ollama.persistentVolume.enabled=true"

- variable: ollama.persistentVolume.storageClass
  default: ""
  description: "Storage class for persistent volume (empty for default)"
  type: storageclass
  label: Storage Class
  group: "Storage Configuration"
  show_if: "ollama.persistentVolume.enabled=true"

# === DEPLOYMENT CONFIGURATION ===
- variable: ollama.replicaCount
  default: 1
  description: "Number of Ollama replicas"
  type: int
  min: 1
  max: 5
  label: Replica Count
  group: "Deployment Configuration"
