questions:
- variable: resources.requests.memory
  default: "2Gi"
  description: "Memory request for Ollama pod"
  type: string
  label: Memory Request
  group: "Resource Configuration"

- variable: resources.requests.cpu
  default: "1000m"
  description: "CPU request for Ollama pod"
  type: string
  label: CPU Request
  group: "Resource Configuration"

- variable: resources.limits.memory
  default: "8Gi"
  description: "Memory limit for Ollama pod"
  type: string
  label: Memory Limit
  group: "Resource Configuration"

- variable: resources.limits.cpu
  default: "4000m"
  description: "CPU limit for Ollama pod"
  type: string
  label: CPU Limit
  group: "Resource Configuration"

- variable: ollama.gpu.enabled
  default: true
  description: "Enable GPU support for Ollama (NVIDIA GPU required)"
  type: boolean
  label: Enable GPU
  group: "GPU Configuration"

- variable: ollama.gpu.type
  default: "nvidia"
  description: "GPU type (nvidia or amd)"
  type: enum
  options:
    - "nvidia"
    - "amd"
  label: GPU Type
  group: "GPU Configuration"
  show_if: "ollama.gpu.enabled=true"

- variable: ollama.gpu.number
  default: 1
  description: "Number of GPUs to allocate"
  type: int
  min: 1
  max: 8
  label: GPU Count
  group: "GPU Configuration"
  show_if: "ollama.gpu.enabled=true"

- variable: ollama.persistence.enabled
  default: true
  description: "Enable persistent storage for models"
  type: boolean
  label: Enable Persistence
  group: "Storage Configuration"

- variable: ollama.persistence.size
  default: "50Gi"
  description: "Size of persistent volume for models"
  type: string
  label: Storage Size
  group: "Storage Configuration"
  show_if: "ollama.persistence.enabled=true"

- variable: ollama.persistence.storageClass
  default: ""
  description: "Storage class for persistent volume (empty for default)"
  type: string
  label: Storage Class
  group: "Storage Configuration"
  show_if: "ollama.persistence.enabled=true"

- variable: replicaCount
  default: 1
  description: "Number of Ollama replicas"
  type: int
  min: 1
  max: 5
  label: Replica Count
  group: "Deployment Configuration"
