# Default values for ollama-upstream wrapper chart
# This passes through to the upstream ollama chart
# For more options, see: https://github.com/otwld/ollama-helm

# All values for the upstream ollama dependency are nested under the 'ollama' key
# This is required for Helm dependency value passing
ollama:
  # Replica count
  replicaCount: 1

  # Docker image configuration
  image:
    repository: ollama/ollama
    pullPolicy: IfNotPresent
    tag: "0.21.2"
    useDevVersion: false

  # Service configuration - at root of dependency values
  service:
    type: ClusterIP
    nodePort: null

  # Resource configuration - CPU and memory allocations
  # These are merged with GPU resources when gpu.enabled=true
  resources:
    requests:
      memory: "2Gi"
      cpu: "1000m"
    limits:
      memory: "8Gi"
      cpu: "4000m"

  # Persistent volume configuration for Ollama data
  persistentVolume:
    enabled: true
    size: "50Gi"
    storageClass: ""

  # Service account
  serviceAccount:
    create: true
    automount: true
    annotations: {}
    name: ""

  # Pod security context
  podSecurityContext: {}

  # Pod annotations
  podAnnotations: {}

  # Pod labels
  podLabels: {}

  # Ollama-specific configuration (nested under ollama section of upstream chart)
  ollama:
    # Port configuration
    port: 11434

    # GPU configuration - automatically applies to deployment resources
    # When enabled: true, GPU resources are added to pod spec
    gpu:
      enabled: true
      draEnabled: false
      type: "nvidia"
      number: 1
      nvidiaResource: "nvidia.com/gpu"
      mig:
        enabled: false
        devices: {}

    # Models to pull/run at startup
    models:
      pull: []
      run: []
      create: []
      clean: false

    # Mount path for ollama data
    mountPath: ""

    # Add insecure flag
    insecure: false
