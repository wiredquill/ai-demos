# Default values for ollama-upstream wrapper chart
# This passes through to the upstream ollama chart
# For more options, see: https://github.com/otwld/ollama-helm

# Replica count
replicaCount: 1

# Docker image configuration
image:
  repository: ollama/ollama
  pullPolicy: IfNotPresent
  tag: ""  # defaults to chart appVersion

# Ollama-specific configuration
ollama:
  # Port configuration
  port: 11434

  # Service configuration
  service:
    type: ClusterIP

  # Resource configuration (MUST be under ollama for dependency chart)
  resources:
    requests:
      memory: "2Gi"
      cpu: "1000m"
    limits:
      memory: "8Gi"
      cpu: "4000m"

  # GPU configuration - automatically applies to deployment resources
  # When enabled: true, GPU resources are added to pod spec
  gpu:
    enabled: true
    draEnabled: false
    type: "nvidia"
    number: 1
    nvidiaResource: "nvidia.com/gpu"
    mig:
      enabled: false
      devices: {}

  # Persistent storage for models
  persistence:
    enabled: true
    size: "50Gi"
    storageClass: ""

  # Models to pull/run at startup
  models:
    pull: []
    run: []
    create: []
    clean: false

  # Mount path for ollama data
  mountPath: ""

  # Add insecure flag
  insecure: false

# Service account
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# Pod security context
podSecurityContext: {}

# Pod annotations
podAnnotations: {}

# Pod labels
podLabels: {}
