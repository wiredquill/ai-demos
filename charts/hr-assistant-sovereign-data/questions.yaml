questions:
# Welcome and Information Section
- variable: deployment.appInfo
  label: "🚀 Welcome to HR Assistant - Sovereign Data Edition"
  type: "string"
  description: "This is the SUSE AI HR Assistant with comprehensive data sovereignty compliance."
  required: false
  default: "App Info Loaded"
  group: "Getting Started"
  show_if: "false"

# Welcome Information - Information Panel
- variable: deployment.welcomeInfo
  label: "📋 Application Information"
  type: "multiline"
  description: |
    🚀 Welcome to HR Assistant - Sovereign Data Edition

    🎯 About This Application:
    The HR Assistant is an intelligent employee support system powered by advanced AI models. It provides instant access to HR policies, employee handbook information, and policy database queries with complete transparency through direct model response comparison.

    🔒 Data Sovereignty & Compliance:
    This edition includes built-in data protection features specifically designed for global deployments. Depending on your deployment region/country, this application will automatically:
    • Apply GDPR compliance requirements (EU deployments)
    • Enforce data residency regulations (where applicable)
    • Implement region-specific data protection policies
    • Ensure compliance with local data protection laws

    📋 Key Features:
    • Regional deployment configuration (Americas, EMEA, ASIA-Pac)
    • Automatic compliance detection based on country selection
    • OpenTelemetry observability for audit and monitoring
    • Ollama LLM integration for on-premise AI inference
    • Employee handbook and policy database integration

    ⚠️ Important: This deployment requires careful attention to data sovereignty laws. Please ensure you understand and can comply with local regulations for your selected region.
  required: false
  default: ""
  group: "Getting Started"

- variable: deployment.region
  label: "📍 Select Deployment Region"
  type: "enum"
  description: "Choose the region where this HR Assistant will be deployed. This determines available countries and data sovereignty requirements."
  required: true
  default: "americas"
  group: "Sovereign Data Compliance"
  options:
    - "americas"
    - "emea"
    - "asia-pac"

- variable: deployment.country
  label: "🌍 Select Deployment Country"
  type: "enum"
  description: "Select the country for deployment. The list will be filtered based on your region selection. If your country has data sovereignty requirements, you will be prompted to acknowledge them."
  required: true
  default: "United States"
  group: "Sovereign Data Compliance"
  show_if: "deployment.region=americas"
  options:
    - "United States"
    - "Canada"
    - "Mexico"
    - "Brazil"
    - "Chile"
    - "Colombia"
    - "Argentina"
    - "Peru"

