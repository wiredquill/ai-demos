apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hr-assistant.fullname" . }}-hr-assistant
  labels:
    {{- include "hr-assistant.labels" . | nindent 4 }}
    app.component: hr-assistant
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "hr-assistant.selectorLabels" . | nindent 6 }}
      app.component: hr-assistant
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "hr-assistant.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        app.component: hr-assistant
        genai: hr-assistant
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "hr-assistant.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          env:
          - name: APP_NAME
            value: HRAssistant
          - name: MODEL
            value: "llama3.2:1b"
          - name: OLLAMA_ENDPOINT
            value: {{ include "hr-assistant.ollamaEndpoint" . }}
          - name: OTLP_ENDPOINT
            value: {{ .Values.otlpEndpoint }}
          - name: COLLECT_GPU_STATS
            value: "{{ .Values.collectGpuStats }}"
          # Sovereign Data Compliance Configuration
          - name: DEPLOYMENT_REGION
            value: "{{ .Values.deployment.region }}"
          - name: DEPLOYMENT_COUNTRY
            value: "{{ .Values.deployment.country }}"
          - name: SOVEREIGNTY_NOTICE
            value: |
              {{- if or (eq .Values.deployment.country "Austria") (eq .Values.deployment.country "Belgium") (eq .Values.deployment.country "Bulgaria") (eq .Values.deployment.country "Croatia") (eq .Values.deployment.country "Cyprus") (eq .Values.deployment.country "Czechia") (eq .Values.deployment.country "Denmark") (eq .Values.deployment.country "Estonia") (eq .Values.deployment.country "Finland") (eq .Values.deployment.country "France") (eq .Values.deployment.country "Germany") (eq .Values.deployment.country "Greece") (eq .Values.deployment.country "Hungary") (eq .Values.deployment.country "Ireland") (eq .Values.deployment.country "Italy") (eq .Values.deployment.country "Latvia") (eq .Values.deployment.country "Lithuania") (eq .Values.deployment.country "Luxembourg") (eq .Values.deployment.country "Malta") (eq .Values.deployment.country "Netherlands") (eq .Values.deployment.country "Poland") (eq .Values.deployment.country "Portugal") (eq .Values.deployment.country "Romania") (eq .Values.deployment.country "Slovakia") (eq .Values.deployment.country "Slovenia") (eq .Values.deployment.country "Spain") (eq .Values.deployment.country "Sweden") (eq .Values.deployment.country "United Kingdom") (eq .Values.deployment.country "Norway") }}
              ⚠️ {{ .Values.deployment.country }} has local Data Sovereignty Laws. GDPR and national data protection regulations apply to this deployment.
              {{- else }}
              {{- end }}
          - name: ACKNOWLEDGE_DATA_SOVEREIGNTY
            value: "{{ .Values.deployment.acknowledgeDataSovereignty }}"
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          volumeMounts:
          - name: config
            mountPath: /app
            readOnly: true
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
      - name: config
        configMap:
          name: {{ include "hr-assistant.fullname" . }}-sovereign-data-config
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
