{{- if and (eq .Values.model.backend "external") .Values.model.external.apiKey (not .Values.model.external.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hermes-rancher.fullname" . }}-llm
  labels:
    {{- include "hermes-rancher.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.model.external.apiKey | quote }}
{{- end }}
{{- if and (eq .Values.platform.via "rancher") .Values.platform.rancher.token (not .Values.platform.rancher.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hermes-rancher.fullname" . }}-rancher
  labels:
    {{- include "hermes-rancher.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.platform.rancher.token | quote }}
{{- end }}
