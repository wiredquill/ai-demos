{{- $model := include "hermes-rancher.model" . | fromJson }}
{{- $pl := include "hermes-rancher.platform" . | fromJson }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hermes-rancher.clientName" . }}
  labels:
    {{- include "hermes-rancher.labels" . | nindent 4 }}
    app.kubernetes.io/component: openshell-client
spec:
  replicas: 1
  # One sandbox per release: the old pod must delete its sandbox before the new
  # one creates it again, so never run two at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "hermes-rancher.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hermes-rancher.selector" . | nindent 8 }}
        app.kubernetes.io/component: openshell-client
      annotations:
        # restart (and so recreate the sandbox) when the profile, image or model changes
        checksum/policy: {{ include "hermes-rancher.policy" . | sha256sum }}
        checksum/sandbox: {{ printf "%s|%s|%s|%v|%s" (include "hermes-rancher.sandboxImage" .) (toJson $model) (get .Values.approvals .Values.profile) .Values.sandbox.gpu (toJson .Values.observability) | sha256sum }}
        checksum/hermes: {{ toJson .Values.hermes | sha256sum }}
        checksum/platform: {{ toJson .Values.platform | sha256sum }}
        checksum/api-key: {{ .Values.model.external.apiKey | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # leave time to delete the sandbox on shutdown
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: client
          image: "{{ .Values.client.image.repository }}:{{ .Values.client.image.tag }}"
          imagePullPolicy: {{ .Values.client.image.pullPolicy }}
          env:
            - name: HOME
              value: /home/client
            - name: GATEWAY_ENDPOINT
              value: {{ .Values.gateway.endpoint | quote }}
            - name: SANDBOX_NAME
              value: {{ .Values.sandbox.name | quote }}
            - name: SANDBOX_IMAGE
              value: {{ include "hermes-rancher.sandboxImage" . | quote }}
            - name: SANDBOX_GPU
              value: {{ .Values.sandbox.gpu | quote }}
            - name: RECREATE
              value: {{ .Values.sandbox.recreate | quote }}
            - name: PROFILE
              value: {{ .Values.profile | quote }}
            - name: APPROVALS
              value: {{ required (printf "approvals.%s is required" .Values.profile) (get .Values.approvals .Values.profile) | quote }}
            - name: LLM_BASE_URL
              value: {{ $model.url | quote }}
            - name: LLM_MODEL
              value: {{ $model.name | quote }}
            - name: FORWARD_PORT
              value: "7681"
            # Hermes options, handed on to the sandbox (images/hermes/hermes-sandbox-start)
            - name: HERMES_SKIN
              value: {{ required (printf "hermes.skins.%s is required" .Values.profile) (get .Values.hermes.skins .Values.profile) | quote }}
            {{- range $env, $value := include "hermes-rancher.branding" . | fromYaml }}
            - name: HERMES_BRANDING_{{ $env }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.hermes.session.enabled }}
            - name: HERMES_TITLE
              value: {{ include "hermes-rancher.title" . | quote }}
            {{- end }}
            {{- with .Values.hermes.cron }}
            {{- if .enabled }}
            - name: HERMES_CRON_NAME
              value: {{ .name | quote }}
            - name: HERMES_CRON_SCHEDULE
              value: {{ required "hermes.cron.schedule is required" .schedule | quote }}
            - name: HERMES_CRON_PROMPT
              value: {{ required "hermes.cron.prompt is required" .prompt | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.observability }}
            {{- if .enabled }}
            # handed on to the sandbox (OTEL_*, HERMES_OTEL_*); see images/hermes/sitecustomize.py
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ include "hermes-rancher.otlpEndpoint" $ | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_SERVICE_NAME
              value: {{ .serviceName | quote }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ printf "k8s.namespace.name=%s,service.namespace=%s,service.instance.id=%s" $.Release.Namespace $.Release.Namespace $.Values.sandbox.name | quote }}
            - name: HERMES_OTEL_ENVIRONMENT
              value: {{ .environment | quote }}
            - name: HERMES_OTEL_CAPTURE_CONTENT
              value: {{ .captureContent | quote }}
            {{- end }}
            {{- end }}
            # cluster access; HERMES_PLATFORM_* go on to the sandbox
            - name: HERMES_PLATFORM_ACCESS
              value: {{ $pl.access | quote }}
            - name: HERMES_PLATFORM_VIA
              value: {{ $pl.via | quote }}
            {{- if eq $pl.via "rancher" }}
            # the client makes a provider for Rancher from the token in
            # /etc/hermes/rancher; the gateway adds it to requests to Rancher
            - name: RANCHER_URL
              value: {{ $pl.rancherUrl | quote }}
            - name: RANCHER_ACCESS
              value: {{ ternary "read-only" "read-write" (eq $pl.access "view") | quote }}
            - name: HERMES_PLATFORM_RANCHER
              value: {{ $pl.rancherUrl | quote }}
            {{- else }}
            # the client uploads a kubeconfig from the token in /etc/hermes/cluster
            - name: CLUSTER_NAME
              value: {{ $pl.clusterName | quote }}
            - name: HERMES_PLATFORM_CLUSTER
              value: {{ $pl.clusterName | quote }}
            {{- end }}
            # `kubectl exec ... -- openshell ...` uses the registered gateway
            - name: OPENSHELL_GATEWAY
              value: k8s
          ports:
            - name: http
              containerPort: 7681
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.client.resources | nindent 12 }}
          volumeMounts:
            - name: home
              mountPath: /home/client
            - name: tmp
              mountPath: /tmp
            - name: policy
              mountPath: /etc/hermes/policy.yaml
              subPath: policy.yaml
              readOnly: true
            - name: profiles
              mountPath: /etc/hermes/profiles
              readOnly: true
            {{- if $model.secret }}
            - name: llm
              mountPath: /etc/hermes/llm
              readOnly: true
            {{- end }}
            - name: gateway-tls
              mountPath: /etc/openshell/tls
              readOnly: true
            {{- if eq $pl.via "rancher" }}
            - name: rancher
              mountPath: /etc/hermes/rancher
              readOnly: true
            {{- else }}
            - name: cluster
              mountPath: /etc/hermes/cluster
              readOnly: true
            {{- end }}
      volumes:
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: policy
          configMap:
            name: {{ include "hermes-rancher.fullname" . }}-policy
        - name: profiles
          configMap:
            name: {{ include "hermes-rancher.fullname" . }}-policy
            items:
              {{- range $path, $_ := .Files.Glob "profiles/*.yaml" }}
              - key: profile-{{ base $path }}
                path: {{ base $path }}
              {{- end }}
        {{- if $model.secret }}
        - name: llm
          secret:
            secretName: {{ $model.secret }}
            items:
              - key: {{ if .Values.model.external.existingSecret }}{{ .Values.model.external.existingSecretKey }}{{ else }}api-key{{ end }}
                path: api-key
        {{- end }}
        - name: gateway-tls
          secret:
            secretName: {{ .Values.gateway.tlsSecret }}
        {{- if eq $pl.via "rancher" }}
        - name: rancher
          secret:
            secretName: {{ $pl.rancherSecret }}
            items:
              - {key: {{ .Values.platform.rancher.existingSecretKey }}, path: token}
        {{- else }}
        - name: cluster
          secret:
            secretName: {{ printf "%s-platform-token" (include "hermes-rancher.fullname" .) }}
            items:
              - {key: token, path: token}
              - {key: ca.crt, path: ca.crt}
        {{- end }}
