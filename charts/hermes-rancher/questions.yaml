questions:
- variable: profile
  label: Security profile
  group: Security profile
  type: enum
  default: research
  required: true
  options:
    - lockdown
    - research
    - developer
    - dangerous
  description: >-
    What OpenShell lets the agent do. Every profile runs as a non-root user and can reach the model.
    lockdown: no other network access. Writes only to its home directory and /tmp. Hermes asks before every risky command.
    research: adds read-only web access (GET only) to Wikipedia, arXiv, GitHub, Python, SUSE, openSUSE and NVIDIA docs.
    developer: adds GitHub clone, push and pull requests (no deletes) and pip installs from PyPI.
    dangerous: any program may reach any subdomain of the common TLDs, plus popular bare domains, over HTTP or HTTPS.
    Landlock is best effort, and Hermes runs commands without asking. Demo use only.
    (OpenShell 0.1.5 can't allow every host: no raw IP addresses, cluster Services or unlisted bare domains.)
    Changing the profile recreates the sandbox.

- variable: model.backend
  label: Model backend
  group: Model
  type: enum
  default: vllm
  required: true
  options:
    - vllm
    - external
  description: >-
    vllm: the SUSE vLLM router in this namespace (the hermes-openshell-vllm blueprint installs it).
    external: any OpenAI-compatible API, such as OpenRouter or OpenAI. The OpenShell gateway holds the API key
    and adds it only to requests to that host, so the key never enters the sandbox.
- variable: model.vllm.url
  label: vLLM endpoint
  group: Model
  type: string
  default: http://vllm-router-service/v1
  show_if: "model.backend=vllm"
  description: The vLLM router Service's OpenAI-compatible URL.
- variable: model.vllm.name
  label: Model served by vLLM
  group: Model
  type: string
  default: Qwen/Qwen2.5-7B-Instruct
  show_if: "model.backend=vllm"
  description: Must match the vllm component's model (modelURL). It needs tool calling, which vLLM enables with --enable-auto-tool-choice.
- variable: model.external.url
  label: API base URL
  group: Model
  type: string
  default: https://openrouter.ai/api/v1
  show_if: "model.backend=external"
- variable: model.external.name
  label: Model
  group: Model
  type: string
  default: nousresearch/hermes-4-70b
  show_if: "model.backend=external"
  description: The model name the API expects, e.g. nousresearch/hermes-4-70b on OpenRouter.
- variable: model.external.apiKey
  label: API key
  group: Model
  type: password
  default: ""
  show_if: "model.backend=external"
  description: Stored in a Secret in this namespace and given to the OpenShell gateway, not to the sandbox. Leave blank to use an existing Secret.
- variable: model.external.existingSecret
  label: Existing Secret with the API key
  group: Model
  type: string
  default: ""
  show_if: "model.backend=external"
  description: Instead of the field above. Key name below.
- variable: model.external.existingSecretKey
  label: Key in that Secret
  group: Model
  type: string
  default: api-key
  show_if: "model.backend=external"

- variable: sandbox.image
  label: Sandbox OS
  group: Sandbox
  type: enum
  default: suse
  required: true
  options:
    - suse
    - custom
  description: >-
    suse = SUSE BCI 16 with kubectl and Rancher's agent CLI
    (ghcr.io/wiredquill/hermes-rancher, amd64 nodes only),
    custom = your own image below. Changing it recreates the sandbox.
- variable: sandbox.customImage
  label: Custom sandbox image
  group: Sandbox
  type: string
  default: ""
  show_if: "sandbox.image=custom"
  required: true
  description: Built like images/hermes-rancher in github.com/wiredquill/ai-demos (hermes, ttyd, hermes-sandbox-start, kubectl, rancher, user 10001).
- variable: sandbox.name
  label: Sandbox name
  group: Sandbox
  type: string
  default: hermes-rancher
  required: true
  description: Name in OpenShell, used by openshell sandbox connect and openshell policy set.
- variable: sandbox.recreate
  label: Recreate the sandbox when the app restarts
  group: Sandbox
  type: boolean
  default: true
  description: On, changes in this form take effect on upgrade. Off, a running sandbox is reused and keeps its files, chat history and any live policy changes.
- variable: sandbox.gpu
  label: Request a GPU
  group: Sandbox
  type: boolean
  default: false
  description: Ask OpenShell for a GPU for the sandbox. Hermes doesn't need one; the model runs in vLLM or the external API.

- variable: approvals.lockdown
  label: Hermes approvals under lockdown
  group: Hermes approvals
  type: enum
  default: manual
  options: [manual, smart, "off"]
  show_if: "profile=lockdown"
  description: Hermes's own prompt before risky commands. manual = always ask, smart = auto-approve low-risk ones, off = never ask.
- variable: approvals.research
  label: Hermes approvals under research
  group: Hermes approvals
  type: enum
  default: smart
  options: [manual, smart, "off"]
  show_if: "profile=research"
- variable: approvals.developer
  label: Hermes approvals under developer
  group: Hermes approvals
  type: enum
  default: smart
  options: [manual, smart, "off"]
  show_if: "profile=developer"
- variable: approvals.dangerous
  label: Hermes approvals under dangerous
  group: Hermes approvals
  type: enum
  default: "off"
  options: [manual, smart, "off"]
  show_if: "profile=dangerous"

- variable: hermes.skins.lockdown
  label: Skin under lockdown
  group: Hermes options
  type: enum
  default: mono
  show_if: "profile=lockdown"
  options:
    - default
    - ares
    - mono
    - slate
    - daylight
    - warm-lightmode
    - poseidon
    - sisyphus
    - charizard
  description: >-
    The terminal's look for this profile; the defaults make each profile easy to tell apart
    (lockdown mono, research poseidon, developer slate, dangerous charizard).
    Built-in Hermes skins, plus any shipped in the image's /opt/hermes/skins.
- variable: hermes.skins.research
  label: Skin under research
  group: Hermes options
  type: enum
  default: poseidon
  show_if: "profile=research"
  options:
    - default
    - ares
    - mono
    - slate
    - daylight
    - warm-lightmode
    - poseidon
    - sisyphus
    - charizard
- variable: hermes.skins.developer
  label: Skin under developer
  group: Hermes options
  type: enum
  default: slate
  show_if: "profile=developer"
  options:
    - default
    - ares
    - mono
    - slate
    - daylight
    - warm-lightmode
    - poseidon
    - sisyphus
    - charizard
- variable: hermes.skins.dangerous
  label: Skin under dangerous
  group: Hermes options
  type: enum
  default: charizard
  show_if: "profile=dangerous"
  options:
    - default
    - ares
    - mono
    - slate
    - daylight
    - warm-lightmode
    - poseidon
    - sisyphus
    - charizard
- variable: hermes.branding.enabled
  label: Customize branding
  group: Hermes options
  type: boolean
  default: true
  description: Replace the skin's text. Blank fields keep the skin's own; colors and spinners stay the skin's.
- variable: hermes.branding.agentName
  label: Agent name
  group: Hermes options
  type: string
  default: "Hermes for Rancher"
  show_if: "hermes.branding.enabled=true"
  description: Banner title and status display (Hermes default <code>Hermes Agent</code>).
- variable: hermes.branding.welcome
  label: Welcome message
  group: Hermes options
  type: string
  default: ""
  show_if: "hermes.branding.enabled=true"
  description: Shown at startup.
- variable: hermes.branding.goodbye
  label: Goodbye message
  group: Hermes options
  type: string
  default: ""
  show_if: "hermes.branding.enabled=true"
  description: Shown on exit.
- variable: hermes.branding.responseLabel
  label: Response label
  group: Hermes options
  type: string
  default: ""
  show_if: "hermes.branding.enabled=true"
  description: Response box header (Hermes default <code>⚕ Hermes</code>).
- variable: hermes.branding.promptSymbol
  label: Prompt symbol
  group: Hermes options
  type: string
  default: ""
  show_if: "hermes.branding.enabled=true"
  description: Before the input prompt (Hermes default <code>❯</code>).
- variable: hermes.branding.helpHeader
  label: Help header
  group: Hermes options
  type: string
  default: ""
  show_if: "hermes.branding.enabled=true"
  description: Header of the /help output.

- variable: hermes.cron.enabled
  label: Run a scheduled prompt (cron job)
  group: Hermes options
  type: boolean
  default: false
  description: >-
    Creates a Hermes cron job when the sandbox starts, for steady demo traffic. Every run is a full agent turn,
    so it shows up in OpenTelemetry like a chat. See it with <code>hermes cron list</code> in the terminal;
    results go to ~/.hermes/cron/output.
- variable: hermes.cron.schedule
  label: Schedule
  group: Hermes options
  type: string
  default: "* * * * *"
  show_if: "hermes.cron.enabled=true"
  description: Cron expression (<code>* * * * *</code> = every minute) or Hermes's own <code>30m</code> / <code>every 2h</code>.
- variable: hermes.cron.prompt
  label: Prompt
  group: Hermes options
  type: multiline
  default: "Pick one short, simple question and answer it. Choose from: a basic arithmetic fact, a common word definition, or a quick general-knowledge fact. Answer in a single sentence. Keep it brief — this is just light token traffic, no tools needed."
  show_if: "hermes.cron.enabled=true"
- variable: hermes.cron.name
  label: Job name
  group: Hermes options
  type: string
  default: token-traffic
  show_if: "hermes.cron.enabled=true"

- variable: platform.access
  label: Cluster access
  group: Cluster access
  type: enum
  default: view
  options:
    - view
    - operator
  description: >-
    view = read everything except Secrets. operator = view, plus restart and scale Deployments, StatefulSets and
    DaemonSets, and delete Pods. Hermes runs kubectl on this cluster as a ServiceAccount of its own; the sandbox's
    policy lets kubectl, and nothing else, reach the API server. Hermes is told to ask before any change.
- variable: platform.via
  label: Reach clusters through
  group: Cluster access
  type: enum
  default: kubernetes
  options:
    - kubernetes
    - rancher
  description: >-
    kubernetes = kubectl on this cluster as a ServiceAccount the chart creates (access above sets its RBAC).
    rancher = Rancher's agent CLI, and kubectl through Rancher, on every cluster a Rancher API token can reach; the
    token's user and its roles are the limit, and view also lets only reads through. The OpenShell gateway holds the
    token, so it never enters the sandbox.
- variable: platform.clusterName
  label: Cluster name
  group: Cluster access
  type: string
  default: ""
  show_if: "platform.via=kubernetes"
  description: "What Hermes calls the cluster. Blank = the Rancher cluster name, else the namespace."
- variable: platform.rancher.url
  label: Rancher URL
  group: Cluster access
  type: string
  default: ""
  required: true
  show_if: "platform.via=rancher"
  description: "e.g. https://rancher.example.com. Its certificate must be publicly trusted."
- variable: platform.rancher.existingSecret
  label: Rancher token Secret
  group: Cluster access
  type: string
  default: ""
  required: true
  show_if: "platform.via=rancher"
  description: >-
    Secret in this namespace with a Rancher API token (no scope) under key "token". Create it for a user with
    only the roles Hermes should have, e.g. kubectl create secret generic rancher-cli --from-literal=token=...

- variable: observability.enabled
  label: Enable OpenTelemetry
  group: Observability
  type: boolean
  default: true
  description: >-
    OpenLit in the sandbox instruments every model call Hermes makes (tokens, cost, latency, time to first token, errors)
    and sends GenAI traces, metrics and logs to the cluster's SUSE AI collector over OTLP/HTTP. The sandbox's policy gets
    one rule that lets the agent's python reach the collector's host and port, nothing else. Changing this recreates the sandbox.
- variable: observability.otlpEndpoint
  label: OTLP Endpoint
  group: Observability
  type: string
  default: ""
  show_if: "observability.enabled=true"
  description: >-
    OTLP/HTTP collector address (scheme://host:4318).<br><br><b>Leave blank to auto-discover:</b> the chart looks up the
    collector Service in the Collector Namespace below at install time.<br><br>Use a hostname, not an IP address: the sandbox
    policy can only allow it by name.
- variable: observability.collectorNamespace
  label: Collector Namespace
  group: Observability
  type: string
  default: observability
  show_if: "observability.enabled=true"
  description: Namespace holding the shared OpenTelemetry collector Service. The chart also checks <code>observability</code> and <code>suse-observability</code>.
- variable: observability.serviceName
  label: Service name
  group: Observability
  type: string
  default: hermes-rancher
  show_if: "observability.enabled=true"
- variable: observability.environment
  label: Environment
  group: Observability
  type: string
  default: demo
  show_if: "observability.enabled=true"
  description: deployment.environment on all telemetry.
- variable: observability.captureContent
  label: Record prompts and replies
  group: Observability
  type: boolean
  default: true
  show_if: "observability.enabled=true"
  description: Off = spans keep token counts and timings but not the text.

- variable: gateway.endpoint
  label: OpenShell gateway endpoint
  group: OpenShell gateway
  type: string
  default: https://openshell:8080
  description: The openshell-gateway app's Service. Install this app in the same namespace.
- variable: gateway.tlsSecret
  label: Gateway client certificate Secret
  group: OpenShell gateway
  type: string
  default: openshell-client-tls
  description: Created by the openshell-gateway app in its namespace.

- variable: service.type
  label: Terminal Service type
  group: Browser terminal
  type: enum
  default: ClusterIP
  options: [ClusterIP, NodePort, LoadBalancer]
  description: >-
    How browsers reach Hermes's web terminal. The sandbox itself has no inbound network:
    this app's client pod forwards the terminal out of it through the gateway.
    Anyone who can open this page can drive the agent and its cluster access. ClusterIP (the default) is reached
    with kubectl port-forward, so only by people allowed into this namespace.
- variable: service.nodePort
  label: NodePort
  group: Browser terminal
  type: int
  default: ""
  min: 30000
  max: 32767
  show_if: "service.type=NodePort"
  description: Blank = assigned by Kubernetes.

- variable: client.image.repository
  label: Client image
  group: Advanced
  type: string
  default: ghcr.io/wiredquill/hermes-openshell-client
- variable: client.image.tag
  label: Client image tag
  group: Advanced
  type: string
  default: latest
