{{- $authEnabled := false }}
{{- if eq .Values.uiVariant "comfyui" }}
  {{- if .Values.comfyui.auth.enabled }}
    {{- $authEnabled = true }}
  {{- end }}
{{- else if eq .Values.uiVariant "automatic1111" }}
  {{- if .Values.automatic1111.auth.enabled }}
    {{- $authEnabled = true }}
  {{- end }}
{{- end }}

{{- if $authEnabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stable-diffusion.fullname" . }}-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stable-diffusion.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
type: Opaque
data:
  {{- if eq .Values.uiVariant "comfyui" }}
  password: {{ .Values.comfyui.auth.password | b64enc | quote }}
  {{- else if eq .Values.uiVariant "automatic1111" }}
  password: {{ .Values.automatic1111.auth.password | b64enc | quote }}
  {{- end }}
{{- end }}
