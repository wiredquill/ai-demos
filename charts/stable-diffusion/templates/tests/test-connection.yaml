apiVersion: v1
kind: Pod
metadata:
  name: {{ include "stable-diffusion.fullname" . }}-test-connection
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stable-diffusion.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  containers:
  - name: wget
    image: busybox:latest
    imagePullPolicy: IfNotPresent
    command:
      - sh
      - -c
      - |
        echo "Testing connection to {{ include "stable-diffusion.fullname" . }} service..."
        echo "Service: {{ include "stable-diffusion.fullname" . }}"
        echo "Port: {{ include "stable-diffusion.servicePort" . }}"
        echo "Attempting HTTP request..."

        # Try to connect to the service (timeout after 30 seconds)
        if wget --spider --timeout=30 "http://{{ include "stable-diffusion.fullname" . }}:{{ include "stable-diffusion.servicePort" . }}" 2>&1 | grep -q "200 OK\|302 Found\|301 Moved"; then
          echo "✓ Successfully connected to Stable Diffusion service"
          echo "✓ UI variant: {{ .Values.uiVariant }}"
          echo "✓ Service is responding"
          exit 0
        else
          echo "✗ Failed to connect to Stable Diffusion service"
          echo "This may be normal if the application is still starting up"
          echo "Try running: kubectl logs -n {{ .Release.Namespace }} -l ui-variant={{ .Values.uiVariant }}"
          exit 1
        fi
  restartPolicy: Never
