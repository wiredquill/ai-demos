{{- if or .Values.observability.enabled (gt (len .Values.env) 0) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stable-diffusion.fullname" . }}-env
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stable-diffusion.labels" . | nindent 4 }}
    app.kubernetes.io/component: config
data:
  {{- if .Values.observability.enabled }}
  OTEL_EXPORTER_OTLP_ENDPOINT: "{{ .Values.observability.otlpEndpoint }}"
  OTEL_SERVICE_NAME: "stable-diffusion-{{ .Values.uiVariant }}"
  COLLECT_GPU_STATS: "{{ .Values.observability.collectGpuStats }}"
  {{- end }}
  UI_VARIANT: "{{ .Values.uiVariant }}"
  GPU_ENABLED: "{{ .Values.gpu.enabled }}"
  {{- if .Values.gpu.enabled }}
  GPU_COUNT: "{{ .Values.gpu.count }}"
  {{- end }}
{{- end }}
