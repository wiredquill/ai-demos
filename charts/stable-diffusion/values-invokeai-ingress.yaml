# Example values for InvokeAI with Ingress and TLS
# Usage: helm install sd charts/stable-diffusion -f values-invokeai-ingress.yaml

# UI Selection
uiVariant: "invokeai"

# GPU Configuration
gpu:
  enabled: true
  count: 1

# Storage with NFS share
storage:
  models:
    enabled: true
    size: 50Gi
  outputs:
    enabled: true
    size: 100Gi
  shared:
    enabled: true
    type: "nfs"
    nfs:
      server: "192.168.1.100"
      path: "/mnt/ai-outputs"
    linkToOutputs: true

# Networking - Use ClusterIP since we're using Ingress
invokeai:
  service:
    type: ClusterIP
    port: 9090

# Ingress with TLS
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hosts:
    - host: stable-diffusion.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: stable-diffusion-tls
      hosts:
        - stable-diffusion.example.com

# Auto-download default models
initModels:
  enabled: true
  models:
    - url: "https://huggingface.co/runwayml/stable-diffusion-v1-5/resolve/main/v1-5-pruned-emaonly.safetensors"
      filename: "sd_v1-5.safetensors"

# Optional: Enable observability
observability:
  enabled: false
  otlpEndpoint: "http://opentelemetry-collector.suse-observability.svc.cluster.local:4318"
  collectGpuStats: true
