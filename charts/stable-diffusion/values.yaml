# Stable Diffusion Helm Chart Values
# Configure UI variant, GPU acceleration, storage, and networking

# Global Settings
imagePullPolicy: IfNotPresent
imagePullSecrets: []

# =============================================================================
# UI Variant Selection
# =============================================================================
# Choose which Stable Diffusion UI to deploy
# Options: comfyui, automatic1111, invokeai
uiVariant: "comfyui"

# =============================================================================
# ComfyUI Configuration
# =============================================================================
comfyui:
  enabled: true  # Automatically set based on uiVariant
  image:
    repository: ghcr.io/ai-dock/comfyui
    tag: "latest"
  service:
    type: NodePort  # Options: ClusterIP, NodePort, LoadBalancer
    port: 8188
    nodePort: 31800  # Only used when type=NodePort
  # Web UI settings
  auth:
    enabled: false
    username: "admin"
    password: ""  # Set a password if auth enabled

# =============================================================================
# Automatic1111 Configuration
# =============================================================================
automatic1111:
  enabled: false  # Automatically set based on uiVariant
  image:
    repository: ghcr.io/ai-dock/stable-diffusion-webui
    tag: "latest"
  service:
    type: NodePort  # Options: ClusterIP, NodePort, LoadBalancer
    port: 7860
    nodePort: 31801  # Only used when type=NodePort
  # WebUI settings
  args:
    - "--listen"
    - "--port=7860"
    - "--enable-insecure-extension-access"
  auth:
    enabled: false
    username: "admin"
    password: ""  # Set a password if auth enabled

# =============================================================================
# InvokeAI Configuration
# =============================================================================
invokeai:
  enabled: false  # Automatically set based on uiVariant
  image:
    repository: ghcr.io/invoke-ai/invokeai
    tag: "latest"
  service:
    type: NodePort  # Options: ClusterIP, NodePort, LoadBalancer
    port: 9090
    nodePort: 31802  # Only used when type=NodePort
  # InvokeAI settings
  config:
    host: "0.0.0.0"
    port: 9090

# =============================================================================
# GPU Configuration
# =============================================================================
gpu:
  enabled: true  # Enable NVIDIA GPU acceleration
  # Number of GPUs to allocate (1-8)
  count: 1
  # GPU type - currently only NVIDIA supported
  type: "nvidia"
  # GPU resource name (for custom GPU operators)
  resourceName: "nvidia.com/gpu"

# =============================================================================
# Storage Configuration
# =============================================================================
storage:
  # ---------------------------------------------------------------------------
  # Model Storage - For model checkpoints, LoRAs, VAEs, embeddings
  # ---------------------------------------------------------------------------
  models:
    enabled: true
    size: 50Gi  # Models can be large (5-10GB each)
    storageClassName: ""  # Empty = default storage class
    accessMode: ReadWriteOnce
    # Optional: Use existing PVC instead of creating new one
    existingClaim: ""
    # Mount path for models
    mountPath: "/models"

  # ---------------------------------------------------------------------------
  # Output Storage - For generated images
  # ---------------------------------------------------------------------------
  outputs:
    enabled: true
    size: 100Gi  # Generated images accumulate quickly
    storageClassName: ""  # Empty = default storage class
    accessMode: ReadWriteOnce
    # Optional: Use existing PVC instead of creating new one
    existingClaim: ""
    # Mount path for outputs
    mountPath: "/outputs"

  # ---------------------------------------------------------------------------
  # Shared Storage - NFS/SMB for easy file access
  # ---------------------------------------------------------------------------
  shared:
    enabled: false
    # Share type: nfs or smb
    type: "nfs"
    # NFS configuration
    nfs:
      server: "192.168.1.100"  # NFS server IP or hostname
      path: "/mnt/ai-outputs"  # NFS export path
      # Optional: Mount options
      mountOptions:
        - "nfsvers=4.1"
        - "rsize=1048576"
        - "wsize=1048576"
    # SMB/CIFS configuration
    smb:
      server: "//192.168.1.100/ai-outputs"  # SMB share path
      # Credentials stored in secret
      secretName: "smb-credentials"  # Create secret with username/password
      # Optional: Mount options
      mountOptions:
        - "vers=3.0"
        - "dir_mode=0777"
        - "file_mode=0666"
    # Mount path for shared storage
    mountPath: "/shared"
    # Link shared storage to outputs (symlink /outputs to /shared/outputs)
    linkToOutputs: true

# =============================================================================
# Resource Configuration
# =============================================================================
resources:
  # GPU-enabled: Lower CPU/memory requirements as GPU handles heavy lifting
  gpuOptimized:
    requests:
      cpu: "2"
      memory: "8Gi"
    limits:
      cpu: "4"
      memory: "16Gi"

  # CPU-only: Higher requirements as CPU does all processing
  cpuOnly:
    requests:
      cpu: "4"
      memory: "16Gi"
    limits:
      cpu: "8"
      memory: "32Gi"

# =============================================================================
# Advanced Configuration
# =============================================================================

# Init container to download default models
initModels:
  enabled: true
  # List of models to download on first startup
  models:
    # Stable Diffusion v1.5 (4GB)
    - url: "https://huggingface.co/runwayml/stable-diffusion-v1-5/resolve/main/v1-5-pruned-emaonly.safetensors"
      filename: "sd_v1-5.safetensors"
    # Optional: Add more models
    # - url: "https://civitai.com/api/download/models/..."
    #   filename: "model.safetensors"

# Security Context
securityContext:
  runAsNonRoot: false  # Stable Diffusion UIs typically run as root
  runAsUser: 0
  fsGroup: 0
  capabilities:
    drop:
      - ALL

# Node affinity for architecture
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/arch
          operator: In
          values:
          - amd64  # Stable Diffusion optimized for x86_64

# Tolerations for GPU nodes
tolerations: []
# Example GPU toleration:
# - key: nvidia.com/gpu
#   operator: Exists
#   effect: NoSchedule

# =============================================================================
# Observability (Optional)
# =============================================================================
observability:
  enabled: false
  # OpenTelemetry endpoint
  otlpEndpoint: "http://opentelemetry-collector.suse-observability.svc.cluster.local:4318"
  # Collect GPU metrics
  collectGpuStats: true

# =============================================================================
# Additional Settings
# =============================================================================

# Environment variables passed to container
env: []
# Example:
# - name: CUSTOM_VAR
#   value: "custom-value"

# Extra volumes to mount
extraVolumes: []
# Example:
# - name: custom-config
#   configMap:
#     name: my-config

# Extra volume mounts
extraVolumeMounts: []
# Example:
# - name: custom-config
#   mountPath: /etc/config

# =============================================================================
# Ingress Configuration (Optional)
# =============================================================================
ingress:
  enabled: false
  className: ""  # Ingress class (e.g., nginx, traefik)
  annotations: {}
  # Example annotations:
  # cert-manager.io/cluster-issuer: letsencrypt-prod
  # nginx.ingress.kubernetes.io/ssl-redirect: "true"
  # nginx.ingress.kubernetes.io/proxy-body-size: "0"
  hosts:
    - host: stable-diffusion.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # Example TLS configuration:
  # - secretName: stable-diffusion-tls
  #   hosts:
  #     - stable-diffusion.example.com
