apiVersion: v2
name: openshell-gateway
description: NVIDIA OpenShell gateway (control plane for agent sandboxes; creates no sandbox itself) with lab defaults and a Rancher install form. Vendors the official NVIDIA chart oci://ghcr.io/nvidia/openshell/helm-chart 0.1.5 in charts/helm-chart, with nvidia-chart.patch applied.
type: application
version: 0.1.7
appVersion: 0.1.5
keywords: [openshell, nvidia, sandbox, ai-agents, suse-ai-factory]
home: https://github.com/wiredquill/can-i
sources:
  - https://github.com/NVIDIA/OpenShell
dependencies:
  - name: helm-chart
    alias: openshell
    version: 0.1.5
    # vendored (charts/helm-chart-0.1.5.tgz, from oci://ghcr.io/nvidia/openshell
    # plus nvidia-chart.patch): rebuild with scripts/vendor-openshell-chart.sh,
    # never `helm dependency update`, which would drop the patch
    repository: ""
maintainers:
  - name: WiredQuill
    url: https://github.com/wiredquill
annotations:
  catalog.cattle.io/display-name: OpenShell 2 - Gateway
  catalog.cattle.io/release-name: openshell
