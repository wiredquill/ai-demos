questions:
- variable: openshell.server.auth.allowUnauthenticatedUsers
  label: Allow unauthenticated users (lab only)
  group: Access
  type: boolean
  default: true
  description: >-
    Accept CLI calls that present the gateway's client certificate without an OIDC login.
    Needed for the can-i client and for the lab's kubectl port-forward. Unsafe on shared clusters:
    anyone who can read the openshell-client-tls Secret can run sandboxes.
- variable: openshell.server.telemetryEnabled
  label: Send anonymous telemetry to NVIDIA
  group: Access
  type: boolean
  default: false
- variable: openshell.service.type
  label: Gateway Service type
  group: External access
  type: enum
  default: ClusterIP
  options: [ClusterIP, NodePort, LoadBalancer]
  description: >-
    How the openshell CLI outside the cluster reaches the gateway (gRPC over mTLS on 8080).
    ClusterIP: through kubectl port-forward svc/openshell 17680:8080, as the lab's setup.sh does.
    NodePort / LoadBalancer: directly; also put that address in the certificate names below.
    Sandboxes themselves are never exposed: you reach them through the gateway
    (openshell sandbox connect / forward).
- variable: openshell.service.nodePort
  label: Gateway NodePort
  group: External access
  type: int
  default: ""
  min: 30000
  max: 32767
  show_if: "openshell.service.type=NodePort"
  description: Blank = assigned by Kubernetes.
- variable: openshell.pkiInitJob.extraServerSans
  label: Extra certificate names
  group: External access
  type: string
  default: ""
  description: >-
    Comma-separated IPs and hostnames the CLI will dial, e.g. 10.0.9.50,openshell.lab.example.com
    (a node IP for NodePort, the load balancer address for LoadBalancer). Not needed for port-forward.
    Applied when the certificate is first created; to change it later, delete the
    openshell-server-tls Secret and upgrade.
- variable: openshell.sandbox.image.repository
  label: Default sandbox image
  group: Sandbox defaults
  type: enum
  default: ghcr.io/wiredquill/openshell-lab/leap
  options:
    - ghcr.io/wiredquill/openshell-lab/leap
    - ghcr.io/wiredquill/can-i
    - ghcr.io/wiredquill/can-i-opensuse
    - ghcr.io/wiredquill/can-i-nvidia
    - nvcr.io/nvidia/base/ubuntu
  description: >-
    Only a default: this app creates no sandbox. Used when openshell sandbox create has no --from;
    the can-i and Hermes sandbox apps always pick their own image.
    openshell-lab/leap is the lab's openSUSE Leap 16 image; the can-i images are SUSE BCI, openSUSE Leap 16
    and NVIDIA base Ubuntu 24.04; nvcr.io/nvidia/base/ubuntu is NVIDIA's chart default.
- variable: openshell.sandbox.image.tag
  label: Default sandbox image tag
  group: Sandbox defaults
  type: string
  default: "16.0"
  description: "16.0 for openshell-lab/leap, latest for the can-i images, 24.04 for nvcr.io/nvidia/base/ubuntu."
- variable: openshell.server.sandboxNamespace
  label: Sandbox namespace
  group: Sandbox defaults
  type: string
  default: ""
  description: Namespace for sandbox pods. Leave blank to use this app's namespace.
- variable: openshell.server.defaultRuntimeClassName
  label: Default RuntimeClass
  group: Sandbox defaults
  type: string
  default: ""
  description: Applied to sandboxes that don't set one, e.g. nvidia for GPU sandboxes or kata-containers. Blank = cluster default.
- variable: openshell.server.dataStorageSize
  label: Gateway database volume size
  group: Storage
  type: string
  default: ""
  description: SQLite volume for sandbox records and policies, e.g. 5Gi. Blank = 1Gi.
- variable: openshell.server.dataStorageClass
  label: Gateway database StorageClass
  group: Storage
  type: storageclass
  default: ""
  description: Blank = cluster default StorageClass.
- variable: openshell.server.logLevel
  label: Log level
  group: Advanced
  type: enum
  default: info
  options: [error, warn, info, debug, trace]
- variable: openshell.agentSandbox.preflight.enabled
  label: Check for the Agent Sandbox CRDs before installing
  group: Advanced
  type: boolean
  default: true
  description: Turn off when the Agent Sandbox controller is being installed at the same time (the blueprint does this).
