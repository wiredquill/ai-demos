# Generated by scripts/gen-ai-compare-upstream.py from charts/ai-compare - edit there and re-run.
questions:
# Telemetry
- variable: observability.enabled
  group: General
  label: "Enable OpenTelemetry"
  description: "Send GenAI traces, metrics and token/cost data from the app, Ollama and Open WebUI to an OpenTelemetry collector, and emit SUSE AI health-check spans. Needs a collector in the cluster (see Observability)."
  type: boolean
  default: true

- variable: kubewarden.sbomWorkloadScan
  group: General
  label: "Enable Kubewarden SBOM Scanning"
  description: "Label the install namespace sbomscanner.kubewarden.io/workloadscan=true so Kubewarden SBOMscanner scans this app's images for CVEs. The label stays on the namespace after uninstall."
  type: boolean
  default: true

# General Configuration
- variable: ollama.enabled
  group: General
  label: "Enable Ollama Deployment"
  description: "If true, Ollama will be deployed as part of this chart."
  type: "boolean"
  default: true

- variable: ollama.url
  label: "Ollama URL"
  type: string
  description: "URL of an existing Ollama, e.g. the SUSE AI Ollama application installed separately - include http:// and port."
  required: true
  default: "http://ollama-service:11434"
  group: General
  show_if: "ollama.enabled=false"

- variable: observability.mode
  label: "Telemetry Collector"
  description: "Where the apps send telemetry. existing (default): the cluster's shared SUSE AI collector (opentelemetry-collector in namespace observability, installed from the ai-observability-collector chart). It builds the SUSE AI view for every app in the cluster, so the app, Ollama, the model, Open WebUI and Pipelines all appear with health. operator: create a separate SUSE AI collector just for this release. Only needed on clusters without the shared SUSE AI collector; requires the OpenTelemetry Operator."
  type: enum
  options:
    - "existing"
    - "operator"
  default: "existing"
  group: Observability
  show_if: "observability.enabled=true"

- variable: aiCompare.observability.otlpEndpoint
  label: "OTLP Endpoint (optional)"
  type: string
  description: "Leave blank to auto-discover the shared OpenTelemetry collector at install time. Set an explicit URL (e.g. http://my-collector.observability.svc.cluster.local:4318) only to override discovery."
  required: false
  default: "http://opentelemetry-collector.observability.svc.cluster.local:4318"
  group: Observability
  show_if: "observability.enabled=true && observability.mode=existing"

- variable: opentelemetry.operator.suseObservability.apiUrl
  label: "SUSE Observability URL"
  description: "Base URL of SUSE Observability, used by the topology exporter. Example: https://observability.example.com"
  type: string
  required: true
  default: ""
  group: Observability
  show_if: "observability.enabled=true && observability.mode=operator"

- variable: opentelemetry.operator.suseObservability.otlpEndpoint
  label: "SUSE Observability OTLP Endpoint"
  description: "OTLP gRPC ingestion endpoint as host:port, no scheme. Example: otlp-observability.example.com:443"
  type: string
  required: true
  default: ""
  group: Observability
  show_if: "observability.enabled=true && observability.mode=operator"

- variable: opentelemetry.operator.clusterName
  label: "Cluster Name in SUSE Observability"
  description: "Optional. Defaults to the Rancher cluster name."
  type: string
  required: false
  default: ""
  group: Observability
  show_if: "observability.enabled=true && observability.mode=operator"

- variable: opentelemetry.operator.suseObservability.existingSecret
  label: "API Key Secret (optional)"
  description: "Secret in this namespace holding the SUSE Observability API key (key API_KEY). Leave blank to copy open-telemetry-collector from the observability namespace at install time."
  type: string
  required: false
  default: ""
  group: Observability
  show_if: "observability.enabled=true && observability.mode=operator"

- variable: ollama.gpu.enabled
  group: General
  label: "Enable GPU Acceleration"
  description: "Requires a node with NVIDIA or AMD drivers and the k8s device plugin installed."
  type: "boolean"
  default: true

- variable: ollama.hardware.type
  group: General
  label: "GPU Vendor"
  description: "Select the GPU vendor. NVIDIA requires the NVIDIA device plugin and runtimeClass. AMD requires the AMD ROCm device plugin (amd.com/gpu)."
  type: "enum"
  default: "nvidia"
  show_if: "ollama.gpu.enabled=true"
  options:
    - "nvidia"
    - "amd"

- variable: frontend.loadSimulator.enabled
  group: General
  label: "Enable Load Generator"
  description: "Deploy a load generator that sends a prompt to the app on an interval. Can also be started and stopped from the app UI."
  type: "boolean"
  default: true

- variable: frontend.loadSimulator.intervalSeconds
  label: "Load Generation Interval (seconds)"
  type: int
  default: 60
  description: "Keep at 60 or lower: SUSE AI components expire ~2 minutes after their last telemetry."
  required: true
  group: General
  show_if: "frontend.loadSimulator.enabled=true"

- variable: aiCompare.service.type
  group: General
  label: "AI Compare Service Type"
  description: "Method to expose the AI Compare service."
  type: "enum"
  required: true
  default: "NodePort"
  options:
    - "ClusterIP"
    - "NodePort"
    - "LoadBalancer"

- variable: aiCompare.service.nodePort
  group: General
  label: "AI Compare NodePort (UI)"
  description: "NodePort for the UI (port 7860). Leave blank for the edition default: 31705 for suse, 31701 for upstream."
  type: "int"
  show_if: "aiCompare.service.type=NodePort"

- variable: aiCompare.service.httpApiNodePort
  group: General
  label: "AI Compare NodePort (HTTP API)"
  description: "NodePort for the HTTP API (port 8080). Leave blank for the edition default: 31706 for suse, 31702 for upstream."
  type: "int"
  show_if: "aiCompare.service.type=NodePort"

- variable: neuvector.enabled
  group: General
  label: "Enable SUSE Security (NeuVector)"
  description: "Deploy NeuVector network security rules and DLP sensors for security demos. Uses declarative YAML configuration."
  type: "boolean"
  default: false

# Ollama Deployment Configuration
- variable: ollama.models.main
  group: "Ollama Deployment"
  label: "Ollama Model"
  description: "The Ollama model to pull and use for inference."
  type: "string"
  default: "llama3.2:latest"
  required: true
  show_if: "ollama.enabled=true"

- variable: ollama.service.type
  group: "Ollama Deployment"
  label: "Ollama Service Type"
  description: "Method to expose the Ollama service. 'ClusterIP' is recommended."
  type: "enum"
  required: true
  default: "ClusterIP"
  show_if: "ollama.enabled=true"
  options:
    - "ClusterIP"
    - "NodePort"
    - "LoadBalancer"

- variable: ollama.persistence.enabled
  group: "Ollama Deployment"
  label: "Enable Ollama Model Persistence"
  description: "If true, a PersistentVolumeClaim will be created to store Ollama models so they are not re-downloaded on restart."
  type: "boolean"
  default: true
  show_if: "ollama.enabled=true"

- variable: ollama.persistence.size
  group: "Ollama Deployment"
  label: "Ollama Model Storage Size"
  description: "The size of the PersistentVolumeClaim for Ollama models (e.g., '10Gi', '50Gi')."
  type: "string"
  default: "10Gi"
  show_if: "ollama.enabled=true && ollama.persistence.enabled=true"

- variable: ollama.persistence.storageClassName
  group: "Ollama Deployment"
  label: "Ollama Model Storage Class Name"
  description: "The storage class name for the Ollama models PVC. Leave empty to use the default storage class."
  type: "string"
  default: ""
  show_if: "ollama.enabled=true && ollama.persistence.enabled=true"

- variable: ollama.modelCache.nfs.enabled
  group: "Ollama Deployment"
  label: "Enable NFS Model Cache"
  description: "Mount an NFS share to cache Ollama models across deployments and avoid re-downloading."
  type: "boolean"
  default: false
  show_if: "ollama.enabled=true"

- variable: ollama.modelCache.nfs.server
  group: "Ollama Deployment"
  label: "NFS Server"
  description: "IP address or hostname of the NFS server."
  type: "string"
  default: ""
  show_if: "ollama.enabled=true && ollama.modelCache.nfs.enabled=true"

- variable: ollama.modelCache.nfs.path
  group: "Ollama Deployment"
  label: "NFS Share Path"
  description: "Path on the NFS server to use for caching models (e.g., '/data/ai-models')."
  type: "string"
  default: "/data/ai-models"
  show_if: "ollama.enabled=true && ollama.modelCache.nfs.enabled=true"

# Ollama Resources - GPU mode (shown when GPU enabled on General page)
- variable: ollama.resources.requests.cpu
  group: "Ollama Resources"
  label: "Ollama CPU Request"
  description: "CPU request for Ollama. GPU acceleration reduces CPU dependency."
  type: "string"
  default: "1"
  show_if: "ollama.enabled=true && ollama.gpu.enabled=true"

- variable: ollama.resources.requests.memory
  group: "Ollama Resources"
  label: "Ollama Memory Request"
  description: "Memory request for Ollama in GPU mode."
  type: "string"
  default: "4Gi"
  show_if: "ollama.enabled=true && ollama.gpu.enabled=true"

- variable: ollama.resources.limits.cpu
  group: "Ollama Resources"
  label: "Ollama CPU Limit"
  description: "CPU limit for Ollama in GPU mode."
  type: "string"
  default: "2"
  show_if: "ollama.enabled=true && ollama.gpu.enabled=true"

- variable: ollama.resources.limits.memory
  group: "Ollama Resources"
  label: "Ollama Memory Limit"
  description: "Memory limit for Ollama in GPU mode."
  type: "string"
  default: "8Gi"
  show_if: "ollama.enabled=true && ollama.gpu.enabled=true"

# Ollama Resources - CPU-only mode (shown when GPU disabled on General page)
- variable: ollama.resourcesCpuOnly.requests.cpu
  group: "Ollama Resources"
  label: "Ollama CPU Request"
  description: "CPU request for Ollama in CPU-only mode (higher allocation required without GPU)."
  type: "string"
  default: "2"
  show_if: "ollama.enabled=true && ollama.gpu.enabled=false"

- variable: ollama.resourcesCpuOnly.requests.memory
  group: "Ollama Resources"
  label: "Ollama Memory Request"
  description: "Memory request for Ollama in CPU-only mode."
  type: "string"
  default: "8Gi"
  show_if: "ollama.enabled=true && ollama.gpu.enabled=false"

- variable: ollama.resourcesCpuOnly.limits.cpu
  group: "Ollama Resources"
  label: "Ollama CPU Limit"
  description: "CPU limit for Ollama in CPU-only mode."
  type: "string"
  default: "2"
  show_if: "ollama.enabled=true && ollama.gpu.enabled=false"

- variable: ollama.resourcesCpuOnly.limits.memory
  group: "Ollama Resources"
  label: "Ollama Memory Limit"
  description: "Memory limit for Ollama in CPU-only mode."
  type: "string"
  default: "8Gi"
  show_if: "ollama.enabled=true && ollama.gpu.enabled=false"
