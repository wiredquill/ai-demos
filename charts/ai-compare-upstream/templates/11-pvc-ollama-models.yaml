{{- /*
Only when the PVC is actually mounted: with the NFS model cache enabled the
Ollama deployment mounts NFS in its place, and an unconsumed PVC on a
WaitForFirstConsumer StorageClass (e.g. local-path) never binds, which hangs
"helm install --wait" (Rancher Apps) until it times out.
*/}}
{{- if and .Values.ollama.enabled .Values.ollama.persistence.enabled (not .Values.ollama.modelCache.nfs.enabled) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ai-compare.fullname" . }}-ollama-models-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.ollama.persistence.size }}
  {{- if .Values.ollama.persistence.storageClassName }}
  storageClassName: {{ .Values.ollama.persistence.storageClassName }}
  {{- end }}
{{- end }}
