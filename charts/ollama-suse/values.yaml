# Default values for ollama-suse wrapper chart
# This passes through to the SUSE Application Collection ollama chart

# Global SUSE configuration
global:
  cattle:
    systemDefaultRegistry: ""

# Enterprise resource configuration - CPU and memory allocations
# These are merged with GPU resources when gpu.enabled=true
resources:
  requests:
    memory: "4Gi"
    cpu: "2000m"
  limits:
    memory: "16Gi"
    cpu: "8000m"

# Persistent volume configuration for Ollama data
persistentVolume:
  enabled: true
  size: "100Gi"
  storageClass: "suse-csi"

# Ollama configuration for SUSE Application Collection
ollama:
  # Port configuration
  port: 11434

  # GPU configuration - automatically applies to deployment resources
  gpu:
    enabled: true
    type: "nvidia"
    number: 1
    nvidiaResource: "nvidia.com/gpu"

  # Models to pull/run at startup
  models:
    pull: []
    run: []

  # Image configuration (SUSE Application Collection)
  image:
    repository: registry.suse.com/bci/ollama
    tag: latest
    pullPolicy: IfNotPresent
