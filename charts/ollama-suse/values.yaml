# Default values for ollama-suse wrapper chart
# This passes through to the SUSE Application Collection ollama chart

# Global SUSE configuration
global:
  cattle:
    systemDefaultRegistry: ""

ollama:
  # SUSE-specific configuration
  auth:
    required: false

  compliance:
    enabled: true

  support:
    level: "enterprise"

  # Service configuration
  service:
    type: ClusterIP
    port: 11434

  # Enterprise resource configuration (larger defaults)
  resources:
    requests:
      memory: "4Gi"
      cpu: "2000m"
    limits:
      memory: "16Gi"
      cpu: "8000m"

  # GPU configuration with SUSE support
  gpu:
    enabled: false
    vendor: "nvidia"
    driver:
      version: "latest"
    resources:
      limits: 1

  # Storage configuration with enterprise defaults
  persistence:
    enabled: true
    size: "100Gi"
    storageClass: "suse-csi"
    backup:
      enabled: false

  # Model configuration with SUSE registry
  models:
    registry:
      url: "registry.suse.com"
      auth:
        enabled: false
    autoDownload: []
    validation:
      enabled: true

  # Networking with enterprise defaults
  ingress:
    enabled: false
    className: "nginx"
    host: "ollama.enterprise.local"
    tls:
      enabled: true
      certificateManager: "cert-manager"

  # Enhanced security (SUSE hardened)
  security:
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    seccompProfile: "RuntimeDefault"
    selinux:
      enabled: true

  # Network policies for isolation
  networkPolicy:
    enabled: true

  # Pod Security Standards
  podSecurityStandards:
    enforce: "restricted"

  # SUSE Observability integration
  monitoring:
    enabled: true
    prometheus:
      enabled: true
    grafana:
      dashboard: true
    alerts:
      enabled: true

  # Structured logging
  logging:
    level: "info"
    format: "json"
    audit:
      enabled: true

  # Data protection
  backup:
    enabled: false
    schedule: "0 2 * * *"
    retention:
      days: 30

  # Image configuration (SUSE Application Collection)
  image:
    repository: registry.suse.com/bci/ollama
    tag: latest
    pullPolicy: IfNotPresent
