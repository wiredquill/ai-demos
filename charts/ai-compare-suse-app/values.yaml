# AI Compare app - a single-workload release of charts/ai-compare-suse.
#
# Every value of the base chart can be set under "aic:". Everything except this
# component's own workload is switched off; the shared fullnameOverride keeps
# the Service names (ai-compare-suse-*) the same as in the all-in-one install, so
# the components find each other in one namespace.
aic:
  fullnameOverride: ai-compare-suse
  aiCompare:
    enabled: true
  frontend:
    loadSimulator:
      enabled: false
  ollama:
    enabled: false
    url: http://ollama-service:11434
  openWebui:
    enabled: false
    url: http://open-webui:80
  pipelines:
    enabled: false
    url: http://pipelines-service:9099
  imagePullSecrets: []
