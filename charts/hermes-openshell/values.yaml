# Hermes Agent as an OpenShell sandbox. A small client pod (the openshell CLI)
# creates the sandbox through the gateway, then forwards Hermes's browser
# terminal to a Service. Install into the same namespace as openshell-gateway.

# What the sandbox may do: lockdown | research | developer | dangerous.
# Each is a policy file in profiles/ (see README.md for what each allows).
profile: research

# Hermes's own command approvals for each profile (approvals.mode in its
# config): manual = ask before every risky command, smart = auto-approve
# low-risk ones, off = never ask.
approvals:
  lockdown: manual
  research: smart
  developer: smart
  dangerous: "off"

sandbox:
  # Sandbox name in OpenShell (`openshell sandbox get <name>`). The sandbox pod,
  # which runs the workload and the OpenShell supervisor, is named after it.
  name: hermes-sandbox
  # The SUSE OS the sandbox runs: suse | opensuse | custom
  image: suse
  images:
    suse: ghcr.io/wiredquill/hermes-openshell:latest              # SUSE BCI 16
    opensuse: ghcr.io/wiredquill/hermes-openshell-opensuse:latest # openSUSE Leap 16.0
  # Used when image is "custom". Must be built like images/hermes (hermes,
  # ttyd and hermes-sandbox-start, user 10001, home /home/hermes).
  customImage: ""
  # Request a GPU for the sandbox (needs a GPU node and RuntimeClass).
  gpu: false
  # Delete and recreate the sandbox when the client pod restarts, so profile,
  # image and model changes in this form take effect. Off = reuse a running
  # sandbox (and its chat history and files).
  recreate: true

model:
  # vllm = the SUSE vLLM router in this namespace (hermes-openshell-vllm
  # blueprint, or your own install). external = any OpenAI-compatible API.
  backend: vllm
  vllm:
    url: http://vllm-router-service/v1
    # Must match the vllm component's modelURL.
    name: Qwen/Qwen2.5-7B-Instruct
  external:
    url: https://openrouter.ai/api/v1
    name: nousresearch/hermes-4-70b
    # The key is handed to the OpenShell gateway, which injects it only into
    # requests to this URL's host; the sandbox sees a placeholder. Set one:
    apiKey: ""
    # ... or an existing Secret in this namespace.
    existingSecret: ""
    existingSecretKey: api-key

# Hermes itself, on the form's "Hermes options" page.
hermes:
  # Display skin for each profile. SUSE brand skins (in the image's
  # /opt/hermes/skins): suse-dark, suse-light. Hermes built-ins: default, ares,
  # mono, slate, daylight, warm-lightmode, poseidon, sisyphus, charizard.
  skins:
    lockdown: mono
    research: poseidon
    developer: slate
    dangerous: charizard
  # Words that say which session this is, whatever the skin: the profile in
  # the prompt ("research ❯"), the response header and the browser tab title,
  # and a welcome line with what the profile allows and its approvals mode,
  # e.g. "Research session: read-only web (GET) to docs sites. Approvals:
  # smart." The branding fields below win over these.
  session:
    enabled: true
    welcome:
      lockdown: "Lockdown session: no network beyond the model."
      research: "Research session: read-only web (GET) to docs sites."
      developer: "Developer session: GitHub (clone, push, pull requests) and PyPI."
      dangerous: "DANGEROUS session: open internet, demo use only."
  # Replace the skin's text; blank keeps the skin's own (or the session's).
  branding:
    enabled: false
    agentName: ""      # banner title and status display
    welcome: ""        # shown at startup
    goodbye: ""        # shown on exit
    responseLabel: ""  # response box header
    promptSymbol: ""   # before the input prompt
    helpHeader: ""     # /help header
  # A Hermes cron job created when the sandbox starts, for steady demo traffic
  # (every run is a full agent turn: model calls, tokens, telemetry). Results
  # land in ~/.hermes/cron/output in the sandbox; `hermes cron list` shows it.
  cron:
    enabled: false
    name: token-traffic
    # cron expression, or Hermes's own "30m" / "every 2h"
    schedule: "* * * * *"
    prompt: >-
      Pick one short, simple question and answer it. Choose from: a basic
      arithmetic fact, a common word definition, or a quick general-knowledge
      fact. Answer in a single sentence. Keep it brief — this is just light
      token traffic, no tools needed.

# OpenTelemetry from the agent. OpenLit, in the sandbox image, instruments every
# model call Hermes makes (tokens, cost, latency, time to first token, errors,
# and the prompts and replies) and sends GenAI traces, metrics and logs over
# OTLP/HTTP. The sandbox's policy gets one more rule: the agent's python may
# POST to the collector's host and port, nothing else.
observability:
  enabled: true
  # OTLP/HTTP (4318) base URL. Blank = find the shared SUSE AI collector's
  # Service at install time (collectorNamespace, then observability and
  # suse-observability), else
  # http://opentelemetry-collector.observability.svc.cluster.local:4318.
  # Use a hostname: an explicit host rule in the sandbox policy can reach a
  # private address, a raw IP can't be allowed next to the profiles' host rules.
  otlpEndpoint: ""
  collectorNamespace: observability
  # service.name and OpenLit's application name.
  serviceName: hermes-agent
  # deployment.environment on all telemetry.
  environment: demo
  # Put prompts, replies and tool definitions in the spans. Off = only sizes,
  # tokens and timings.
  captureContent: true

gateway:
  # The openshell-gateway chart's Service and client certificate Secret.
  endpoint: https://openshell:8080
  tlsSecret: openshell-client-tls

client:
  image:
    repository: ghcr.io/wiredquill/hermes-openshell-client
    tag: latest
    pullPolicy: Always
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}

service:
  # NodePort: the terminal is on every node's IP without a port-forward.
  type: NodePort
  port: 80
  # Only for NodePort; blank = assigned by Kubernetes.
  nodePort: ""

imagePullSecrets: []
