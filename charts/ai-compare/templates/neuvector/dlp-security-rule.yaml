{{- if .Values.neuvector.enabled }}
apiVersion: neuvector.com/v1
kind: NvDlpSecurityRule
metadata:
  name: {{ include "ai-compare.fullname" . }}-dlp-rule
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-compare.labels" . | nindent 4 }}
spec:
  name: {{ include "ai-compare.fullname" . }}-dlp-rule
  comment: "DLP rule for AI Compare sensitive data detection (credit cards and SSN)"
  dlpMappingList:
    - name: sensitive-data
      patterns:
        - name: credit-card
          keywordPattern: '\b(?:\d[ -]*?){13,16}\b'
          context: content
          action: alert
        - name: ssn
          keywordPattern: '\b\d{3}-\d{2}-\d{4}\b'
          context: content
          action: alert
  groupSelector:
    - name: {{ .Release.Namespace }}.{{ include "ai-compare.fullname" . }}
{{- end }}
