# Adapted from SUSE's own maintained reference config:
# https://github.com/SUSE/suse-ai-observability-extension/blob/main/integrations/otel-collector/otel-values.yaml
# (fetched 2026-08-26, upstream last updated 2026-08-15). Kept as close to
# upstream as possible - naming, processor/pipeline structure, the image tag -
# so this stays diffable against SUSE's own reference instead of drifting into
# another hand-rolled bridge, which is what happened to the version of this
# file that predates this rewrite (custom keep-regexes, an extra
# transform/topology-provider step upstream doesn't have, no spanmetrics
# connector - the last of which is why the plain "Open Telemetry > Services"
# view showed pod/service names with no health, error-rate, duration, or rate
# data for anything).
#
# Deployed with the standard upstream Helm chart, not a SUSE-branded one:
#   helm upgrade open-telemetry-collector open-telemetry/opentelemetry-collector \
#     -n observability -f templates/otel-collector-values-suse-ai.yaml \
#     --version 0.165.0 --wait
# (an older doc in this repo, docs/rancher-ai-observability.md, references
# installing via oci://registry.suse.com/ai/charts/suse-ai-opentelemetry-collector
# instead - that path requires registry.suse.com credentials to even inspect,
# and the current upstream reference above doesn't use it either, so this
# file assumes the generic chart until that's confirmed to be the actively
# maintained path too.)
#
# Namespace and cluster name below are specific to this repo's hr-assistant
# demo - update K8S_CLUSTER_NAME and SUSE_AI_NAMESPACE for a different cluster
# or app namespace. The gpu-metrics and qdrant Prometheus jobs discover their
# targets dynamically (by pod/service label), so they need no per-install
# editing. The opensearch `elasticsearch` receiver endpoint is the one
# remaining static value that must be updated per install/reinstall - see the
# comment on it below for why and what to do about it.
global:
  imagePullSecrets:
  - application-collection
  - suse-registry
extraEnvs:
  - name: K8S_CLUSTER_NAME
    value: "dev-ai"
  - name: SUSE_AI_NAMESPACE
    value: "hr-assistant"
extraEnvsFrom:
  - secretRef:
      name: open-telemetry-collector
mode: deployment
clusterRole:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["pods", "nodes", "endpoints", "services"]
      verbs: ["get", "list", "watch"]
# Upstream's own comment: the productized registry.suse.com image isn't
# published at this collector version yet - ghcr.io/suse is the current
# official source.
image:
  repository: ghcr.io/suse/suse-ai-opentelemetry-collector
  tag: "0.156.0"
  pullPolicy: IfNotPresent
ports:
  metrics:
    enabled: true
presets:
  kubernetesAttributes:
    enabled: true
    extractAllPodLabels: true
config:
  receivers:
    elasticsearch:
      # Real deviation from upstream: our OpenSearch has security disabled (no
      # username/password) and runs at this release's actual service name,
      # not upstream's placeholder "opensearch-cluster-master-headless".
      #
      # UNLIKE the qdrant Prometheus job above, this endpoint CANNOT be made
      # dynamic - the elasticsearch receiver type takes one static URL, it has
      # no Kubernetes service-discovery support. Rancher's catalog install
      # gives hr-assistant a release name with a random/timestamp suffix
      # (e.g. hr-assistant-1-1787865324) that changes on every reinstall, so
      # this hostname WILL silently go stale (collector keeps running, just
      # stops reaching OpenSearch, no error) the next time hr-assistant is
      # redeployed under a new release name. Two ways to actually fix this,
      # neither of which is "remember to edit this file every time":
      #   1. (Recommended) Install hr-assistant with a fixed, predictable
      #      release name every time (e.g. always `hr-assistant`, not
      #      Rancher's auto-generated one) - then this hostname never changes.
      #   2. Set `fullnameOverride` in the hr-assistant chart's own values so
      #      its subresource names are stable regardless of release name.
      # If neither is possible, this line is the one thing that must be
      # updated by hand after every hr-assistant reinstall.
      endpoint: "http://hr-assistant-opensearch.hr-assistant.svc.cluster.local:9200"
      tls:
        insecure_skip_verify: true
      collection_interval: 10s
    prometheus:
      config:
        scrape_configs:
          # Serves GPU dashboards for other releases on this cluster;
          # hr-assistant itself doesn't enable GPU stats by default. Out of
          # scope for this file's own reconciliation against upstream.
          - job_name: 'gpu-metrics'
            scheme: http
            scrape_interval: 10s
            static_configs:
              - labels:
                  host: dev-ai-pool1-9tjr7-6d2rk
                  hostname: dev-ai-pool1-9tjr7-6d2rk
                  k8s_node_name: dev-ai-pool1-9tjr7-6d2rk
                  kubernetes_namespace: gpu-operator
                  kubernetes_node: dev-ai-pool1-9tjr7-6d2rk
                  node: dev-ai-pool1-9tjr7-6d2rk
                  service: nvidia-dcgm-exporter
                targets:
                  - nvidia-dcgm-exporter.gpu-operator.svc:9400
          - job_name: 'qdrant'
            scrape_interval: 10s
            metrics_path: '/metrics'
            # No keep filter on metric names: matches upstream exactly. The
            # SUSE AI StackPack actually deployed (2.1.0, not the older 1.5.0
            # tarball an earlier version of this file was built against) reads
            # specific metric names (rest_responses_total, memory_active_bytes,
            # etc.) whose exact set has already changed across StackPack
            # versions once - this is demo-scale cardinality, not worth
            # chasing a keep-regex in lockstep with every future StackPack
            # release.
            #
            # Real deviation from upstream (which uses a static_configs target
            # naming one specific release's Service): Rancher's catalog install
            # gives the hr-assistant release a name with a random/timestamp
            # suffix (e.g. hr-assistant-1-1787865324), which changes on every
            # reinstall. A hardcoded Service hostname here silently breaks
            # qdrant discovery the next time hr-assistant gets redeployed - the
            # collector keeps running with no errors, it just stops finding
            # the target. The qdrant Service always carries a stable
            # app.component=qdrant label regardless of release name, so
            # discover it dynamically instead of hardcoding the hostname. This
            # requires the collector's ClusterRole to include "services" (it
            # already does, above) and, if hr-assistant is ever installed
            # outside the "hr-assistant" namespace, add that namespace to
            # `namespaces.names` below (or drop the `namespaces:` key entirely
            # to discover across all namespaces, matching only on the label).
            kubernetes_sd_configs:
              - role: service
                namespaces:
                  names:
                    - hr-assistant
            relabel_configs:
              - action: keep
                source_labels: [__meta_kubernetes_service_label_app_component]
                regex: qdrant
              - action: replace
                source_labels: [__address__]
                regex: '([^:]+)(?::\d+)?'
                replacement: '$1:6333'
                target_label: __address__
          - job_name: 'vllm'
            scrape_interval: 10s
            metrics_path: '/metrics'
            # vLLM's native metrics (vllm:prompt_tokens_total, vllm:generation_tokens_total,
            # vllm:time_to_first_token_seconds, vllm:gpu_cache_usage_perc, ...) are
            # scraped straight off the engine, no proxy/sidecar required. The
            # hr-assistant-vllm chart's vendored vllm subchart renders a dedicated
            # `<release>-engine-scrape` Service (extraObjects in
            # charts/hr-assistant-vllm/values.yaml) carrying the stable
            # app.kubernetes.io/part-of=vllm label and already exposing port 80
            # (the engine's OpenAI-compatible + /metrics port) - same
            # release-name-independent discovery approach as the qdrant job above,
            # and for the same reason (Rancher's catalog install gives the release
            # a random/timestamp suffix that changes on every reinstall).
            kubernetes_sd_configs:
              - role: service
                namespaces:
                  names:
                    - hr-assistant-vllm
            relabel_configs:
              - action: keep
                source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_part_of]
                regex: vllm
            # vllm: -> vllm_ so SUSE Observability accepts the names (metric names
            # with colons are rejected/silently dropped by some backends).
            metric_relabel_configs:
              - source_labels: [__name__]
                regex: 'vllm:(.*)'
                target_label: __name__
                replacement: 'vllm_${1}'
  exporters:
    topology:
      # Real deviation from upstream: SUSE Observability runs on a separate
      # cluster (mort), not co-located with dev-ai, so this points at the
      # real external endpoint instead of upstream's in-cluster placeholder.
      endpoint: https://observability.mort.dna-42.com
      api_key: ${env:API_KEY}
      namespace: ${env:SUSE_AI_NAMESPACE}
      cluster_name: ${env:K8S_CLUSTER_NAME}
      tls:
        insecure_skip_verify: true
    otlp:
      endpoint: otlp-observability.mort.dna-42.com:443
      headers:
        Authorization: "SUSEObservability ${env:API_KEY}"
      tls:
        insecure: false
    debug:
      verbosity: basic
  processors:
    resource/opensearch:
      attributes:
        - key: suse.ai.managed
          value: "true"
          action: insert
        - key: suse.ai.component.name
          value: "opensearch"
          action: insert
        - key: suse.ai.component.type
          value: "search-engine"
          action: insert
        - key: service.name
          value: "opensearch"
          action: insert
        - key: service.namespace
          value: ${env:SUSE_AI_NAMESPACE}
          action: insert
        - key: k8s.namespace.name
          value: ${env:SUSE_AI_NAMESPACE}
          action: upsert
        - key: service.instance.id
          value: "opensearch-cluster"
          action: insert
    transform/qdrant:
      error_mode: ignore
      metric_statements:
        - context: resource
          statements:
            - set(attributes["suse.ai.managed"], "true") where attributes["service.name"] == "qdrant"
            - set(attributes["suse.ai.component.name"], "qdrant") where attributes["service.name"] == "qdrant"
            - set(attributes["suse.ai.component.type"], "vectordb") where attributes["service.name"] == "qdrant"
            - set(attributes["k8s.namespace.name"], attributes["service.namespace"]) where attributes["service.name"] == "qdrant" and attributes["service.namespace"] != nil
            - set(attributes["k8s.namespace.name"], "${env:SUSE_AI_NAMESPACE}") where attributes["service.name"] == "qdrant" and attributes["service.namespace"] == nil
    # Tags the vLLM engine's own native /metrics scrape (job "vllm" above) as
    # the same suse.ai.component.type=inference-engine the app-level gen_ai.*
    # path (transform/infer-providers, below) already creates for it, so both
    # sources of vLLM telemetry overlay one topology node instead of two. The
    # Prometheus receiver maps the scrape job's `job` label to the service.name
    # resource attribute automatically (same mechanism transform/qdrant relies
    # on above), so no relabeling is needed to get service.name=="vllm" here.
    transform/vllm:
      error_mode: ignore
      metric_statements:
        - context: resource
          statements:
            - set(attributes["suse.ai.managed"], "true") where attributes["service.name"] == "vllm"
            - set(attributes["suse.ai.component.name"], "vllm") where attributes["service.name"] == "vllm"
            - set(attributes["suse.ai.component.type"], "inference-engine") where attributes["service.name"] == "vllm"
            - set(attributes["k8s.namespace.name"], attributes["service.namespace"]) where attributes["service.name"] == "vllm" and attributes["service.namespace"] != nil
            - set(attributes["k8s.namespace.name"], "${env:SUSE_AI_NAMESPACE}") where attributes["service.name"] == "vllm" and attributes["service.namespace"] == nil
    tail_sampling:
      decision_wait: 10s
      policies:
      - name: rate-limited-composite
        type: composite
        composite:
          max_total_spans_per_second: 500
          policy_order: [errors, slow-traces, rest]
          composite_sub_policy:
          - name: errors
            type: status_code
            status_code:
              status_codes: [ ERROR ]
          - name: slow-traces
            type: latency
            latency:
              threshold_ms: 1000
          - name: rest
            type: always_sample
          rate_allocation:
          - policy: errors
            percent: 33
          - policy: slow-traces
            percent: 33
          - policy: rest
            percent: 34
    resource:
      attributes:
      - key: k8s.cluster.name
        action: insert
        value: ${env:K8S_CLUSTER_NAME}
      - key: service.instance.id
        from_attribute: k8s.pod.uid
        action: insert
    filter/genai-metrics-only:
      error_mode: ignore
      metrics:
        metric:
          - not(IsMatch(name, "gen_ai\\..*"))
    groupbyattrs/infer-providers:
      keys:
        - gen_ai.provider.name
    transform/infer-providers:
      error_mode: ignore
      metric_statements:
        - context: resource
          statements:
            - set(attributes["service.name"], attributes["gen_ai.provider.name"]) where attributes["gen_ai.provider.name"] != nil
            - set(attributes["service.instance.id"], attributes["gen_ai.provider.name"]) where attributes["gen_ai.provider.name"] != nil
            - set(attributes["suse.ai.managed"], "true") where attributes["gen_ai.provider.name"] != nil
            - set(attributes["suse.ai.component.name"], attributes["gen_ai.provider.name"]) where attributes["gen_ai.provider.name"] != nil
            - set(attributes["suse.ai.component.type"], "inference-engine") where attributes["gen_ai.provider.name"] != nil
            - set(attributes["k8s.namespace.name"], attributes["service.namespace"]) where attributes["gen_ai.provider.name"] != nil and attributes["service.namespace"] != nil
            - set(attributes["k8s.namespace.name"], "${env:SUSE_AI_NAMESPACE}") where attributes["gen_ai.provider.name"] != nil and attributes["service.namespace"] == nil
    groupbyattrs/infer-models:
      keys:
        - gen_ai.request.model
        - gen_ai.provider.name
    transform/infer-models:
      error_mode: ignore
      metric_statements:
        - context: resource
          statements:
            - set(attributes["service.name"], attributes["gen_ai.request.model"]) where attributes["gen_ai.request.model"] != nil
            - set(attributes["service.instance.id"], attributes["gen_ai.request.model"]) where attributes["gen_ai.request.model"] != nil
            - set(attributes["suse.ai.managed"], "true") where attributes["gen_ai.request.model"] != nil
            - set(attributes["suse.ai.component.name"], attributes["gen_ai.request.model"]) where attributes["gen_ai.request.model"] != nil
            - set(attributes["suse.ai.component.type"], "llm-model") where attributes["gen_ai.request.model"] != nil
            - set(attributes["k8s.namespace.name"], attributes["service.namespace"]) where attributes["gen_ai.request.model"] != nil and attributes["service.namespace"] != nil
            - set(attributes["k8s.namespace.name"], "${env:SUSE_AI_NAMESPACE}") where attributes["gen_ai.request.model"] != nil and attributes["service.namespace"] == nil
    filter/exclude-already-tagged:
      error_mode: ignore
      metrics:
        resource:
          - attributes["suse.ai.component.name"] != nil
    transform/infer-applications:
      error_mode: ignore
      metric_statements:
        - context: resource
          statements:
            - set(attributes["suse.ai.managed"], "true")
            - set(attributes["suse.ai.component.type"], "application")
            - set(attributes["suse.ai.component.name"], attributes["service.name"])
            - set(attributes["k8s.namespace.name"], attributes["service.namespace"]) where attributes["service.namespace"] != nil
            - set(attributes["k8s.namespace.name"], "${env:SUSE_AI_NAMESPACE}") where attributes["service.namespace"] == nil
    filter/genai-spans:
      error_mode: ignore
      traces:
        span:
          - attributes["gen_ai.request.model"] == nil
    groupbyattrs/model-relations:
      keys:
        - gen_ai.provider.name
    transform/model-relations:
      error_mode: ignore
      trace_statements:
        - context: resource
          statements:
            - set(attributes["service.name"], attributes["gen_ai.provider.name"]) where attributes["gen_ai.provider.name"] != nil
            - set(attributes["service.instance.id"], attributes["gen_ai.provider.name"]) where attributes["gen_ai.provider.name"] != nil
        - context: span
          statements:
            - set(attributes["peer.service"], attributes["gen_ai.request.model"]) where attributes["gen_ai.request.model"] != nil
    transform/provider-relations:
      error_mode: ignore
      trace_statements:
        - context: span
          statements:
            - set(attributes["peer.service"], resource.attributes["gen_ai.provider.name"]) where resource.attributes["gen_ai.provider.name"] != nil
    # The topology exporter (traces/topology, below) has native, built-in
    # understanding of gen_ai.* resource attributes for the app -> engine ->
    # model chain - no relation transform is needed for that (confirmed:
    # traces/topology runs no gen_ai transform at all, yet those edges still
    # render). It has no equivalent built-in understanding of db.* semantic
    # convention attributes, so hr-policy-db's own Qdrant/OpenSearch calls
    # never produced an edge even though both components exist and are
    # healthy. This must run inside traces/topology's own processor list
    # (not a separate pipeline exporting elsewhere, e.g. to otlp) to actually
    # reach the topology exporter.
    transform/db-topology-relations:
      error_mode: ignore
      trace_statements:
        - context: span
          statements:
            - set(attributes["peer.service"], "qdrant") where attributes["db.system.name"] == "qdrant"
            - set(attributes["peer.service"], "opensearch") where IsMatch(attributes["server.address"], ".*opensearch.*") or IsMatch(attributes["net.peer.name"], ".*opensearch.*") or IsMatch(attributes["url.full"], ".*opensearch.*") or IsMatch(attributes["http.url"], ".*opensearch.*")
    filter/dropMissingK8sAttributes:
      error_mode: ignore
      traces:
        span:
          - resource.attributes["k8s.node.name"] == nil
          - resource.attributes["k8s.pod.uid"] == nil
          - resource.attributes["k8s.namespace.name"] == nil
          - resource.attributes["k8s.pod.name"] == nil
  connectors:
    # Feeds the plain "Open Telemetry > Services" view's Span error %/
    # duration/rate columns - the one thing upstream has that this repo's
    # config was missing entirely before this rewrite.
    spanmetrics:
      metrics_expiration: 5m
      namespace: otel_span
    routing/traces:
      error_mode: ignore
      table:
      - statement: route()
        pipelines: [traces/sampling, traces/spanmetrics, traces/model-relations, traces/provider-relations, traces/topology]
  service:
    extensions:
      - health_check
    pipelines:
      traces:
        receivers: [otlp, jaeger]
        processors: [filter/dropMissingK8sAttributes, memory_limiter, resource]
        exporters: [routing/traces]
      traces/spanmetrics:
        receivers: [routing/traces]
        processors: []
        exporters: [spanmetrics]
      traces/sampling:
        receivers: [routing/traces]
        processors: [tail_sampling, batch]
        exporters: [debug, otlp]
      metrics:
        receivers: [otlp, spanmetrics, prometheus]
        processors: [memory_limiter, transform/qdrant, transform/vllm, resource, batch]
        exporters: [debug, otlp]
      metrics/infer-providers:
        receivers: [otlp]
        processors: [filter/genai-metrics-only, groupbyattrs/infer-providers, transform/infer-providers, resource, batch]
        exporters: [otlp]
      metrics/infer-models:
        receivers: [otlp]
        processors: [filter/genai-metrics-only, groupbyattrs/infer-models, transform/infer-models, resource, batch]
        exporters: [otlp]
      metrics/infer-applications:
        receivers: [otlp]
        processors: [filter/genai-metrics-only, filter/exclude-already-tagged, transform/infer-applications, resource, batch]
        exporters: [otlp]
      traces/model-relations:
        receivers: [routing/traces]
        processors: [filter/genai-spans, groupbyattrs/model-relations, transform/model-relations, batch]
        exporters: [otlp]
      traces/provider-relations:
        receivers: [routing/traces]
        processors: [filter/genai-spans, transform/provider-relations, batch]
        exporters: [otlp]
      traces/topology:
        receivers: [routing/traces]
        processors: [transform/db-topology-relations, batch]
        exporters: [topology]
      metrics/opensearch:
        receivers: [elasticsearch]
        processors: [memory_limiter, resource/opensearch, resource, batch]
        exporters: [debug, otlp]
