clusterRole:
  create: true
  rules:
  - apiGroups:
    - ""
    resources:
    - pods
    - nodes
    - endpoints
    - services
    - namespaces
    verbs:
    - get
    - list
    - watch
config:
  connectors:
    routing/traces:
      error_mode: ignore
      table:
      - action: copy
        condition: "true"
        pipelines:
        - traces/sampling
        - traces/model-relations
        - traces/provider-relations
        - traces/topology
  exporters:
    debug:
      verbosity: basic
    otlp_grpc:
      endpoint: otlp-observability.mort.dna-42.com:443
      headers:
        Authorization: SUSEObservability ${env:API_KEY}
      tls:
        insecure: false
    topology:
      api_key: ${env:API_KEY}
      endpoint: https://observability.mort.dna-42.com
      namespace: ${env:SUSE_AI_NAMESPACE}
      tls:
        insecure_skip_verify: true
  processors:
    filter/exclude-already-tagged:
      error_mode: ignore
      metrics:
        resource:
        - attributes["suse.ai.component.name"] != nil
    filter/genai-metrics-only:
      error_mode: ignore
      metrics:
        metric:
        - not(IsMatch(name, "gen_ai\\..*"))
    filter/genai-spans:
      error_mode: ignore
      traces:
        span:
        - attributes["gen_ai.request.model"] == nil
    groupbyattrs/infer-models:
      keys:
      - gen_ai.request.model
      - gen_ai.provider.name
    groupbyattrs/infer-providers:
      keys:
      - gen_ai.provider.name
    groupbyattrs/model-relations:
      keys:
      - gen_ai.provider.name
    transform/infer-applications:
      error_mode: ignore
      metric_statements:
      - context: resource
        statements:
        - set(attributes["suse.ai.managed"], "true")
        - set(attributes["suse.ai.component.type"], "application")
        - set(attributes["suse.ai.component.name"], attributes["service.name"])
        - set(attributes["k8s.namespace.name"], attributes["service.namespace"]) where attributes["service.namespace"] != nil
        - set(attributes["k8s.namespace.name"], "${env:SUSE_AI_NAMESPACE}") where attributes["service.namespace"] == nil
    transform/infer-models:
      error_mode: ignore
      metric_statements:
      - context: resource
        statements:
        - set(attributes["service.name"], attributes["gen_ai.request.model"]) where
          attributes["gen_ai.request.model"] != nil
        - set(attributes["service.instance.id"], attributes["gen_ai.request.model"])
          where attributes["gen_ai.request.model"] != nil
        - set(attributes["suse.ai.managed"], "true") where attributes["gen_ai.request.model"]
          != nil
        - set(attributes["suse.ai.component.name"], attributes["gen_ai.request.model"])
          where attributes["gen_ai.request.model"] != nil
        - set(attributes["suse.ai.component.type"], "llm-model") where attributes["gen_ai.request.model"]
          != nil
        - set(attributes["k8s.namespace.name"], attributes["service.namespace"]) where attributes["gen_ai.request.model"] != nil and attributes["service.namespace"] != nil
        - set(attributes["k8s.namespace.name"], "${env:SUSE_AI_NAMESPACE}") where attributes["gen_ai.request.model"] != nil and attributes["service.namespace"] == nil
    transform/infer-providers:
      error_mode: ignore
      metric_statements:
      - context: resource
        statements:
        - set(attributes["service.name"], attributes["gen_ai.provider.name"]) where
          attributes["gen_ai.provider.name"] != nil
        - set(attributes["service.instance.id"], attributes["gen_ai.provider.name"])
          where attributes["gen_ai.provider.name"] != nil
        - set(attributes["suse.ai.managed"], "true") where attributes["gen_ai.provider.name"]
          != nil
        - set(attributes["suse.ai.component.name"], attributes["gen_ai.provider.name"])
          where attributes["gen_ai.provider.name"] != nil
        - set(attributes["suse.ai.component.type"], "inference-engine") where attributes["gen_ai.provider.name"]
          != nil
        - set(attributes["k8s.namespace.name"], attributes["service.namespace"]) where attributes["gen_ai.provider.name"] != nil and attributes["service.namespace"] != nil
        - set(attributes["k8s.namespace.name"], "${env:SUSE_AI_NAMESPACE}") where attributes["gen_ai.provider.name"] != nil and attributes["service.namespace"] == nil
    transform/topology-provider:
      error_mode: ignore
      trace_statements:
      - context: span
        statements:
        - set(attributes["gen_ai.provider.name"], resource.attributes["gen_ai.provider.name"]) where resource.attributes["gen_ai.provider.name"] != nil
        - set(attributes["gen_ai.request.model"], resource.attributes["gen_ai.request.model"]) where resource.attributes["gen_ai.request.model"] != nil
    transform/model-relations:
      error_mode: ignore
      trace_statements:
      - context: resource
        statements:
        - set(attributes["service.name"], attributes["gen_ai.provider.name"]) where
          attributes["gen_ai.provider.name"] != nil
        - set(attributes["service.instance.id"], attributes["gen_ai.provider.name"])
          where attributes["gen_ai.provider.name"] != nil
      - context: span
        statements:
        - set(attributes["peer.service"], attributes["gen_ai.request.model"]) where
          attributes["gen_ai.request.model"] != nil
    transform/provider-relations:
      error_mode: ignore
      trace_statements:
      - context: span
        statements:
        - set(attributes["peer.service"], resource.attributes["gen_ai.provider.name"])
          where resource.attributes["gen_ai.provider.name"] != nil
    # Qdrant scrape -> vector database component. The prometheus receiver sets
    # service.name to the job name ("qdrant"); this transform tags every metric
    # from that job with the SUSE AI component attributes so SUSE Observability
    # renders the component under "Vector Databases".
    transform/qdrant:
      error_mode: ignore
      metric_statements:
      - context: resource
        statements:
        - set(attributes["suse.ai.managed"], "true") where attributes["service.name"] == "qdrant"
        - set(attributes["suse.ai.component.name"], "qdrant") where attributes["service.name"] == "qdrant"
        - set(attributes["suse.ai.component.type"], "vectordb") where attributes["service.name"] == "qdrant"
        - set(attributes["service.instance.id"], "qdrant") where attributes["service.name"] == "qdrant"
        - set(attributes["k8s.namespace.name"], "${env:SUSE_AI_NAMESPACE}") where attributes["service.name"] == "qdrant" and attributes["k8s.namespace.name"] == nil
    # OpenSearch receiver -> search engine component. The elasticsearch receiver
    # emits metrics with service.name=elasticsearch; this resource processor
    # renames the component to opensearch and tags it as a search engine so
    # SUSE Observability renders it under "Search Engines".
    resource/opensearch:
      attributes:
      - key: suse.ai.managed
        value: "true"
        action: insert
      - key: suse.ai.component.name
        value: "opensearch"
        action: insert
      - key: suse.ai.component.type
        value: "search-engine"
        action: insert
      - key: service.name
        value: "opensearch"
        action: insert
      - key: service.instance.id
        value: "opensearch"
        action: insert
      - key: k8s.namespace.name
        value: "${env:SUSE_AI_NAMESPACE}"
        action: insert
  receivers:
    # OpenSearch — search engine component. The elasticsearch receiver polls the
    # OpenSearch REST API (_cluster/health, _nodes/stats) and emits
    # elasticsearch.* metrics; the resource/opensearch processor tags them with
    # suse.ai.component.type=search-engine so SUSE Observability renders the
    # component under "Search Engines".
    elasticsearch:
      endpoint: http://${env:SUSE_AI_RELEASE}-opensearch.${env:SUSE_AI_NAMESPACE}.svc.cluster.local:9200
      collection_interval: 15s
      # Demo OpenSearch runs with security disabled (single-node, no auth).
      tls:
        insecure_skip_verify: true
    prometheus:
      config:
        scrape_configs:
        - job_name: gpu-metrics
          scheme: http
          scrape_interval: 10s
          static_configs:
          - labels:
              host: dev-ai-pool1-9tjr7-6d2rk
              hostname: dev-ai-pool1-9tjr7-6d2rk
              k8s_node_name: dev-ai-pool1-9tjr7-6d2rk
              kubernetes_namespace: gpu-operator
              kubernetes_node: dev-ai-pool1-9tjr7-6d2rk
              node: dev-ai-pool1-9tjr7-6d2rk
              service: nvidia-dcgm-exporter
            targets:
            - nvidia-dcgm-exporter.gpu-operator.svc:9400
        - job_name: vllm
          kubernetes_sd_configs:
          - role: service
          relabel_configs:
          # Keep Services labelled app.kubernetes.io/part-of=vllm (rancher-ai-vllm
          # chart: engine service + engine-scrape service) OR legacy app=vllm
          # (dev-ai original deployment). Single keep rule over the joined pair.
          - action: keep
            regex: (vllm;.*)|(.*;vllm)
            separator: ";"
            source_labels:
            - __meta_kubernetes_service_label_app_kubernetes_io_part_of
            - __meta_kubernetes_service_label_app
          - regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            source_labels:
            - __address__
            - __meta_kubernetes_service_annotation_prometheus_io_port
            target_label: __address__
          - action: keep
            regex: 'true'
            source_labels:
            - __meta_kubernetes_service_annotation_prometheus_io_scrape
          metric_relabel_configs:
          # SUSE Observability expects underscores in metric names:
          # vllm:prompt_tokens_total -> vllm_prompt_tokens_total
          - action: replace
            regex: vllm:(.*)
            replacement: vllm_$1
            source_labels:
            - __name__
            target_label: __name__
          scrape_interval: 10s
        # Qdrant — vector database component. The scrape job name becomes
        # service.name on the collected metrics, and transform/qdrant below
        # tags those metrics with suse.ai.component.type=vectordb so the
        # component shows up under "Vector Databases" in the SUSE AI section.
        - job_name: qdrant
          scheme: http
          scrape_interval: 10s
          static_configs:
          - labels:
              kubernetes_namespace: ${env:SUSE_AI_NAMESPACE}
            targets:
            - ${env:SUSE_AI_RELEASE}-qdrant.${env:SUSE_AI_NAMESPACE}.svc.cluster.local:6333
          metric_relabel_configs:
          - action: keep
            regex: 'qdrant_collection.*|qdrant_grpc.*|qdrant_app_info.*'
            source_labels:
            - __name__
  service:
    pipelines:
      logs:
        exporters:
        - otlp_grpc
        - debug
        processors:
        - k8s_attributes
        - memory_limiter
        - batch
        receivers:
        - otlp
      metrics:
        exporters:
        - otlp_grpc
        - debug
        processors:
        - k8s_attributes
        - transform/qdrant
        - memory_limiter
        - batch
        receivers:
        - prometheus
        - otlp
      # OpenSearch metrics: elasticsearch receiver -> resource/opensearch tags
      # the component as a search engine, then the shared resource + batch
      # processors normalize before export.
      metrics/opensearch:
        exporters:
        - otlp_grpc
        - debug
        processors:
        - resource/opensearch
        - memory_limiter
        - batch
        receivers:
        - elasticsearch
      metrics/infer-applications:
        exporters:
        - otlp_grpc
        processors:
        - filter/genai-metrics-only
        - filter/exclude-already-tagged
        - transform/infer-applications
        - k8s_attributes
        - batch
        receivers:
        - otlp
      metrics/infer-models:
        exporters:
        - otlp_grpc
        processors:
        - filter/genai-metrics-only
        - groupbyattrs/infer-models
        - transform/infer-models
        - k8s_attributes
        - batch
        receivers:
        - otlp
      metrics/infer-providers:
        exporters:
        - otlp_grpc
        processors:
        - filter/genai-metrics-only
        - groupbyattrs/infer-providers
        - transform/infer-providers
        - k8s_attributes
        - batch
        receivers:
        - otlp
      traces:
        exporters:
        - routing/traces
        processors:
        - k8s_attributes
        - memory_limiter
        - batch
        receivers:
        - otlp
        - jaeger
        - zipkin
      traces/model-relations:
        exporters:
        - otlp_grpc
        - debug
        processors:
        - filter/genai-spans
        - groupbyattrs/model-relations
        - transform/model-relations
        - batch
        receivers:
        - routing/traces
      traces/provider-relations:
        exporters:
        - otlp_grpc
        - debug
        processors:
        - filter/genai-spans
        - transform/provider-relations
        - batch
        receivers:
        - routing/traces
      traces/sampling:
        exporters:
        - otlp_grpc
        - debug
        processors:
        - batch
        receivers:
        - routing/traces
      traces/topology:
        exporters:
        - topology
        processors:
        - transform/topology-provider
        - batch
        receivers:
        - routing/traces
extraEnvs:
- name: K8S_CLUSTER_NAME
  value: dev-ai
- name: SUSE_AI_NAMESPACE
  value: hr-assistant
# Release name prefix of the hr-assistant Helm release, used to reach the
# qdrant/opensearch services. Set to the release name you used in Rancher
# (e.g. hr-assistant-1-1787597048). The chart names its services
# <release-name>-qdrant / <release-name>-opensearch.
- name: SUSE_AI_RELEASE
  value: hr-assistant-1-1787597048
extraEnvsFrom:
- secretRef:
    name: open-telemetry-collector
global:
  imagePullSecrets:
  - name: application-collection
  - name: suse-registry
image:
  pullPolicy: IfNotPresent
  registry: registry.suse.com
  repository: ai/containers/suse-ai-opentelemetry-collector
  tag: 0.149.0
imagePullSecrets:
- name: suse-registry
mode: deployment
ports:
  metrics:
    enabled: true
presets:
  kubernetesAttributes:
    enabled: true
    extractAllPodLabels: true
